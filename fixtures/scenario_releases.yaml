# The fixture scenarios' release blocks (DN-018 ADDENDUM-00 section 3; HB-69 step 2). AUTHORED by the scenario author.
#
# The release quantity is an input, stated by whoever knows it, never a default. The fixtures are synthetic scenarios
# whose author states their inputs (the worked-example wind is one), so each fixture with a known container states one
# here, with its basis. The basis is a held document: ERG 2024 methodology Table 2.3 (erg2024-methodology p. 22), the
# mixed rail and highway shipment profile for gases, prints a shipment amount of 80,000 kg for a DOT Class 105/112 tank
# car and 20,000 kg for an MC331 cargo tank. It is an example profile (its footnote: "Data provided are for chlorine
# trifluoride (UN 1749)"), so the source says so, and that this is not the car's own papers.
#
# The fixtures whose container is `unknown` (and open water) state no block, on purpose: their briefs keep "release
# quantity not given". No fixture states a hole size, on purpose: the alternative release keeps "hole size not given",
# so the display review sees both states. The schema is docs/schema/scenario_release.schema.json
# (hazbrief.brief.release); scenario_manifest.py (a build tool held privately) and scripts/build_scenario_briefs.py carry each block into
# fixtures/scenarios.yaml and docs/briefs/<id>/scenario.json beside the server's `incident`, which does not change.

releases:
  csx-point-of-rocks-day:
    quantity_kg: 80000
    quantity_source: "scenario author's stated quantity; basis ERG 2024 methodology Table 2.3 (an example profile), not this car's papers: DOT Class 105/112 tank car, 80,000 kg"
