  # HB-110 Part 0 (DN-020 ADDENDUM-01 section 2 item 3; HB-110 ADDENDUM-00): the three fixtures that carry the other
  # DN-001 classes state a container (test_build_ics_201.py (a test held privately) SCENARIOS: Highway tank truck or trailer) and a
  # quantity, from the first held source on ADDENDUM-00's ladder that gives one: the ERG 2024 methodology's mixed rail
  # and highway shipment profiles, which the methodology itself applies to a material with no profile of its own: "If
  # no information other than data on packing authorizations within 49 CFR was known, and if the material was
  # authorized for bulk transport, the mixed rail and highway shipment profile was used" (erg2024-methodology PDF
  # p. 20). Each material is authorized for bulk (49 CFR 172.101 column 8C, cfr49-govinfo-bulk: LPG 314, 315; gasoline
  # 242; nitrogen, refrigerated liquid 318). Each fixture is on a highway, so the profile's bulk highway row: Table 2.3
  # (gases) row 2, MC331 cargo tank, 20,000 kg, PDF p. 22; Table 2.2 (liquids) row 2, DOT 312 cargo tank, 20,000 kg,
  # PDF p. 21. The row's container is the profile's; where the ERG's road trailer chart (erg2024-en-pdf pp. 15-16)
  # names another cargo tank for the material, the source says so. 49 CFR 178's cargo-tank specifications, the
  # ladder's third rung, are not in the held bulk (cfr49-govinfo-bulk is volume 2, Parts 100 to 177) and were not
  # needed. The masses are the table's; no gallons were converted.
  un1075-fire-i81:
    quantity_kg: 20000
    quantity_source: "scenario author's stated quantity; basis ERG 2024 methodology Table 2.3 (an example profile), not this tank's papers: MC331 cargo tank, 20,000 kg; the ERG road trailer chart gives LPG the MC331 (erg2024-en-pdf p. 15)"
  un1203-i83:
