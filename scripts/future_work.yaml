# HB-196 Part A items 1 and 2: which graph records docs/FUTURE_WORK.md renders, and under which list. Each item names
# its record (an Issue by its id prefix, or a decision of the register by its id); the item's text is that record's own
# text, read by future_work.py (a build tool held privately), never typed here. `heading` is a label only. A known limit names the committed
# files that show it (`evidence`); the generator refuses a file `git ls-files` does not list. `operator_issue` names
# the operator's review Issue a finding came from, whose name carries the date the operator stated it.
#
# An item with no record gets its Issue first (the HB-196 evidence (held privately)), then appears here.

output: docs/FUTURE_WORK.md
issue_source: "seldon issue list --json"
decision_source: the decision register (held privately)

