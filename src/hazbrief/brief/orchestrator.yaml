# hazbrief.brief.orchestrator: channels, sections and the render order (DN-011 D1 to D3; HB-41).
#
# CHANNELS: one per tool. `timeout_s` is the channel's whole budget for one assembly. The source catalog
# (docs/sources/catalog.yaml) states no timeout, so every channel uses this per-tool default (DN-011 D1's
# fallback). Each is bounded below the recording client's own `call_timeout_s` (120 s, evidence.yaml), except the
# ICS 201, whose budget is the client's, because it runs the six others inside one call. `sources` are the catalog
# rows the tool reads, kept equal to the catalog by tests/test_brief.py (the CFR row on the footprint included,
# HB-41 ADDENDUM-00 point 5). `needs` names the channel whose output is this one's input: the three tools that
# take the footprint start when it lands, not at once (HB-41 RESULT, premises).
#
# The timeouts are set from the server's own bound, 30 s per upstream request (config.upstream_timeout_seconds):
# - footprint: two NWS requests, so 2 x 30 s;
# - population: about 16 sequential Census and TIGERweb requests on the seed scenario (fixtures/scenarios.yaml);
#   with the 120 s client cap, 115 s;
# - facilities: 11 requests, with the same cap;
# - pack-only and file-only tools: well inside 15 s;
# - the ICS 201: the client's 120 s.
channels:
  protective_action_footprint:
    timeout_s: 60
    needs: null
    sources: [nws:points, nws:gridpoints, pack:cfr172, pack:erg, pack:hazard_classes, pack:flag_rules, code:astral]
    # HB-207 item 12: a structured error with no `assessment` is the ERG's answer to an input it cannot read (the
    # material, the placard or the guide number: `AssessmentError`), so its line names the ERG, not the live sources
    # (before HB-207 a material the index does not print was printed as an NWS failure)
    input_error_sources: [pack:erg]
  assess_incident:
    timeout_s: 15
    needs: null
    sources: [pack:erg, pack:cfr172, pack:cameo, pack:hazard_classes, code:astral]
  material_response_guidance:
    timeout_s: 15
    needs: null
    sources: [pack:erg]
  population_at_risk:
    timeout_s: 115
    needs: protective_action_footprint
    sources: [census:dhc2020, census:acs5, census:cre, tigerweb:census2020, lodes]
  facilities_in_footprint:
    timeout_s: 115
    needs: protective_action_footprint
    sources: [usgs_structures, usgs_3dhp, bts_ntad, cms:nursing_homes]
  receiving_hospitals:
    timeout_s: 30
    needs: protective_action_footprint
    sources: [usgs_structures, cms:hospitals, census_geocoder]
  build_ics_201:
    timeout_s: 120
    needs: null
    sources: [nws:points, nws:gridpoints, census:dhc2020, census:acs5, census:cre, tigerweb:census2020,
              tigerweb:current, usgs_structures, usgs_3dhp, bts_ntad, cms:hospitals, census_geocoder,
              cms:nursing_homes, lodes, pack:erg, pack:cfr172, pack:cameo, pack:hazard_classes, pack:flag_rules,
              code:astral]

# SECTIONS (DN-011 D2): the channels each reads; `after`, the sections it renders after (D3: guidance and the ICS 201
# render after the sections they read). A section renders when its channels and its `after` sections are settled,
# rendered or degraded.
sections:
  map:
    title: Map
    channels: [protective_action_footprint]
  footprint:
    title: Protective action footprint
    channels: [protective_action_footprint]
    # The ERG fire isolation line (DN-021 sections 1 and 7; HB-129 Part A step 2): on every brief whose guide prints a
    # fire isolation distance, whether or not fire is involved, beside the spill isolation and protective action rows.
    # The distance and the guide's own fire paragraph come from the ERG pack (`guide_distances`, the guide's
    # `public_safety` items), with the guide's page; the ring is drawn only when the incident says fire (the server's
    # `fire_isolation` zone). A guide that prints only a fire evacuation distance (Guides 161 to 166 and 172) has no
    # isolation distance and no line.
    # the row names no condition: the guide's own paragraph does (a tank, a rail car or trailer; Guide 112)
    fire_row: "Fire isolation"
    fire_line: "{distance} in all directions. {tag}, {doc} p. {page}: \"{quote}\""
  flags:
    title: Flags
    channels: [protective_action_footprint]
  population:
    title: Population at risk
    channels: [population_at_risk]
  facilities:
    title: Facilities in the footprint
    channels: [facilities_in_footprint]
    # HB-114 step 5a.1 (Issue 0a7ff478; engineering standards section 4, no silent failure): a record whose `errors`
    # name failed queries answered in part. The section is degraded with this line, prints what did answer, and prints
    # each failed category as not available with its source and the error's class, never a count.
    partial_label: "partly unavailable: {n} of the tool's queries failed ({sources}); each category they answer is marked not available below"
    # the source each count's error names: facilities_in_footprint's `_error` calls (structures for the three
    # structure categories, the CMS file for nursing homes, 3DHP for waterways, "NTAD rail" for both rail counts)
    category_source:
      schools: USGS National Structures Dataset
      hospitals: USGS National Structures Dataset
      emergency_services: USGS National Structures Dataset
      nursing_homes: CMS Nursing Home Provider Information
      waterways: USGS 3D Hydrography Program (3DHP)
      rail_segments: NTAD rail
      grade_crossings: NTAD rail
    # an error's class, by the opening words of the client's own messages (hazbrief.utils: UnrecordedExchangeError's
    # "No recorded exchange for GET", PageCapExceeded's cap); an unlisted message prints as the tool sanitized it
    error_classes:
      - {starts: "No recorded exchange", class: "no recorded answer in this replay (UnrecordedExchangeError)"}
      - {starts: "Upstream service returned status", class: "the service answered with an error status (UpstreamServiceError)"}
      - {starts: "Upstream service request failed", class: "the request failed (UpstreamServiceError)"}
    not_available: "not available: {source}, {why}"
    no_error_named: "its source named no error"
    # HB-142R ADDENDUM-01 section 2 (the operator's record (b) of 2026-11-09): the inside list first, the people and
    # places to warn; then the nearest services outside, the ones that respond (DN-019 ADDENDUM-02 F6). Neither
    # replaces the other, and the label line says why each is there.
    inside_heading: "Inside the footprint: the people and places to warn"
    outside_heading: "Nearest outside the footprint: the services that respond"
    why_line: "Inside are the places the protective action reaches, so they are warned; outside are the nearest fire, EMS, police and hospitals, the services that respond from beyond it (DN-019 ADDENDUM-02 F6)."
    inside_none: "none of these in the footprint"
    outside_not_derived: "not derived: {why}"
  hospitals:
    title: Receiving hospitals
    channels: [receiving_hospitals]
  guidance:
    title: Response guidance
    channels: [material_response_guidance, assess_incident]
    after: [footprint]
  ics201:
    title: Incident Briefing (ICS 201)
    channels: [build_ics_201]
    after: [map, footprint, flags, population, facilities, hospitals, guidance]

# D3: the page order, the map first.
render_order: [map, footprint, flags, population, facilities, hospitals, guidance, ics201]

# What a section without its channel says (D2): "unavailable: <source>, <reason>, <attempted at>".
degraded_label: "unavailable: {source}, {reason}, attempted at {attempted}"
# What a section says when its channel was deliberately not called: the scenario declares it `not_run` with a reason
# (HB-49: the Census tools during the census.gov outage, the ICS 201 over a shape). Nothing was attempted, so no time.
not_run_label: "not run: {source}, {reason}"

# The event stream (DN-022 section 3; HB-130R Part A): what an `alert` names as its receipt where the alert is not a
# cue line (whose receipt is the held page `map.cue_block` names), and the words for where `run_started` read the zone.
stream:
  # a degraded section's alert is its DN-011 D2 label, which names the source, the reason and the time itself
  degraded_receipt: "{title}: the section's DN-011 D2 label"
  # a flag's alert is the rule's own sentence; the rule is in the flag_rules pack (HB-12b), and it was evaluated in the
  # footprint's record, whose DN-010 D4 label line follows (HB-131R item 1: every panel line's receipt in that form)
  flag_receipt: "flag rule {rule_id} ({priority}), flag_rules pack; {record}"
  # HB-131R ADDENDUM-01 section 1: an `alert_withdrawn` names the record whose settle made the alert false, as the
  # DN-010 D4 label line of that record. These are its words where the settle had no record of its own: a channel that
  # ended without one, the derived pass (DN-015), which runs after every channel, and (never seen; a guard) a withdrawal
  # before any channel settled.
  withdrawn_by_no_record: "{tool}: settled {state} with no record ({reason})"
  withdrawn_by_derivations: "the derivations over held data (DN-015), drawn after every channel settled"
  withdrawn_before_any_record: "no channel has settled yet"
  zone_from:
    held: "NWS points for the spill, read with the brief's wind record"
    default: "the labels' default zone, until the footprint names the incident's"

# The live page (DN-022 sections 3 and 8; HB-130R Part B): `hazbrief brief --serve` serves it on this host and port.
# The route has no authentication, so it binds loopback only (HB-89); `hazbrief.brief.web` refuses any other host.
web:
  host: 127.0.0.1
  # NO MEASURED BASIS: a free high port on this machine at HB-130R's launch. Not 8765 (another tool holds it), 8770
  # (the display review, scripts/serve_review.yaml), 8080 (the MCP server and the container's published port) or 8081
  # (the review's MCP server), HB-115's findings. `--serve` binds before it reports ready and refuses a taken port.
  port: 8790
  # how often the SSE route writes a comment line while a run is quiet, so a proxy or the browser does not drop it.
  # NO MEASURED BASIS: well inside the 45 s idle limits browsers and proxies commonly apply; a replay never idles.
  keepalive_s: 15
  # The evidence log's validation cell (HB-131R item 2): what the record says of the call (`activity.is_error`), then
  # the label's current-or-stale cell (`labels.state_cell`, the appendix's column). A DN-010 record carries no other
  # validation field.
  log_validation: "{answered}; {state}"
  # HB-157 item 12 (DN-024 section 3.7): the time-step control's words. `play_ms`: the interval between steps while
  # playing; NO MEASURED BASIS: long enough to read the step's readout once.
  time_control:
    play_ms: 1500
    play: "Play"
    pause: "Pause"
    aria: "Modelled time from the release"
    range_aria: "Step after the release"
    wind: "wind at the step: from {deg} degrees, {kmh} km/h ({source})"
    no_wind: "no wind held for the step's hour"
    no_pop: "residents under the reached area: not read"
    past: "(the wind stepper is at hour {hour}, past the modelled time; the outline is this step's)"
    none: "the puff ran no steps"
    none_line: "No modelled time on this brief: {why}"
    # HB-163 ADDENDUM-01 item 2: on a dense release the one button is "Animate": off on load, it shows the cloud at a
    # time (the harm path and every other modelled layer hidden), plays from the release, and the same button stops it
    # and restores the layers the reader had. The step buttons and slider show the cloud at that time while stopped.
    # HB-192 (DN-024 ADDENDUM-01 decision 5): the one button is "Play", off by default; it steps the 15-minute frames'
    # outlines (drawn from the stored mesh), with Animate's layer set and its exact restore.
    animate: "Play"
    stop: "Stop"
    animate_aria: "Play the modelled cloud's 15-minute frames from the release"
    # the layers Animate keeps drawn (ADDENDUM-01 item 2: base map, incident, ERG zones, sited points, the cloud by
    # level; the side lines stay, ADDENDUM-06 item 1; the wind arrow and field move with the clock); every other
    # layer is hidden while it runs
    animate_keep: [spill, location, initial_isolation_zone, protective_action_zone, fire_isolation, harm_aegl1,
                   harm_aegl2, harm_aegl3, uncertainty_lines, sited_points, wind, wind_field, roads]
    cloud_pop: "residents under the cloud: not computed for the step"
    # the cloud's step buttons: one every 30 minutes (the slider holds every frame, 15 minutes apart; HB-192)
    button_every_min: 30
    # HB-192 (DN-024 ADDENDUM-01 decisions 3 and 4): the status line under the control. `done` on the built page;
    # `live` as each frame lands ({to}: the frame's H+, {of}: the horizon's, {k} of {n} frames); `made`: how the
    # frames record was made; `lookup`: a point lookup's words ({ppm}, {band}, {ratio}, {worst}: the stated accuracy,
    # docs/evidence/hb192/lookup_accuracy.tsv; {why}: why none was read).
    frames:
      setting: "at the {m} m vertical setting"
      no_setting: "at the engine's default vertical setting"
      # beside the step's time, short; the full sentence is its title
      done: "Computed: {n} frames to {to}, {setting}"
      title: "Modelled cloud: {n} frames, every {every} minutes to {to}, {setting}. The engine had the first after
        {first_s} s and the last after {last_s} s ({made})."
      live: "Computing: to {to} of {of}, {setting}; frame {k} of {n}"
      made:
        run: "computed by this brief's own run"
        backfill: "computed by running the held request again; its contours equal the held run's"
      lookup:
        at: "About {ppm} ppm here at this frame ({band}). Approximate: read from the frame's {spacing} m mesh; at the
          brief's measured points (named places, suggested points and roadblocks) the mesh reads {ratio} times the point's own
          sensor at the median, {worst} at the worst."
        below: "Below {floor} ppm here at this frame (under the mesh's floor)."
        outside: "Outside this frame's mesh: below every level here."
        unread: "No lookup: {why}"
        file: "the frames' mesh is read when the page is served, not from a file"
      below_levels: "below every level"
  log_answered: "the tool answered"
  log_errored: "the tool returned an error"
  # HB-139: the page's query gave weather fields after the run had started under others (one brief, one weather
  # source, DN-019 ADDENDUM-01 section 1)
  weather_after_start: "this brief's run has already started under another weather selection; one brief has one weather source. Stop the server and start it again with the fields you want"
  # HB-141 (F4; HBD-219): the one banner a served replay prints above the map; a live serve prints none. {recorded} is
  # the date, or the first and last dates, of the brief's records' `endedAtTime` in the incident's zone, read when the
  # run finishes (`checklist.recorded_dates`); before that it is `replay_recorded_pending`.
  # HB-158 item 5: no status word ("live") on the page; the fact in plain words
  replay_banner: "Replay of a brief recorded {recorded}; it makes no call to any source; every as-of is the recording's."
  replay_recorded_pending: "(the recording's date is read when the run finishes)"
  replay_recorded_range: "{first} to {last}"
  # HB-141 item 6 (F10; HBD-224): the guide content opened as closable panels on the live page, each a view over the
  # guidance section as the static page prints it (after the load read), byte for byte. A panel is the run of the
  # section's top-level elements from the one whose text is `start` (an <h4> heading, or a <p><strong> line, matched
  # whole) to the element before the next of `rank` or higher (h4 = 1, strong line = 2); `whole` is the section's
  # whole body (the guide and its sources line). A guide without the heading offers no chip for that panel.
  panels:
    - {id: erg_guide, title: "ERG guide", section: guidance, whole: true}
    - {id: protective_clothing, title: "Protective clothing", section: guidance, start: "PROTECTIVE CLOTHING", rank: 2}
    - {id: fire_response, title: "Fire response", section: guidance, start: "FIRE", rank: 2}
    - {id: public_safety, title: "Public safety", section: guidance, start: "Public safety", rank: 1}
  # where the checks a served page records are written (HB-141 item 2): one JSONL file per serve, `--checks FILE` to
  # replay a recorded one. Under the session state (held privately), which git ignores (HB-137's rule for runtime state)
  checks_dir: the session state (held privately)
  # HB-154 (DN-019 ADDENDUM-03; the operator's reviews of 2026-11-09 and 2026-11-10): the live page is a fixed shell
  # that fills the window and never scrolls: the header, then layers and legend on the left, the map in the centre
  # with the tabbed panel under it, and the operator checklist on the right. Each region scrolls inside itself.
  shell:
    # NO MEASURED BASIS: the column widths of the mockup the operator accepted (claude.ai artifact "hazbrief operator
    # shell", version 7; Issue 605428b3 item 1), which hold the layer rows' symbols and the checklist's receipts at
    # the page's 13 px and 14 px type. The collapsed strip holds the toggle and the checklist's count.
    left_px: 288
    right_px: 360
    strip_px: 40
    # the under-map panel's body, once a tab is open, as a share of the window's height (item 7: "about a quarter")
    panel_share: 0.25
    # VR-145 (Issue fb8fa3fb): below this width the left column starts collapsed. 1100 px is where the map keeps at
    # least 400 px between both open columns (288 + 360 + 2 x 1 px borders + 400 = 1050, under 1100 with the strips'
    # margins); the HB-154 evidence (held privately) captures the map at 1280 x 720 with both open and at 1024 x 768 with the left
    # collapsed. Measured on those captures, not on a field study.
    collapse_left_below_px: 1100
    # below this width the regions stack (map, checklist, layers, panel) and the document scrolls; the map takes a
    # fixed height and moves only under two fingers or a modifier key (Google Maps' "cooperative" gesture handling,
    # documented by Google, not held). NO MEASURED BASIS: the mockup's stacking width; a phone is under 500 px.
    stack_below_px: 860
    stacked_map_px: 420
    # HB-155 ADDENDUM-05 item 1: the block under the checklist with the suggested points' rows ("Move", "Use
    # suggestion"), printed by `static/siting.js` only when the points layer is drawn; its id is `siting`
    siting_title: "Command post, triage and staging (suggested)"
    siting_move: "Move"
    siting_use: "Use suggestion"
    siting_pick: "Click the map, or pick a place below"
    siting_cancel: "Cancel"
    siting_moved: "moved by the operator"
    siting_review: "review"
    # ADDENDUM-02 item 5 and ADDENDUM-05 item 4: the Area radius control (buttons, HBD-328), under Responders; a step
    # being read shows the Retrieving state's shape and word; on a replay a step never recorded reads this, beside
    # its mark (a reason, not a state)
    area_title: "Area radius"
    area_nearest: "Widen to nearest"
    area_nearest_short: "nearest"
    area_not_recorded: "not recorded for this replay"
    # the sentence at the checklist's head (item 8, from the purpose record, Issue 97736b94 item 3)
    purpose: "This list is here to make you check the picture against what you know, not to be completed."
    # HB-158 item 5 (G5): the block HB-154 reserved below the checklist for the sited points is gone; HB-155 adds
    # "Command post, triage and staging (suggested)" when the siting layer exists. The checklist's note on how a tick
    # is recorded opens under `ticks_about` (item 3; ADDENDUM-01 item 6: no wall of text at first sight).
    ticks_about: "How a tick is recorded"
    # the Zones and models tab's line over the map section's side panel (ADDENDUM-01 item 6)
    detail_title: "First actions, weather and models"
    # the collapsed checklist's strip: the count of unticked Verify items (HBD-218 as amended), and, after the
    # critical set is in, the items a later arrival changed (ADDENDUM-01 item 4)
    collapsed_count: "{n} to verify"
    collapsed_updated: "{n} updated"
    # an item a later arrival added, changed or withdrew, after the critical set (ADDENDUM-01 item 4)
    updated: "updated {time}"
    # ADDENDUM-01 item 4: the stage the page waits for before it shows the checklist, the layer list and the tabs
    # (`orchestrator.StageReached`); until then the map carries one assembling view, the sources with their marks
    critical_stage: critical
    assembling_title: "Assembling the brief"
    assembling_count: "{n} of {m} sources retrieved"
    # HB-189 (DN-028 ADDENDUM-14 decision 4): the moving cloud's hours as the engine hands each over (`cloud_hour`)
    cloud_hour: "Modelled cloud: hour {h} computed, its levels read ({n})"
    assembling_note: "The checklist, the layers and the tabs appear once every source the first screen needs is in."
    # ADDENDUM-01 item 5: the header's status strip, one mark per MCP server and per channel (each a public source
    # group behind one of the server's tools), with a count; a click opens the Sources and MCP servers tab
    strip_title: "Sources: {counts}. Open the Sources and MCP servers tab."
    strip_counts: {retrieving: "{n} retrieving", retrieved: "{n} retrieved", recorded: "{n} recorded", failed: "{n} could not retrieve"}
    # the progress count at the strip's end: the sections in, of those declared
    progress: "{n} of {m} sections in"
    # item 6 (G2; HB-158 ADDENDUM-02 item 1, the merged case on HBD-340's one clock): the header's wind chip reports
    # the brief's wind record and the hour the clock is on, with the previous and next hour beside it; the buttons
    # move the one clock (`#wind-hour`), never a second hour control
    wind_chip: "Wind {wind}"
    wind_hour: "hour {hour}"
    wind_prev: "Previous hour"
    wind_next: "Next hour"
    # item 3: a row's detail can be kept open while another row of its region opens
    pin: "Keep open"
    pinned: "Kept open"
    # HB-173 (DN-028 ADDENDUM-04 decision 7): the two engines' checklist item's link to its pop-out, the measure's TEVV
    # section, opened in a new tab
    engines_link: "Both methods' results and the reason"
    # DN-028 ADDENDUM-10 decision 4: under a stable class the checklist's one line opens SCICHEM's Conditions of use
    conditions_link: "Under what conditions each engine is used"
    # ADDENDUM-01 item 6: a tab's first line, read at a glance: its sections' state marks, then the one-line figures
    # of these layer rows (each the row's own figure, so nothing is computed for the summary)
    tab_rows:
      responders: [receiving_hospitals, nearby_services, emergency_services, siting_routes]
      population: [population, modelled_population]
      zones: [initial_isolation_zone, protective_action_zone, fire_isolation, dense_gas]
    # the under-map panel's tabs, in order (item 7; HB-158 item 8, every tab earns its place, no more than fit the bar
    # at 1280 px). `sections`: the brief sections the tab holds, swapped in from the stream as they settle (every
    # section of RENDER_ORDER but the map is in exactly one tab); `body`: a panel that is not a section (the guide
    # slices, the sources view with the evidence log under it, the map section's side panel, the commander's report).
    # A tab's state mark is its sections' worst state. HB-158 merged "Footprint and flags" with "First actions, weather
    # and models" (both are the zones and what was modelled beside them) and "Evidence log" with "Data sources" (the
    # log is the calls behind the sources table), and renamed the tabs in plain words (DN-019 ADDENDUM-04 section 5).
    tabs:
      - {id: responders, title: "Responders", sections: [facilities, hospitals]}
      - {id: population, title: "Population", sections: [population]}
      - {id: zones, title: "Zones and models", body: detail, sections: [footprint, flags]}
      - {id: guide, title: "ERG guide", body: guide, sections: [guidance]}
      - {id: ics201, title: "ICS 201", sections: [ics201], body: report}
      - {id: sources, title: "Sources and MCP servers", body: sources}
    # the view switch and the live overlays at the map's top right (item 6). A view button is a basemap of
    # `map.fallback_tiles` (its `label`); a Satellite view exists only when a tile entry is `view: satellite` (none is
    # held keyless; with a Google key Google's own map types apply). An overlay button exists only when one of its
    # layers is drawn, and toggles the first that is: Traffic waits on a traffic layer (HB-145).
    overlays:
      - {id: traffic, label: Traffic, layers: [traffic]}
      - {id: radar, label: Radar, layers: [radar, radar_snapshot]}
      - {id: cloud, label: Cloud, layers: [satellite, satellite_snapshot]}

# The operator checklist (DN-019 ADDENDUM-02 section 3; HB-141; HBD-217, HBD-218): the alerts panel's items grouped,
# each with a checkbox; a tick appends a `check` event and an untick an `uncheck` event to the brief's stream with the
# item's stream id and the server's time, and nothing else. Checking gates nothing.
checklist:
  # the groups in page order, each with the alert kinds (and `source`, one line per channel) it holds, in that order
  # HB-154 ADDENDUM-01 section 2: the first place of "Verify before acting" is reserved for the wind-state item
  # (`wind`, Issue 13bf6e7f's "wind unknown" line, built by a later task); no event carries that kind yet.
  groups:
    # HB-157 ADDENDUM-02 item 2: the forecast wind shift is a Verify item after the wind's; item 14's arrival line is
    # a group of its own (HB-157 ADDENDUM-01 section 2 item 7), not the reserved wind list
    # HB-155 item 8 (ADDENDUM-03 item 6; ADDENDUM-04 item 3): a wind record change marks the suggested points
    # "review", a Verify item of its own (`siting_review`), never in the wind's reserved list; a point moved inside
    # the exclusion area or reached by the modelled cloud is a Warning (`siting`)
    - {id: verify, title: "Verify before acting", kinds: [wind, shift, cue, integrity, siting_review]}
    # HB-173 (DN-028 ADDENDUM-04 decision 7): the two engines' item is a Warning ranked after the flags and the siting
    # warnings, so no life-safety item is displaced (NUREG-0700 r4 4.2.8-1: "Lists of alarm messages should be
    # segregated by alarm priority with the highest priority alarms being listed first"); a disagreement (`engines`)
    # and, where they agree, its one line (`engines_agree`) take the same place
    - {id: warnings, title: "Warnings", kinds: [flag, siting, engines, engines_agree]}
    # DN-028 ADDENDUM-10 decisions 2 to 4: under a stable class the two engines' item is no warning; its one line
    # (`engines_stable`: the levels are SLAB's, SCICHEM's forecast-following cloud is unresolved, every time is from that
    # run) is about the modelled times, so it stands with them
    - {id: arrival, title: "Modelled arrival", kinds: [arrival, engines_stable]}
    # HB-158 item 4 and ADDENDUM-01 item 3: a layer that could not be drawn (`layer_gap`, worded as its layer list
    # line) and a source past its horizon (`old`, its age, whether it updates by itself and what to do) are Data gaps
    # items beside the degraded sections' labels. The Sources group opens closed (`open: false`): the header's status
    # strip carries each source's state at a glance (ADDENDUM-01 item 5), and item 9 wants every group heading and the
    # Verify items on screen without scrolling.
    - {id: gaps, title: "Data gaps", kinds: [degraded, layer_gap, old]}
    - {id: sources, title: "Sources", kinds: [source], open: false}
  # ADDENDUM-01 item 3 (the operator, Issue ad8be8a7 item 1): an old source answers three questions on its one line:
  # how old it is, whether the page will update it by itself, and what the reader does. No refresh route exists (the
  # brief reads each channel once), so no row offers a Refresh button and none says one exists.
  old_line: "{source}: {as_of}, {old}. {update} {action}"
  old_update: "It does not update by itself."
  old_action:
    replay: "Nothing to do: this is a recording."
    recorded_pack: "Nothing to do on this page: it is read from a file hazbrief holds, refreshed when the packs are rebuilt."
    live_call: "Nothing to do on this page: build the brief again to read it again."
  old_receipt: "{title}: its sources line"
  # the standing integrity items (section 3 item 1: "this is a brief, not a measurement; the footprint is ERG guidance;
  # verify the wind against what you see"), emitted once after run_started; `section` is the section each bears on
  integrity:
    - text: "This is a brief assembled from public data, not a measurement at the scene."
      receipt: "DN-019 ADDENDUM-02 section 3 item 1; the page's EXERCISE banner (DN-012 section 7)"
      section: ics201
    - text: "The footprint is the ERG's protective action guidance, not a model of this release."
      receipt: "DN-019 ADDENDUM-02 section 3 item 1; DN-001 invariant 1 (no dispersion model)"
      section: footprint
    - text: "Verify the wind against what you see at the scene."
      receipt: "DN-019 ADDENDUM-02 section 3 item 1; the wind record the footprint is oriented on (HB-133)"
      section: map
  # a Sources line: the channel's tool, then its state once settled
  source_line: "{tool}: {state}"
  source_pending: "pending"
  source_receipt: "the evidence log's row for this call"
  # the ICS 201's "Operator checks" annex (section 3 item 3; ADDENDUM-01 section 2): the form it imitates, then each
  # check and uncheck in order with its time (the report), or the static page's line (no check is recorded there)
  annex_title: "Operator checks"
  annex_form: "This annex imitates the ICS 214 Activity Log: each entry is one operator action and the time the server recorded it."
  annex_static: "No check is recorded in this render; the live brief (hazbrief brief --serve) records each tick on its checklist."
  annex_none: "No item has been checked."
  annex_row: "{time}: {action} ({group}) {text}"
  annex_questions: "Questions about this brief are answered in the session that generated it; the page holds none."
  actions: {check: "checked", uncheck: "unchecked"}
  # the report's first line (section 3 item 5)
  report_first: "Verify before acting: {unticked} of {total} items unticked."
  # the receipt line printed under a withdrawn item (HB-131R ADDENDUM-01 section 1: struck through, not removed)
  withdrawn_line: "withdrawn: {receipt}"

# The Data sources view (HB-154 item 9; Issue 97736b94 item 5): one row per channel the brief's evidence log holds
# (each a tool of the hazbrief MCP server), naming the public sources its record's label names (or, with no record,
# the catalog rows the tool reads), what the brief uses it for, the outcome, and the as-of. Built from the channel
# states and records the brief already holds: no call. Shown as the live page's fifth tab, at the foot of the static
# page and after the commander's report's annexes.
data_sources:
  # HB-158 item 7 (G7; the operator, Issue 02bfc66e): the view is "Sources and MCP servers" and opens with the MCP
  # servers: each server contacted, the tools called on it with their call counts, its state and as-of; then the
  # public sources behind them; then the brief application's own derivation, under its own heading (it is not an MCP
  # server, HB-158 ADDENDUM-02 item 4); then the evidence log. Built from the evidence log; no call.
  title: "Sources and MCP servers"
  server: "hazbrief MCP server"
  # the hazbrief server's seven tools, by name (README; src/hazbrief/tools/), listed whether or not this brief called
  # each, with its call count
  server_tools: [protective_action_footprint, assess_incident, material_response_guidance, population_at_risk,
                 facilities_in_footprint, receiving_hospitals, build_ics_201]
  servers_title: "MCP servers"
  servers_columns: ["Server", "Tools called (calls)", "State", "As of"]
  sources_title: "Public sources behind the tools"
  derivation_title: "Fetched by the brief application, not an MCP server"
  log_title: "Evidence log: every call"
  not_called: "not called"
  # an outcome as one of the three states (`page.states`; ADDENDUM-01 item 2); the outcome's own words stay in the
  # row's detail as the reason
  outcome_states: {answered: retrieved, nothing: retrieved, unreachable: failed, not_contacted: failed, pending: retrieving}
  note: "Every MCP server and public source this brief contacted or reads from, with what came back. Built from the evidence log's records; no call is made to show it."
  # the four outcomes, in the operator's plain words
  outcomes:
    answered: "answered"
    nothing: "reached, nothing available for this place"
    unreachable: "could not be reached"
    not_contacted: "not contacted (replay, or not configured)"
  # a channel state's outcome. `error` is read by its reason: a replay with no recorded answer made no contact; an
  # upstream that failed or answered with an error status could not be reached; any other error is the tool's own
  # answer that it holds nothing for this incident. An `ok` record whose body is a structured error (DN-003's no-key
  # Census case) is not configured, so not contacted.
  by_state:
    ok: answered
    timeout: unreachable
    missing: unreachable
    skipped: not_contacted
    not_run: not_contacted
  error_by_reason:
    - {starts: "error: No recorded exchange", outcome: not_contacted}
    - {starts: "error: Upstream service", outcome: unreachable}
  error_default: nothing
  structured_error: not_contacted
  pending: "pending"
  # a row's "what it gives": the titles of the sections the channel feeds (`sections.*.channels`)
  columns: ["Source", "What it gives", "Outcome", "As of"]
  no_as_of: "no as-of: nothing came back"
  # HB-157 ADDENDUM-01 item 6: the population under the modelled area, a derivation's own fetch (`derive.
  # modelled_population`), one row after the MCP channels; `unrecorded` is derive._why's replay reason
  derivation:
    server: "hazbrief brief application (derivation)"
    sources: ["TIGERweb 2020 tabulation blocks", "2020 Census DHC (P1, P18)", "LEHD LODES workplace area characteristics"]
    gives: "Population at risk: the figure under the modelled area"
    unrecorded: "its upstream answer is not recorded"
  # HB-155 ADDENDUM-02 item 4 (ADDENDUM-05 item 5): the services in the area's stages, fetched by the brief application
  area_stage:
    sources: ["USGS National Structures Dataset (fire, EMS and police stations)", "TIGERweb primary and secondary roads (travel time)"]
    siting_sources: ["USGS National Structures Dataset (schools and public buildings)", "TIGERweb parking lot roads (S1780)", "BTS NTAD Truck Stop Parking"]
  # HB-215 Part B (the operator, 2026-11-20 21:49 EST: "a nice graphical stoplight chart of the servers and what was
  # on, what was not ... organized by public data ... just to show that what we're doing is orchestrating the call of
  # data"): the view opens with every source the brief called, one row each, grouped under plain headings, each with
  # a mark whose SHAPE and WORD say its state, so colour is never the only signal (NUREG-0700 Rev. 4 guideline
  # 1.3.8-10, "Color coding should be redundant with some other display feature"; FAA HF-STD-001B 5.6.6.2.1.5,
  # "Color-coding should be redundant to some other means of coding"; docs/evidence/hb215/display_prior_art.md).
  # Read from the brief's own records: the channel rows above (`rows`), the derivations' exchanges (each a dict with
  # an `api` and its `retrieved` time), the location record, and the engines' records; it adds no call.
  board:
    title: "Every source this brief called"
    note: "One row per source, by kind; the mark's shape and its word say the same thing."
    # the static page's one control to the view, at its top beside the TEVV and Timeline links; {counts} is the
    # board's sources by status in words ("14 answered, 3 not called"); the basemap rows are the browser's, not counted
    link: "Sources: {counts}"
    columns: ["State", "Source", "Gave the brief", "As of"]
    # the four states the operator named, and waiting (a live run's call not yet back). `recorded` is `answered` on a
    # served replay: the shell relabels it (static/shell.js hbRecorded), as it relabels the three states; the static
    # page and its replay print the same bytes (DN-011 D7)
    statuses:
      answered: {glyph: "●", words: "answered"}
      recorded: {glyph: "●", words: "answered from the recording"}
      not_called: {glyph: "○", words: "not called"}
      failed: {glyph: "✕", words: "failed"}
      pending: {glyph: "◌", words: "waiting"}
    # a source's status from its contributions: the first of this order that any contribution has
    precedence: [answered, failed, pending, not_called]
    # a channel row's outcome (`outcomes`) as a status
    from_outcome: {answered: answered, nothing: answered, unreachable: failed, not_contacted: not_called, pending: pending}
    # a derivation with no exchange failed when its reason holds one of these (the HTTP client's own failure words,
    # hazbrief.utils: every UpstreamServiceError opens "Upstream"; a timeout says so); any other reason is a call not
    # made (a replay without the answer, a layer a replay never draws, a footprint that is not there)
    failed_markers: ["Upstream ", "timed out"]
    # each derivation's upstreams, for a derivation that holds no exchange (its reason says why); one that holds
    # exchanges is read from their own `api`
    derived_apis:
      forecast: [nws]
      observation: [nws]
      wind_field: [nws]
      radar: [nowcoast]
      satellite: [nowcoast]
      terrain: [epqs, usgs_3dep]
      downstream: [usgs_3dhp, nldi]
      roads: [tigerweb]
      rail: [bts_ntad]
      establishments: [census]
      nearby: [usgs_structures, tigerweb]
      siting: [usgs_structures, tigerweb, bts_ntad]
      modelled_population: [tigerweb, census]
      modelled_cordons: [tigerweb]
    # the engines, each read from its derivation's `state` (a model's as-of is the wind it ran on: the forecast's
    # newest exchange); a run that was made but refused (a record and a reason) failed; `not_available` is a run not
    # made (the material is not resolved, so no engine is named)
    model_states: {drawn: answered, computed: answered, modelled: answered, not_run: not_called, not_applicable: not_called, not_modelled: not_called, not_drawn: not_called, not_available: not_called}
    groups:
      - {id: federal, title: "Public federal data"}
      - {id: state_local, title: "State and local data", none: "None: this brief called no state or local source."}
      - {id: models, title: "Models"}
      - {id: packs, title: "hazbrief's own tables"}
      - {id: basemap, title: "The basemap"}
    # one row per source: its heading, its plain name, what it gave the brief (at most six words), and what in the
    # brief's records names it: `labels` (a record label's source names, as `rows` prints them), `apis` (an exchange's
    # upstream, `settings.upstream_base_url`), `location` (the location record's `source`), `derived` (an engine's
    # derivation), `tile` (the index of a no-key basemap in `map.fallback_tiles`) or `google` (the keyed basemap)
    sources:
      - id: census_api
        group: federal
        name: "Census Data API"
        gives: "Residents, households, vulnerability, establishments"
        labels: ["2020 Census DHC", "2020 Census DHC (P1, P18)", "ACS 2020-2024 5-year", "Community Resilience Estimates 2024"]
        apis: [census]
      - id: tigerweb
        group: federal
        name: "Census TIGERweb"
        gives: "Blocks, roads and boundaries"
        labels: ["TIGERweb Census 2020 tabulation geography", "TIGERweb Census Current", "TIGERweb 2020 tabulation blocks", "TIGERweb parking lot roads (S1780)", "TIGERweb primary and secondary roads (travel time)"]
        apis: [tigerweb]
        location: ["tigerweb:current"]
      - id: census_geocoder
        group: federal
        name: "Census Geocoder"
        gives: "Addresses placed on the map"
        labels: ["Census Geocoder"]
        apis: [census_geocoder]
        location: ["census:geocoder"]
      - id: lodes
        group: federal
        name: "Census LEHD LODES"
        gives: "Workers by block"
        labels: ["LEHD LODES8", "LEHD LODES workplace area characteristics"]
      - id: nws
        group: federal
        name: "National Weather Service"
        gives: "Wind forecast and observations"
        labels: ["National Weather Service, api.weather.gov points", "National Weather Service gridpoint forecast"]
        apis: [nws]
      - id: nowcoast
        group: federal
        name: "NOAA nowCOAST"
        gives: "Radar and satellite imagery"
        apis: [nowcoast]
      - id: usgs_structures
        group: federal
        name: "USGS National Structures Dataset"
        gives: "Schools, hospitals, stations, public buildings"
        labels: ["USGS National Structures Dataset", "USGS National Structures Dataset (fire, EMS and police stations)", "USGS National Structures Dataset (schools and public buildings)"]
        apis: [usgs_structures]
      - id: usgs_hydro
        group: federal
        name: "USGS 3D Hydrography and NLDI"
        gives: "Streams and the downstream path"
        labels: ["USGS 3D Hydrography Program (3DHP)"]
        apis: [usgs_3dhp, nldi]
      - id: usgs_elevation
        group: federal
        name: "USGS elevation (3DEP)"
        gives: "Ground height and terrain"
        apis: [epqs, usgs_3dep]
      - id: land_cover
        group: federal
        name: "National Land Cover Database (MRLC)"
        gives: "Land cover for ground roughness"
        apis: [mrlc, nlcd_cog]
      - id: bts_ntad
        group: federal
        name: "BTS National Transportation Atlas"
        gives: "Rail lines, crossings, truck parking"
        labels: ["BTS NTAD rail layers", "BTS NTAD Truck Stop Parking"]
        apis: [bts_ntad]
        location: [bts_ntad]
      - id: cms
        group: federal
        name: "CMS provider data"
        gives: "Hospitals and nursing homes"
        labels: ["CMS Hospital General Information and Provider of Services", "CMS Nursing Home Provider Information"]
      - id: erg
        group: federal
        name: "PHMSA Emergency Response Guidebook 2024"
        gives: "Protective action distances and guides"
        labels: ["ERG 2024"]
      - id: hmt
        group: federal
        name: "49 CFR 172.101 Hazardous Materials Table"
        gives: "Hazard class and placard"
        labels: ["49 CFR 172.101 Hazardous Materials Table"]
      - id: cameo
        group: federal
        name: "NOAA CAMEO Chemicals"
        gives: "Chemical properties and reactivity"
        labels: ["CAMEO Chemicals"]
        apis: [cameo]
      - id: pubchem
        group: federal
        name: "NIH PubChem"
        gives: "Chemical names and identifiers"
        apis: [pubchem]
      - id: mdot_sha
        group: state_local
        name: "Maryland SHA milepoints"
        gives: "The milepost placed on the road"
        apis: [mdot_sha_milepoints]
        location: ["lrs:mdot_sha"]
      - id: penndot
        group: state_local
        name: "PennDOT road segments (PASDA)"
        gives: "The milepost placed on the road"
        apis: [pasda_penndot]
        location: ["lrs:penndot"]
      - id: vdot
        group: state_local
        name: "Virginia DOT road network"
        gives: "The milepost placed on the road"
        apis: [vdot_lrs]
      - id: scichem
        group: models
        name: "SCICHEM"
        gives: "Dense cloud by level, over time"
        derived: cloud
      - id: slab
        group: models
        name: "SLAB"
        gives: "Dense cloud's reach, second method"
        derived: dense_gas
