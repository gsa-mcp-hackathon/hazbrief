       method: "A Gaussian puff by hazbrief (hazbrief.brief.puff) on Pasquill-Gifford rural curves (EPA-454/B-95-003b, ISC3 Volume II, Tables 1-1 and 1-2), released at the rates of section T42, on the brief's wind and the stability class of section T43.",
       limits: ["A passive Gaussian puff is not a dense-gas model (DN-018 section 9)."],
       further: ["ALOHA 5.4 (EPA and NOAA): give it the same release rate, wind and stability class; compare its Gaussian threat-zone distance at the same threshold."]}
