    # HB-171 (DN-029): the threat timeline, its first-view rows and its exercise events list; its assumed occupancy
    # lines are listed here as assumptions (HB-171 ADDENDUM-01 item 2)
    - {n: 55, id: threat_timeline, tools: [protective_action_footprint, population_at_risk, facilities_in_footprint],
       what: "The threat timeline: each place the modelled cloud reaches, by level, in time order, with what held sources say to consider and who can confirm it.",
       method: "A pure ordering of the modelled cloud's held record (DN-029): one row per place and level from the record's points (arrival, minutes above and clear of that level), a clear row when the outermost level leaves a place that can shelter, and one row per level at the first populated block reached (the engine's 5-minute steps). Ordered by arrival, the worst level first, a place expected to be occupied first, then nearest the source. Considerations are quotations of held documents; occupancy is an expectation from typical hours by kind of place.",
       not_checked: ["Whether any place is occupied at the row's time: the timeline states an expectation from typical hours, never a status.", "The school term and any place's own hours: not held (Issue filed by HB-171)."],
       limits: ["Every time is the model's (sections T45 to T49). By day with no stable hour whether the second valid method agrees (section T57) is at the top of the Timeline page. Where any hour of the horizon is class E or F each level's planning area is the moving cloud's area together with SLAB's extent check (section T56), every time is the moving cloud's, from SCICHEM's run at a stated 1.25 m vertical setting, and is marked with it (section T58), every place the run reaches is listed with its time, and a place inside SLAB's extent check only is listed with no time, because SLAB's area is one wind's with no times (DN-028 ADDENDUM-14 decision 10).", "Population rows read the engine's 5-minute steps, the points' rows its 2-minute samples.", "Residents are the 2020 Census count by block, shared by area; workers are LODES jobs by workplace block, not people present at an hour."]}
    # HB-173 (DN-028 ADDENDUM-04): the planning shape (HBD-390) and the measure of agreement between the two dense-gas
    # methods, whose section is the checklist item's pop-out
    - {n: 56, id: planning_shape, modelled: true, tools: [protective_action_footprint],
       what: "The planning area: where any hour of the horizon is class E or F, each health-effect level's area, which is the moving cloud's area together with SLAB's extent check at that level.",
       method: "Stability is read across the brief's hours: the class at every forecast hour of the 6-hour horizon by the brief's own rule, and the stable treatment where any is E or F (DN-028 ADDENDUM-14 decision 2). Each level's planning area is the area the moving cloud reaches at that level at any time, SCICHEM's run at a stated 1.25 m vertical setting (decision 3), drawn filled in the level's colour with its time control, together with SLAB's area outside it, its extent check, drawn as a dashed outline with no fill, told apart without colour (decision 6). SLAB's area is drawn to where a level closes or to the release hour's wind's travel in the horizon times 1.3, whichever is nearer (decision 5). A part its engine cut (the time bound, SCICHEM's domain) makes the level's reach and counts \"at least\". The headline count, the named places and the candidate blocks read AEGL-3 and AEGL-2, the levels the guidebook's protective action distances rest on (decision 7); the AEGL-1 band is outlined and counted separately (decision 8, Desktop's assumption); each count is stated with its two parts; the suggested points read the cloud (section T45). Every time is the moving cloud's and is marked with the setting. Before ADDENDUM-14 the roles were the other way round (ADDENDUM-12: SLAB's area filled, SCICHEM's dashed), before that the area was SLAB's alone (ADDENDUM-10), and before that the farther-reaching engine's (HBD-390).",
       not_checked: ["A field trial of this release: no observation of this incident is held.", "Verified only, not validated against observations of this release: SLAB's comparison with measured stable arcs is a condition of its use (section T59)."],
       limits: ["Supported by observation for SLAB to 800 m on stable dense releases (DN-028 ADDENDUM-06; section T59). Beyond 5 km no held evaluation of either engine exists; the shape beyond that distance is a model's extrapolation (HB-173 ADDENDUM-01 section 2).", "SLAB's area is one time-averaged footprint on the release hour's wind; it does not turn with the forecast (section T7), and its time bound is that wind's travel, not the forecast's.", "The moving cloud is not converged at its setting and reads below the measured stable trials (section T58); no page calls it resolved, converged or validated.", "The suggested points do not read the planning area; they read the cloud (DN-028 ADDENDUM-04 decision 5)."]}
    - {n: 57, id: agreement, tools: [protective_action_footprint],
       what: "Whether the two dense-gas methods agree on this release: the measure, each level's two reaches and areas, and the reason where one is traced.",
       method: "SCICHEM's lines run of the drawn cloud's request (the same release, wind and inputs, with crosswind lines of sensors on the release hour's wind, HB-167's comparison sensors) against SLAB's centreline: at each distance to 20 km where both hold a concentration, SLAB's time average over SCICHEM's largest running mean over the brief's averaging time. The two disagree where any pair lies outside the held factor of three, stated for models given the same release: \"within a factor of plus and minus three at any given downwind distance out to 20 km\" (Hanna et al. 2016, Atmospheric Environment 125, pp. 252 to 253). By day with no stable hour a disagreement is one Warning on the checklist and an agreement one line in its place (DN-028 ADDENDUM-04 decisions 2 and 7); where any hour of the horizon is class E or F both engines' areas are drawn together on the first view, the difference is a stated condition of use (sections T58 and T59), and it raises no warning (DN-028 ADDENDUM-10 decision 4, ADDENDUM-14). No threshold is set on reach; each level's reaches are stated beside the measure.",
       not_checked: ["The measure compares one model with another, never with an observation; verified only, not validated against observations."],
       limits: ["Both held factors are stated for models given the same inputs; where the two requests differ the line names the input (by day, the boundary layer: SCICHEM calculates its own while SLAB reads the class).", "The lines lie on the release hour's wind; where the forecast turns the cloud, its centreline can leave them.", "The reason shown is only one a held trace supports, quoted from the design record; elsewhere it reads \"not traced\" (DN-028 ADDENDUM-04 decision 4)."]}
    # HB-184 (DN-028 ADDENDUM-10 decision 5): each engine's conditions of use, generated from one table
    # (src/hazbrief/brief/conditions.yaml), each row with its evidence file and source. They rest on held evidence
    # files, not on a tool call, so no Sources row names them (`tools: []`)
    - {n: 58, id: conditions_scichem, tools: [],
       what: "Conditions of use, SCICHEM: the conditions it is used under and why, what it was compared with, the distances covered and what is not established.",
       method: "One row per condition, generated from one table (src/hazbrief/brief/conditions.yaml), each naming its evidence file, the line of that file that holds the figure, and the held source it rests on. The form follows the model summaries of 40 CFR Part 51, Appendix W (Guideline on Air Quality Models), which state each model's regulatory use and its accuracy against observations (ecfr-40-cfr-51-appendix-w-2025, Addendum A, p. 78), and the list of conditions that can produce unreliable results in the ALOHA User's Manual (2007, p. 28).",
       not_checked: ["Verified only, not validated against observations of this release: every comparison in the table is with field trials, not with this incident."],
       limits: ["Under the stable treatment it runs at a stated 1.25 m vertical setting, an approximation: no setting run is converged, and whether the grid or the model is the cause of its stable shortfall is not decided (DN-028 ADDENDUM-08, ADDENDUM-13, ADDENDUM-14); the table states it as a condition of use, not as a verdict on the model.", "The published performance of the tools the field accepts on dense releases, and the requirement hazbrief holds itself to against them, are section T60."]}
    - {n: 60, id: benchmarks, tools: [],
       what: "Benchmarks and requirement: the tools the field accepts for a dense release, what each publishes about its own performance on the same field trials, its stated limits and settings, the requirement hazbrief holds itself to, and its status against each.",
       method: "The requirement is held in the project's graph (BENCH-0 to BENCH-9) and read here from its projection. Each published value is cited to the held document and page that prints it, with the trial, the arcs, the pairing and the weather input beside it. Simpson et al. 2020 and the 17-model comparison define MG as observed over predicted (Simpson eq. 6 p. 9; the comparison p. 25): above 1 is under-prediction. hazbrief's own held comparisons pair a run with measured stable arcs as their tables state (docs/evidence/hb176/summary.tsv, docs/evidence/hb177/hb176_restated.tsv).",
       not_checked: ["No hazbrief run on Jack Rabbit II trials 1 or 6 is held, so BENCH-1 to BENCH-7 are not yet evaluated; Trial 7 (BENCH-8, BENCH-9) is run and scored, and its lines are under Checked against (HB-206). A different measurement, not comparable with the rows: on other stable dense trials at 212 to 800 m, SLAB as hazbrief runs it is within a factor of two of all 10 measured arc maxima, and SCICHEM's mean, which the brief draws, is below all 8 by a factor of 3.5 on geometric average (1.8 when scored as a peak, as its authors score it); no status is drawn from it."],
       limits: ["A minimum of equivalence and an objective of better are stated for the same trials and the same statistic only; no row is called met where the trials or the statistic differ.", "ALOHA states that it makes no prediction more than an hour after a release begins or past 10 km from the release point (epa-aloha-users-manual-2007 p. 30); HPAC's published runs on these trials were made with measured and with forecast weather, and a brief runs on the forecast wind."]}
    - {n: 59, id: conditions_slab, tools: [],
       what: "Conditions of use, SLAB: the conditions it is used under and why, what it was compared with, the distances covered and what is not established.",
       method: "As section T58, from the same table.",
       not_checked: ["Verified only, not validated against observations of this release: every comparison in the table is with field trials, not with this incident."],
       limits: ["One time-averaged footprint on the release hour's wind: no times, and it does not turn with the forecast (section T7).", "Under the stable treatment its area is drawn to where a level closes or to the release hour's wind's travel in the horizon times 1.3, the nearer (DN-028 ADDENDUM-14 decision 5); a reach that far is a model's extrapolation, compared with measurement only to 800 m."]}
