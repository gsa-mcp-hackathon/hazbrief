       method: "The NWS gridpoint forecast for the spill's cell at the incident hour, an observation or a stated wind, as the weather source selects (DN-022 section 5; HB-133); no computation."}
    - {n: 7, id: dense_gas, modelled: true, tools: [protective_action_footprint],
       what: "A dense-gas footprint at the class's level of concern and the other held levels, from SLAB.",
       method: "SLAB (D. L. Ermak, User's Manual for SLAB: An Atmospheric Dispersion Model for Denser-than-Air Releases, Lawrence Livermore National Laboratory, June 1990), run by hazbrief on the source term of section T42; the footprint read from SLAB's time-averaged plane table at each level. For a flammable class the level of concern is 60 percent of the LFL, the fraction and its reason (concentration averaging) as NOAA Technical Memorandum NOS OR&R 43, ALOHA (Areal Locations of Hazardous Atmospheres) 5.4.4 Technical Documentation (November 2013), p. 90, states them.",
       # HB-176 (DN-028 ADDENDUM-06): compared with measurement on held stable field trials. HB-178 (Issue d16f6882):
       # the comparison and the trials of the brief's own material follow this line, generated from trials.yaml with
       # their numbers read from the held evidence (test_hb176_against_observation.py (a test held privately) re-derives them)
       checked: ["SLAB test cases 1 to 4 reproduce at build (deploy/models/check_cases.py, every build of the models image)."],
       not_checked: ["A field trial of this release: no observation of this incident is held."],
       # HB-173 item 11 (Issue 54dfacf4): T7's limit as it now stands
       limits: ["SLAB is one time-averaged footprint on one wind, the release hour's: its tables are a time average, so the layer is not stepped and does not turn with the forecast (DN-024 section 3.5).", "On a dense release by day it is the second method beside the drawn cloud, a layer off by default. Where any hour of the horizon is class E or F its area outside the moving cloud is every level's extent check in the planning area (section T56), drawn to where a level closes or to the release hour's wind's travel in the horizon times 1.3, the nearer; no time is read from it (DN-028 ADDENDUM-14). Its conditions of use are section T59."],
       further: ["ALOHA 5.4 (EPA and NOAA): give it the material, the tank and hole of section T42 and the brief's wind and stability class; compare its threat-zone distance at the same level of concern."]}
    - {n: 8, id: puff_source_term, modelled: true, tools: [protective_action_footprint],
