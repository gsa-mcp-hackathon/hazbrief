       method: "Read from ERG 2024 Table 1 (or Table 3) for the material, the spill size and the day or night period (Emergency Response Guidebook 2024, pp. 292 to 293), oriented downwind on the brief's one wind record; no computation.",
       limits: ["The ERG states that its distances may be adjusted only by technically qualified personnel (Emergency Response Guidebook 2024, p. 282)."]}
