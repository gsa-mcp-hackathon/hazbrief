    - {n: 42, id: source_term, modelled: true, tools: [protective_action_footprint],
       what: "The release the modelled layers are computed on: its rate, duration and the assumptions it rests on.",
       method_by_model: {"two-phase flashing release": "Homogeneous Nonequilibrium Model (section 3.4.5, p. 27), tank cooling (3.4.1, p. 22), head-space gas (3.4.6, pp. 28-30) and flashed fraction (6.3.2, p. 68) of NOAA Technical Memorandum NOS OR&R 43, ALOHA (Areal Locations of Hazardous Atmospheres) 5.4.4 Technical Documentation (November 2013), implemented by hazbrief.", "evaporating pool": "Briscoe and Shaw spreading (3.4.4.2, p. 26), Brighton's evaporation (3.3.1, pp. 12-15) and the energy balance (3.3.2-3.3.3, pp. 16-21) of NOAA Technical Memorandum NOS OR&R 43, ALOHA (Areal Locations of Hazardous Atmospheres) 5.4.4 Technical Documentation (November 2013), implemented by hazbrief."},
       assumptions_from: ["The hole, a seam 40 inches long and 0.1 inch wide at the bottom of the tank: the tank-car example of US EPA and NOAA, ALOHA User's Manual, February 2007, p. 75, which calls the bottom the worst case.", "The storage temperature at the air temperature: the default \"Chemical stored at ambient temperature\" of the ALOHA User's Manual, February 2007, p. 70.", "A pool spilled at once onto default soil when the ground is unknown: the ALOHA User's Manual, February 2007, p. 56.", "The jet centre at ground level: \"Source height is zero if the chemical is released at ground level\" (ALOHA User's Manual, February 2007, p. 132).", "The shortest source is one minute, \"termed an instantaneous release\" (NOS OR&R 43, p. 11)."],
       limits: ["The method limits any source to one hour (NOS OR&R 43, p. 19).", "The tank wall's heat flux is not modelled: the tank cools by evaporation alone (NOS OR&R 43, p. 22, states a wall of 2 cm steel and 10 cm foam and no conductivity)."],
       further: ["ALOHA 5.4 (EPA and NOAA): give it the material, the tank, the hole and the storage temperature above with the brief's air temperature; compare its release rate and duration with this section's.", "Indoor concentration: the ALOHA User's Manual, February 2007, p. 105, estimates it from a building's air exchange rate; give a run of that method the outdoor concentration of section T7 and compare."]}
    - {n: 43, id: stability_class, tools: [protective_action_footprint],
       what: "The Pasquill-Gifford stability class of the present atmosphere.",
       method: "Turner's key as EPA states it (EPA-454/R-99-005, Meteorological Monitoring Guidance for Regulatory Modeling Applications, 2000, section 6.4.1, Tables 6-4 to 6-6, pp. 6-12 to 6-14), from the wind speed, cloud cover and ceiling, and the sun's elevation.",
       limits: ["Very stable air is among the conditions that make a dispersion estimate unreliable: \"Gas concentrations within the cloud can remain high far from the source.\" (US EPA and NOAA, ALOHA User's Manual, February 2007, p. 28)."]}
    - {n: 44, id: time_steps, modelled: true, tools: [protective_action_footprint],
       what: "The time steps the modelled outline, arrival bands and range are drawn at.",
       method: "Every 15 minutes to 1 hour, then hourly, to a 6-hour horizon; the run ends at the first step whose interval reaches no new place, or at the horizon (DN-024 section 3.6; HB-157 item 10)."}
    # HB-163 (ADDENDUM-05 item 1): the dense release's cloud, its times and the selection rule, T45 up
    - {n: 45, id: harm_path, modelled: true, tools: [protective_action_footprint],
       what: "The modelled cloud's harm path: the area each health-effect level reaches at any time, for a dense release.",
       method: "SCICHEM 3.4 (EPRI, commit 156625ef), built with gfortran in the models image and run by hazbrief on the release of section T42, the held NWS gridpoint forecast hour by hour and a sensor at every drawn point (DN-028). At every 5-minute output the mean concentration's contour at each level, on the ground plane, against the level's 60-minute value; the harm path is the union of the steps. Levels and colours as the held convention draws them: \"If you choose three LOCs, [the program] will display the threat zones in red, orange, and yellow. By default, the red zone represents the worst hazard.\" (NOAA Office of Response and Restoration, ALOHA Threat Zones and Other Output); a threat zone is the area where the level \"is predicted to exceed your Level of Concern (LOC) at some time after a release begins\" (the same page).",
       # HB-176 (DN-028 ADDENDUM-06): compared with measurement on held stable field trials. HB-178 (Issue d16f6882;
       # its ADDENDUM-01 section 1): the comparison, the mean the brief draws and then the same run scored as its authors
       # score a peak, and the trials of the brief's own material follow this line, generated from trials.yaml with their
       # numbers read from the held evidence (test_hb176_against_observation.py (a test held privately) re-derives them)
       checked: ["The models image's engine reproduces EPRI's own Intel build on HB-165's check case, a chlorine release, every value within 1 percent (deploy/models/scichem/check/check_engine.py, at every image build; HB-167)."],
       # HB-173 (Issue e3dd1145): the engine's own reported field evaluation is the document's, not a check hazbrief made
       not_checked: ["A field trial of this release: no observation of this incident is held.", "The engine's own field evaluation, which hazbrief has not run: the SCICHEM 3.4 Technical Documentation (section 13.4) reports for dense releases (Burro, Coyote, Maplin Sands, Thorney Island, Desert Tortoise, Goldfish), pooled with no stability subset, a geometric mean of 1.098 and a geometric variance of 1.355 (DN-028 ADDENDUM-02 section 3 item 1)."],
       limits: ["Albedo and Bowen ratio are the user's guide defaults, not held for the site; by day the Bowen ratio moves the AEGL-2 reach from 0.79 to 2.4 times (docs/evidence/hb167/input_sensitivity.tsv; Issue 14402727).", "Flat terrain: no elevation grid is given to the engine (DN-028 decision 3).", "One surface station at the release: the forecast is uniform over the domain at each hour (DN-028 decision 3).", "By day, where it and SLAB disagree on this release by more than the held factor of three, the checklist raises a Warning and section T57 gives both results. Where any hour of the horizon is class E or F it runs at a stated 1.25 m vertical setting, an approximation that is not converged (DN-028 ADDENDUM-08, ADDENDUM-13): it is the primary layer, its stepped levels on the first view with the time control and each hour read from the engine as it lands; each level's planning area is its area together with SLAB's extent check (section T56); its times are marked with the setting, and no warning is raised (DN-028 ADDENDUM-14). Its conditions of use are section T58.", "Under a stable class it runs on the class's PGT layer (HBD-389); on the published stable railcar case it is still 2 to 4 times below its own published curve (DN-028 ADDENDUM-03 section 1). The held evaluations of stable dense releases reach 5 km at most, for either engine (DN-028 ADDENDUM-02 section 3 items 6 and 7).", "The levels are the instantaneous ensemble mean against each level's 60-minute value (DN-027 ADDENDUM-00 parks matching the exposure duration)."]}
    - {n: 46, id: cloud_at_time, modelled: true, tools: [protective_action_footprint],
       what: "The modelled cloud at each output step, by level: what the time control and Animate show.",
       method: "The steps of section T45's run, every 5 minutes from the release until the cloud leaves the domain or the run ends; at each step each level's area. While the release lasts the cloud is attached to the source; when it ends the cloud detaches and travels on the forecast wind of each hour (DN-028)."}
    - {n: 47, id: cloud_extent, modelled: true, tools: [protective_action_footprint],
       what: "The possible extent of the cloud's outermost level: its area together with the area where the chance of exceeding the level is 5 percent or more.",
       method: "Per step, the outermost level's area united with the area where the engine's clipped-normal probability of exceeding the level is at least 5 percent (SCICHEM 3.4 Technical Documentation, section 12.2.1; HBD-378); on the harm path, the union over the steps.",
       limits: ["The probability covers turbulent fluctuation of the concentration only, not the forecast wind's uncertainty: the run sets the large-scale variability off (ENSM_TYPE NONE), the README's practice for domains under about 150 km, and no sourced value exists for it; the wind-direction lines (section T13) are its treatment (HBD-379).", "The 50 percent area is not drawn (Issue ff34d530)."]}
    - {n: 48, id: arrival_lines, modelled: true, tools: [protective_action_footprint],
       what: "For each named place and suggested point the cloud reaches: first arrival, minutes above the highest level reached, and the time it is clear.",
       method: "The engine's sensor at the place, 1.5 m above ground, every 2 minutes (section T45's run): arrival is the first sample above the outermost level, minutes above are the samples above the highest level reached, clear is the sample after the last above the outermost level (HB-167 Part C item 12)."}
    - {n: 49, id: roadblock_lines, modelled: true, tools: [protective_action_footprint],
       what: "For each roadblock the brief draws: whether the cloud reaches it, the highest level, first arrival, minutes above and the time clear.",
       method: "As section T48, at each roadblock and cordon position the brief draws (HB-167 ADDENDUM-01 item 1). The point is measured at 1.5 m; the drawn areas are on the ground plane, so at an edge the two can disagree (docs/evidence/hb163/edge_disagreements.tsv)."}
    - {n: 50, id: engine_rule, tools: [protective_action_footprint],
       what: "Which engine models the release: dense, passive or not classed, by the critical Richardson number.",
       method: "Ri_c = H g (rho - rho_a) / (rho_a U*^2), with H the source's characteristic dimension (a continuous source: H = sqrt(E pi / (4 rho U10)); a puddle: H = E / (rho U10 D)) and U* from the surface-layer profile; below 1 the release is passive (NOAA Technical Memorandum NOS OR&R 43, ALOHA (Areal Locations of Hazardous Atmospheres) 5.4.4 Technical Documentation (November 2013), section 4.4.1, pp. 46 to 47, and section 4.2, pp. 40 to 41). A dense release is modelled by section T45's engine and never by the puff; a passive one by the puff; one not classed by neither (DN-026).",
       limits: ["Two readings of the printed profile are assumptions (DN-026 section 3.2): its sign is the standard one, and the unstable branch's last term is pi/2."]}
    # HB-162R (DN-025 section 3 item 5; ADDENDUM-02 item 6: a new method takes T51 onward): a passive release's cloud by
    # level is the puff's run, drawn through T45 to T49's layers and lines; these are its sections
    - {n: 51, id: puff_harm_path, modelled: true, tools: [protective_action_footprint],
       what: "The modelled cloud's harm path for a passive release: the area each health-effect level reaches at any time, from the puff.",
       method: "The first-order passive Gaussian puff of section T8 (hazbrief.brief.puff), each puff carried on the forecast wind of every hour it travels, each hour's value held over that hour, its spread read at the distance travelled along its path (DN-025 section 3). At every 5-minute sample the field at the ground against each AEGL level's 60-minute value, its contour; the harm path is the contour of the field's running maximum at the run's end. Levels and colours as section T45 draws them.",
       not_checked: ["A field trial of this release: no observation of this incident is held."],
       limits: ["A passive Gaussian puff is not a dense-gas model (DN-018 section 9).", "One stability class for the whole run, the as-given hour's (DN-025 section 5).", "One forecast cell for the whole domain: the brief reads one gridpoint (DN-025 section 5).", "The levels are the field at an instant against each level's 60-minute value (as section T45)."]}
    - {n: 52, id: puff_cloud_at_time, modelled: true, tools: [protective_action_footprint],
       what: "The modelled cloud of a passive release at each sample, by level: what the time control and Animate show.",
       method: "The samples of section T51's run, every 5 minutes from the release until the run ends (the end rule of section T44, read at the outermost level); at each sample each level's area. While the release lasts the cloud is attached to the source; when it ends the cloud detaches and is carried on the forecast wind of each hour (DN-025)."}
    - {n: 53, id: puff_arrival_lines, modelled: true, tools: [protective_action_footprint],
       what: "For each named place and suggested point a passive release's cloud reaches: first arrival, minutes above the highest level reached, and the time it is clear.",
       method: "The field of section T51's run at the place, at the ground (0 m, the height its areas are drawn at), every 2 minutes: arrival is the first sample above the outermost level, minutes above are the samples above the highest level reached, clear is the sample after the last above the outermost level (DN-025 section 3 item 5)."}
