       limits: ["The ERG: \"the fire hazard distance should be used as an isolation distance and Table 1 should be used to protect downwind for residual material release.\" (Emergency Response Guidebook 2024, p. 282)."]}
    - {n: 4, id: spill, tools: [protective_action_footprint],
