# Who writes the narrative sections (DN-011 D4; HB-131R item 4): `none` is `author.NoAuthor`, the server's own text and
# no model; `model` is `model_author.ModelAuthor`, one call of the pinned CLI per section it writes. Off: no committed
# brief is built with the model (HB-131R, not in this task).
author: none

# The brief's model (DN-022 section 5; HB-131R items 4 and 5; AD-035): the narrative author and the question box, one
# class (`model_author.ModelAuthor`) behind one prompt file.
model:
  # `seldon models resolve <role> --json`: the model id, the pinned CLI and its arguments
  role: primary
  # `seldon models hold --run <name> --by <who>` around each call (AD-035-R7: the lock does not move under a run)
  hold_run: hazbrief-brief-model
  hold_by: hazbrief brief
  prompt: src/hazbrief/brief/prompts/brief_model.md
  # where a live call's transcript is written (gitignored); a replay reads the directory it is given
  transcripts_dir: logs/model_calls
  # NO MEASURED BASIS: one call's bound until a pilot measures one (HB-131R's recorded questions do; the RESULT says)
  timeout_s: 300
  # a failed call is a row in its transcript; it is asked again until it has been asked this many times in all
  max_attempts: 2
  # the sections the model author writes; every other section is the server's own text (NoAuthor's)
  sections: [guidance, ics201]
  # the question box: a question's length, an answer's sentences, and the input it may send (the brief's sections as
  # text, its records' label lines, its map's switches). The input ceiling refuses rather than truncates: a brief
  # whose text is longer is answered with a structured error. HB-131R measured the chlorine and Guide 111 briefs at
  # 49,714 and 38,139 characters of section text; NO MEASURED BASIS beyond that for the ceiling's margin.
  question_max_chars: 500
  max_sentences: 6
  max_input_chars: 120000
  not_in_brief: "not in this brief"
  # what the page's lede says when a model wrote the narrative sections
  lede_author: "a model wrote the narrative sections under the rules of src/hazbrief/brief/prompts/brief_model.md, and every number it printed is one a record holds"
  # what a section prints above the server's own text when the model author's reply is not printed
  author_refused: "The model's text for this section is not printed: {why}. The server's own text follows."
  author_failed: "The model's call for this section failed ({error}). The server's own text follows."

# The load read (HB-132R Part A; DN-022 section 6; `load_read`): the rule file, and the route of its one model rule (R2,
# a sentence about the sentence before it). The route is HB-131R's (`model_author.ModelAuthor`: the role, the timeout
# and the attempts above) with this read's own prompt and run name. Transcripts are committed beside the briefs'
# records, so a replay reads the verdicts and makes no call; the per-brief record of each read is written by
# the HB-132 evidence (held privately) into `records_dir`.
load_read:
  # the rule file is load_read_rules.yaml beside the module (`load_read.RULES_FILE`), whose sha256 the appendix prints
  prompt: src/hazbrief/brief/prompts/load_read.md
  # `seldon models hold --run` for every call this task's route makes (HB-132R's Spend line)
  hold_run: hb132-reads
  transcripts_dir: transcripts/ (held privately)
  records_dir: load_read/ (held privately)

# The entry form (HB-132R Part B; DN-022 section 7; `entry`): a point and a situation line. The line is parsed into
# three fields by one recorded call of the brief's model route (a bare UN number by rule, no call), each field with the
# span of the line it came from; the reader corrects them and builds on one click.
entry:
  prompt: src/hazbrief/brief/prompts/entry.md
  hold_run: hb132-reads
  # HB-207 item 1: a live entry's records are run output, not source (HB-137's rule for an operator tool's runtime
  # state): a live form's calls are recorded under `transcripts_dir`, and the build writes each fixture under
  # `fixtures_dir`, both under the session state (held privately), which git ignores. `held_transcripts` are the committed transcripts every
  # parser reads first, live or replay (the fixtures' lines, the seeded lines and HB-207's test lines are replayed in
  # every test); a recording meant to be kept is copied there and committed. test_hb207_live_path.py (a test held privately) holds that
  # a live entry leaves `git status --short` empty.
  transcripts_dir: the session state (held privately)
  held_transcripts: [the HB-132 evidence (held privately), the HB-207 evidence (held privately)]
  # where the build route writes each GUI-started brief's fixture before the build starts (HB-132R item 5)
  fixtures_dir: the session state (held privately)
  # HB-207 item 1: a served brief's live root (`brief/live_records.py`): the engine records a served live run makes
  # for requests no task recorded go here, at their repository-relative paths, not into fixtures/evidence/
  records_dir: the session state (held privately)
  # HB-208 (Issue 8907cf6c): each live served brief's upstream exchanges, one directory per run
  # (`brief/live_exchanges.py`), so its map draws the blocks and lines its counts came from; run output, not source
  exchanges_dir: the session state (held privately)
  # HB-154 ADDENDUM-01 section 1 item 3 (Issue 69466498: "nobody should take any of this for a real incident"): a
  # brief built live from this form carries the EXERCISE banner (`page.banner`) on its live page unless this says
  # false. Scenario fixtures and replays carry it whatever this says, and so does every export (the static page, the
  # ICS 201 and its print view: DN-012 section 7, "every screen and export"), which this key does not reach.
  exercise_marking: true
  # NO MEASURED BASIS: a situation line is one line; the longest line written for the 29 fixtures is under 120
  # characters (HB-132R RESULT)
  line_max_chars: 300
  # The container classes DN-017's properties pack and HB-110's source term know: packs/src/build_config.yaml
  # release.containers, the strings the fixtures carry (test_hb132_entry.py (a test held privately) keeps the two lists equal)
  containers: ["Rail tank car", "Highway tank truck or trailer", "unknown"]
  states: [burning, leaking, unknown]
  # A bare UN number (the rule-based fallback): "UN1017", "un 1017", "NA1993", "1017", nothing else on the line
  bare_un: '^\s*((?:UN|NA)?\s*\d{4})\s*$'
  # what the build reads where the line does not say: the ERG's own reading of an unknown spill size ("unknown: the
  # large spill distances apply", IncidentInput.spill_size) and its default surface (PHMSA's ERG app, land)
  spill_size: unknown
  where_spilled: land
  # HB-15's unidentified load: ERG Guide 111, "Mixed Load/Unidentified Cargo" (IncidentInput.guide_number)
  unidentified_guide: "111"
  # DN-021: an unknown chemical fire is toxic smoke until told otherwise; the smoke client reads the scenario's fire
  # block, whose emission rate and heat release no held source supplies yet (fixtures/scenario_fires.yaml's note)
  smoke_fire:
    kind: "unknown chemical fire"
    emission_rate_g_s: null
    heat_release_w: null
    note: "not supplied: DN-021 section 10 takes the VSMOKE manual's example until a held fuel-consumption source lands, and the manual is not held (Issue 69cc2af7)"
  routes:
    smoke: "an unknown material that is burning is toxic smoke until told otherwise (DN-021; DN-022 section 7), drawn under ERG Guide 111 (HB-15)"
    unidentified_load: "an unknown material that is leaking takes HB-15's unidentified-load route: ERG Guide 111, Mixed Load/Unidentified Cargo"
    guide: "a known material takes its ERG guide and HB-120's release routing"
  refusals:
    line: "a situation line is 1 to {n} characters"
    span_not_in_line: "the parse's {field} span {span!r} is not in the line as typed; nothing is built from a span the reader did not type"
    shape: "the parse is not {{material, container, state}}, each null or {{value, span}}: {detail}"
    container: "container {value!r} is not one of {allowed}"
    state: "state {value!r} is not one of {allowed}"
    state_unknown: "state is unknown: say burning or leaking. The ERG tables read whether fire is involved, and the form never guesses it"
    no_point: "no location: click the map, or type a location and resolve it"
    location_unresolved: "the location did not resolve: {label}"
    one_brief: "this server has already started a brief; one server serves one brief. Stop it and start it again for another"
    weather_query: "the entry form carries the weather source as its fourth field: choose it on the form, not in the address"
    # HB-207
    choice_shape: "the choice is not {{\"choices\": [{{id_number, name}}, ...]}}: {detail}"
    choice_not_in_index: "{id_number} {name!r} is not an entry of the ERG 2024 yellow index as printed; nothing is built from it"
    material_unconfirmed: "confirm the material: pick its ERG entry from the list, or set the material to unknown"
    quantity: "the release quantity {value} is not a positive number of kilograms"
    incident_time: "the start time {value} is not a date and time with its offset"
    past_time: "Today's weather services hold no forecast for {when}. State the wind (choose stated under Weather source, with its direction, speed and basis), or use now."
  # HB-207 items 3 to 5: a typed name the index does not print goes to one recorded call of this prompt, which chooses
  # among the index rows its words point to (hazbrief.index_candidates); the reader confirms one before anything is built
  choice:
    prompt: src/hazbrief/brief/prompts/entry_choose.md
    none_near: "“{typed}” is not a material in the ERG 2024 yellow index, and no entry there is spelled like it. Type the name on the shipping paper or the four-digit number on the placard, or set the material to unknown."
    none_named: "“{typed}” does not name any entry of the ERG 2024 yellow index. Type the name on the shipping paper or the four-digit number on the placard, or set the material to unknown."
    no_route: "“{typed}” is not printed in the ERG 2024 yellow index, and this form has no model route to read it. Type the name on the shipping paper or the placard number."
  # ADDENDUM-03 item 2: a line that names no material is asked for it in one question; the brief can still be built
  # under ERG Guide 111 (HB-15's unidentified load), and the modelled cloud waits on the material
  material_question: "What is leaking? Type the material's name or the four-digit number on the placard, if anyone can read it."
  waits_on_material: "Built now under ERG Guide 111 (unidentified load): the place, the wind, who is nearby, responders and hospitals. The material's own guide, its distances and the modelled cloud wait on the material."
  # ADDENDUM-03 item 1: the start time is always shown and confirmed
  start_time_note: "Change it if the release began earlier."
  # HB-207 item 10: a material the materials pack holds no AEGL cell for (at any duration), said in plain words on the
  # form and beside the Play control's place on the live page
  levels_none: "No health-effect levels (AEGL) are held for {id_number}, {name}, so no cloud can be drawn by level."
  # HB-207 item 13 and ADDENDUM-03 item 1: what the live page says of a brief the form built
  page:
    start_used: "Start time used: {when}"
    working: "still working: {names}"
    cloud_working: "the modelled cloud"
    no_cloud: "No modelled cloud is drawn: {why}"
  # HB-207 item 9: the operator's standing position (thread hz-20, 2026-11-19)
  worst_case: "A release is assumed worst case, all of it, until better information arrives."
  # HB-207 item 8: the release quantity the form proposes, a cell of the held ERG 2024 methodology's shipment profiles
  # (erg2024-methodology). Table 2.3 (PDF p. 22, printed p. 10; parsed block 203) for gases, Table 2.2 (PDF p. 21,
  # printed p. 9; block 198) for liquids. Each table is an example profile for one material, so the source says so.
  # A storage state with no table (a solid, or none stated) or a container no row names asks the reader.
  # test_hb207_live_path.py (a test held privately) holds every cell against its block.
  profiles:
    doc: erg2024-methodology
    kind_by_state:
      pressure_liquefied: gas
      refrigerated_liquid: gas
      ambient_liquid: liquid
    tables:
      gas: {table: "Table 2.3", page: 22, printed_page: 10, block: 203, example: "chlorine trifluoride (UN 1749)"}
      liquid: {table: "Table 2.2", page: 21, printed_page: 9, block: 198, example: "methyl hydrazine (UN 1244)"}
    rows:
      gas:
        "Rail tank car": {kg: 80000, container: "DOT Class 105, 112 tank car"}
        "Highway tank truck or trailer": {kg: 20000, container: "MC331 cargo tank"}
      liquid:
        "Rail tank car": {kg: 80000, container: "DOT Class 112 tank car"}
        "Highway tank truck or trailer": {kg: 20000, container: "DOT 312 cargo tank"}
    source: "proposed by the entry form, not this load's papers: ERG 2024 methodology {table} (erg2024-methodology PDF p. {page}, printed p. {printed}), {profile_container}, {kg:,} kg, an example profile (data for {example})"
    short: "{container}: {kg:,} kg, {state}; ERG 2024 methodology {table}"
    # the storage states in a reader's words (routing.storage_state's values)
    state_words:
      pressure_liquefied: "liquefied under pressure"
      refrigerated_liquid: "refrigerated liquid"
      ambient_liquid: "liquid at air temperature"
      solid: "solid"
    reader_source: "the reader's entry on the entry form"
    ask: "How much was in the container (kg)? No held source gives a quantity for this one."
    no_container: "the container is not known, so no profile row applies"
    no_state: "the material's storage state is not one the held profiles cover"
    no_row: "the held profiles give no row for {container}"

# HB-208 (the operator, 2026-11-19 13:49 to 14:00 EST): the page `hazbrief brief --serve` opens on, with two doors.
# Door one lists the prepared scenarios: every `fixtures/scenarios/<id>.json` with a committed brief under
# `docs/briefs/<id>/`, each cell read from the scenario's record (`start.menu_rows`). A row opens its recorded run (the
# served replay, as committed) or copies its fields into the entry form with now as the start time and the forecast as
# the weather (`start.template`). Door two is the entry form. test_hb208_start_page.py (a test held privately) holds both.
start:
  scenarios_dir: fixtures/scenarios
  briefs_dir: docs/briefs
  title: "hazbrief: start"
  heading: "Start: a prepared scenario, or a new incident"
  door_one: "Prepared scenarios"
  door_one_note: "Each row is a scenario with a recorded brief. Open the recorded run as it was recorded, with its recorded weather; or run it with today's conditions: the scenario's material, container, quantity and place are copied into the entry form, the start time is now and the weather is today's forecast, and every field can be changed before you build."
  door_two: "Enter a new incident"
  door_two_note: "The entry form: a point on the map and a situation line."
  columns: ["Place", "Material", "Container", "Recorded run for", "Day or night", ""]
  open_recorded: "Open the recorded run"
  run_today: "Run it with today's conditions"
  # cells the record does not give
  not_given: "not given"
  material_unresolved: "{given} (not an ERG entry)"
  material_none: "no material named"
  guide: "ERG Guide {number}"
  placard: "placard {placard}"
  # the entry form under a scenario's fields (item 3)
  template_note: "From the prepared scenario {id}: {place}. The material, container, quantity and place are the scenario's; the start time is now and the weather is today's forecast. Change anything before you build; nothing is built until you press Build."
  template_material: "From the prepared scenario: ERG entry {entry}, already confirmed."
  template_material_unresolved: "The prepared scenario gives the material as “{given}”, which is not an ERG entry. Type its name or placard number and read the line, or set the material to unknown."
  template_placard: "The prepared scenario gives placard {placard} and no material; the entry form takes no placard, so it is built under ERG Guide 111 (unidentified load) unless you name the material."
  template_no_material: "The prepared scenario names no material, so it is built under ERG Guide 111 (unidentified load) unless you name the material."
  template_quantity: "{kg:,} kg, the prepared scenario's quantity ({source})"
  unknown_scenario: "{id} is not a prepared scenario with a recorded brief"

# The location record (DN-013 section 2; HB-48). A location is a shape with a derivation, a source and an accuracy;
# the brief records one for the spill point and the popup and the evidence appendix carry its label. Only the bare
# point of the request is built: `caller_supplied`, no accuracy, because the request states none (DN-013 section 5.2).
# `basis` says what kind of number accuracy_m is (DN-013 ADDENDUM-00 section 7); with no number it is `none`.
location:
  caller_supplied:
    derivation: caller_supplied
    source: request
    basis: none
    label: "no accuracy stated; the footprint is drawn as if this point were exact"
  # A derived location's label (DN-013 section 2): the shape, its accuracy and basis, how and from what it was derived,
  # and the unit the source answered in (DN-013 ADDENDUM-00 section 6: "PennDOT RMS segment ..., offset ..."). A union
  # footprint appends `union_label`.
  label: "location uncertain within {shape}, {accuracy}, derived by {derivation} from {source}: {unit}"
  union_label: "; footprint is the union over {n} samples at {spacing_m:.0f} m"
  grown_label: "; footprint is the zones grown by {accuracy_m:g} m"
  grown_points_label: "; footprint is the zones grown by {accuracy_m:g} m around each of {n} candidate points"
  # What each `basis` says beside its number (DN-013 ADDENDUM-00 sections 3, 6 and 7).
  basis_text:
    segment_length: "{accuracy_m:.0f} m, the segment's length (no state LRS states a horizontal accuracy in metres)"
    instruction: "{accuracy_m:g} m, the FRA guide's instruction for Actual coordinates, not a tested accuracy; no confidence level stated"
    none: "no accuracy stated"
    source_requirement: "{accuracy_m:g} m, the MTAIP source requirement for road centerlines (CE95), not a tested accuracy; TIGER states none"
  # A derivation whose basis reads differently from the default above (HB-50): an address range is not a state LRS.
  basis_text_by_derivation:
    address:
      segment_length: "{accuracy_m:.0f} m, the address range's length (the Census Geocoder states no positional accuracy)"
  # A location the sources answered with nothing to draw (HB-50; DN-013 ADDENDUM-00 section 4, HB-50 ADDENDUM-00
  # points 1 and 3): no match, no crossing, or the geocoder unavailable. The record's shape is null, nothing is
  # guessed, and every channel is not run with this as its reason.
  unresolved_label: "location not resolved: {reason}"
  unavailable_reason: "the Census Geocoder was unavailable at {at} ({detail})"
  # The FRA inventory's Lat/Long Source field (item 29), read, never assumed (DN-013 ADDENDUM-00 section 3; HB-49
  # ADDENDUM-00 point 2). A value not listed here is recorded with no accuracy.
  crossing_accuracy:
    Actual: {accuracy_m: 1, basis: instruction}
    Estimated: {accuracy_m: null, basis: none}
  # The union (DN-013 section 5.3; HB-49 step 4). Samples along the shape are no farther apart than the smallest ERG
  # isolation distance the first sample's footprint states, and never farther than `max_spacing_m`. The line is first
  # simplified within `simplify_m` (in the local plane), so the samples follow its bends without one call per surveyed
  # vertex; the union is the convex hull of each consecutive pair of a zone's placements, which is the exact swept area
  # of a convex zone moved along a straight piece (the Minkowski sum of a convex set and a segment), so the union
  # departs from the sweep along the true line by at most `simplify_m`.
  sampling:
    max_spacing_m: 1000
    simplify_m: 10
  # The services a derivation reads (HB-49 step 2; corpus/workbench_api_catalog.yaml). `source` is the docs/sources/catalog.yaml
  # row; the FRA inventory is read through BTS NTAD, so its row is bts_ntad (every exchange maps to exactly one row).
  milepost:
    PA:
      api: pasda_penndot
      source: lrs:penndot
      markers: pasda/PennDOT/MapServer/0/query
      segments: pasda/PennDOT/MapServer/4/query
      # PennDOT's state route number is four digits, zero-padded; side 1 is the inventory side (northbound or eastbound
      # on a divided highway, PennDOT LRS document: "Undivided roadways and Northbound/Eastbound sides of divided
      # roadways are designated with even segment numbers").
      route_format: "{:04d}"
      side: "1"
    MD:
      api: mdot_sha_milepoints
      source: lrs:mdot_sha
      milepoints: Milepoints/MilepointsVW_Maryland_MDOTSHA/FeatureServer/0/query
      # MDOT SHA's ID_PREFIX for a route class.
      prefixes: {I: IS, US: US, MD: MD}
      vintage: "2018 data"
    VA:
      refused: >-
        VDOT's held milepost layer (vdot-mile-marker-signs-metadata) is the mile marker signs, which VDOT describes as
        "a legacy reference resource, provided as‑is and not actively maintained", one point per sign, so no segment
        is resolved from it (HB-49 RESULT)
  crossing:
    api: bts_ntad
    source: bts_ntad
    layer: NTAD_Railroad_Grade_Crossings/FeatureServer/0/query
  # An address (HB-50; DN-013 ADDENDUM-00 section 4). The Census Geocoder's one-line endpoint interpolates a point
  # "along an address range" of one TIGER edge (census-geocoder-user-guide), so the location is that range's segment:
  # the range's own from and to house numbers, geocoded the same way, fall at its two ends, and the TIGERweb road of
  # that name is cut between them (HB-49's PennDOT cut). `accuracy_m` is the segment's length. The one-line JSON
  # carries no match indicator or match type field (HB-50 RESULT); the label prints how many candidates it returned.
  address:
    api: census_geocoder
    source: census:geocoder
    endpoint: locations/onelineaddress
    benchmark: Public_AR_Current
  # The TIGER road lines a range or a crossing is read from: TIGERweb Transportation, the service the ICS 201 already
  # reads (tigerweb:current; layers per its held description: 2 Primary Roads, 6 Secondary Roads 72_1k scale, 8 Local
  # Roads). `margin_m` widens the search box around a range's two ends.
  roads:
    api: tigerweb
    layers: [Transportation/MapServer/2/query, Transportation/MapServer/6/query, Transportation/MapServer/8/query]
    margin_m: 50
  # An intersection (HB-50; DN-013 ADDENDUM-00 section 5; HB-50 ADDENDUM-00 point 2): the place's extent from TIGERweb's
  # places layers (ics201.yaml `place`: 28 Incorporated Places, 30 Census Designated Places), the two named roads in
  # it, and the points where they cross, each a disc of the MTAIP source requirement.
  intersection:
    api: tigerweb
    source: tigerweb:current
    places: [tigerWMS_Current/MapServer/28/query, tigerWMS_Current/MapServer/30/query]
    accuracy_m: 7.6
    basis: source_requirement

# The derivations over held and catalogued data (DN-015 sections 2 and 3; HB-54). Each runs in the workbench, never in
# a tool (the tool surface is frozen), reads its inputs through the one upstream client (recorded under
# fixtures/exchanges, replayed by the committed briefs), and prints its config values on its label. None estimates a
# time, a concentration or a travel (DN-001 invariant 1).
derive:
  # Roadblock candidates (DN-015 section 2): where a zone boundary of the footprint crosses a road.
  roads:
    api: tigerweb
    # TIGERweb Transportation layers per its held service description: 2 Primary Roads and 6 Secondary Roads 72_1k
    # scale (the large-scale layers, drawn below 1:650,000 and 1:90,000), as the location resolver reads them.
    layers: [Transportation/MapServer/2/query, Transportation/MapServer/6/query]
    # The MTFCC classes drawn (census-mtfcc-code-list, 2026): S1100 Primary Road, S1200 Secondary Road. Local roads
    # (S1400, layer 8) are off: add the class and the layer to turn them on. Printed on the layer.
    classes: [S1100, S1200]
    fields: OID,NAME,BASENAME,MTFCC
    # Crossings of one road (same NAME, or same line when unnamed) within this distance of each other are one
    # candidate: a divided highway is two TIGER lines, one per carriageway, tens of metres apart, so its crossing is
    # two points. Printed on the label.
    merge_m: 100
    # The road's bearing at a crossing: the direction between the points this far along the road each side of it.
    bearing_span_m: 25
    label: "candidate: the boundary of the ERG footprint crosses this road here; not a traffic plan"
    # HB-142R items 4 and 5 (DN-019 ADDENDUM-02 F11): every road that crosses a zone boundary gets a candidate, and
    # the candidate moves outward along the road. The roads read for both are a second query, in the footprint's box
    # grown by `max_m` so the roads just outside the boundary are held: TIGERweb Transportation layers 2, 6 and 8
    # (8 is Local Roads, which carries Virginia's numbered state routes: on csx day State Rte 672, Lovettsville Rd,
    # is S1400; docs/evidence/hb142/f11_crossings.tsv). Where this query is not recorded the
    # candidates are the S1100/S1200 crossings above, at the boundary, and the popup says why no offset was computed.
    offset:
      layers: [Transportation/MapServer/2/query, Transportation/MapServer/6/query, Transportation/MapServer/8/query]
      # The public road classes a vehicle enters by (census-mtfcc-code-list, 2026): S1100 Primary Road, S1200
      # Secondary Road, S1400 "Local Neighborhood Road, Rural Road, City Street", S1630 Ramp ("controlled access from
      # adjacent roads onto a limited access highway") and S1640 frontage road. Not counted: S1500 ("a four-wheel
      # drive vehicle is required"), S1740 ("usually on private property ... not addressed"), S1750 ("Internal U.S.
      # Census Bureau use") and S1780 (parking lot roads). Printed on the label.
      classes: [S1100, S1200, S1400, S1630, S1640]
      # The candidate's place along its road, outside the zone: the first junction at least `min_m` and at most
      # `max_m` along the road from the crossing; with none, the point `min_m` along it. 200 m and 1 km are DN-019
      # ADDENDUM-02 F11's and HB-142R item 4's defaults (the operator's "offset outward, possibly a parameter"); no
      # held source sets a distance (MUTCD 2009 Part 6 Chapter 6I is cited by title, its page not held).
      min_m: 200
      max_m: 1000
      # The step either side of the crossing that tells outward from inward (the side outside the zone).
      step_m: 5
      # A junction is a vertex two road lines share (TIGER's lines meet at shared nodes, so a bridge over a road is
      # no junction): a vertex of one line within this distance of the other line.
      junction_m: 1.0
      # A road that changes its name at a node with no third line (State Hwy 28 becomes Clay St in Point of Rocks)
      # is followed through, at most this many times. At a node where more lines meet, the line that turns least goes
      # on when it turns at most `max_turn_deg` (the road runs straight through the junction); past that the road ends
      # there (a T), and a candidate short of `min_m` stands at that end with its rule printed.
      max_follow: 10
      max_turn_deg: 30
      rules:
        junction: "the first junction outside the zone at least {min:g} m along the road: meets {other}, {m:,.0f} m from the boundary"
        minimum: "no junction between {min:g} m and {max:g} m along the road outside the zone: the minimum offset, {m:,.0f} m from the boundary"
        line_end: "the road's held line ends {m:,.0f} m from the boundary, short of the {min:g} m minimum: the candidate is at its end"
        no_outward: "the road does not leave the zone here (it runs along the boundary or touches it): the candidate stays at the crossing"
        # HB-178 (Issue 2c1d5f53; DN-023 ADDENDUM-01, DN-023 ADDENDUM-01): a candidate
        # never stands inside the zone it guards, nor inside a zone its crossing is not already inside; where the
        # minimum point is, it stands at the first point past it along the road that is outside every such zone
        past_zone: "the {min:g} m point along the road lies inside a zone: the first point outside every zone along it, {m:,.0f} m from the boundary"
      # HB-178: where no point from the minimum to the maximum along the road is outside every such zone (a road along a
      # zone's edge), or the held line ends inside one, the candidate is dropped from that road, with this reason
      dropped: "dropped: no point from {min:g} m to {max:g} m along the road from the crossing lies outside every zone it does not already stand in"
      dropped_line: "{n} candidate(s) dropped, never placed inside a zone: {roads}; {why}"
      not_computed: "not computed: the roads beyond the boundary are not held ({why}); the candidate is at the crossing"
      label: "candidate moved outward along the road to {rule_words}; prior art: FHWA MUTCD 2009 edition, Part 6, Chapter 6I, Control of Traffic Through Traffic Incident Management Areas (cited by title; page not held); not a traffic plan"
      rule_words: "the first junction between {min:g} m and {max:g} m outside the zone, else {min:g} m"
  # HB-142R item 1 (DN-019 ADDENDUM-02 F6; ADDENDUM-01 sections 2 and 3): the nearest fire, EMS, police and hospitals
  # OUTSIDE the footprint, each with its distance and bearing from the incident. facilities_in_footprint keeps its
  # footprint-bounded answer (DN-001); this is the brief's derivation. Fire, EMS and police are the National Structures
  # Dataset layers the facilities tool reads (facilities_sources.yaml `structures`), queried in the radius's box;
  # hospitals are receiving_hospitals' CMS answer (no new call), with the CMS fields the cache holds.
  # HB-157 items 7 and 8 (DN-024 sections 3.2 and 3.3; Issue 3359fc8b F1, F2): the population under the drawn modelled
  # layers, beside the ERG figure and never merged with it, and the cordons on the outer boundary of every drawn hazard
  # layer, with the inner-cordon mark on any candidate inside another drawn hazard layer.
  modelled:
    names:
      initial_isolation_zone: "initial isolation zone"
      fire_isolation: "fire isolation zone"
      protective_action_zone: "protective action zone"
      puff: "modelled first-order puff contours"
      arrival_bands: "modelled first-order arrival area"
      dense_gas: "modelled dense-gas {tier} band"
      # HB-163: the dense engine's area a level reaches at any time
      cloud: "modelled {tier} harm path"
      # HB-173 (HBD-390), as DN-028 ADDENDUM-10 decision 1 amends it: under a stable class SLAB's area at a level, which
      # carries the level; the population, the named places and the cordons read it, the siting reads the cloud
      # HB-189 (DN-028 ADDENDUM-14 decision 6): the planning area, the moving cloud's together with SLAB's check
      planning: "{tier} planning area (the moving cloud's area and SLAB's extent check)"
    # HB-189 (DN-028 ADDENDUM-14 decisions 7 to 9): under the stable treatment the headline count and the candidate
    # blocks are stated for these levels: the guidebook's protective action distances rest on AEGL-2 first ("AEGL-2
    # values were the first choice", erg2024-en-pdf PDF p. 289; "Final AEGL-2 values are the preferred health
    # criteria", erg2024-methodology p. 100) and AEGL-3 is the life-threatening level (p. 97). A level not listed
    # (AEGL-1) is outlined and counted separately, below the headline (decision 8, Desktop's assumption).
    action_levels: [AEGL-3, AEGL-2]
    inner: "inside the {layer}; inner cordon, protective equipment required"
    guards: "guards the outer boundary of every drawn hazard layer"
    # HB-189 (DN-028 ADDENDUM-14 decision 9): under the stable treatment, candidate blocks on the action levels' boundary
    guards_stable: "a candidate block on the AEGL-2 planning area's boundary, for the commander's judgment"
    cordon_label_stable: "candidate block: the AEGL-2 planning area's boundary (the moving cloud's area and SLAB's extent check) crosses this road; a candidate for the commander's judgment, not a traffic plan"
    cordon_title_stable: "Candidate blocks on the AEGL-2 planning boundary"
    cordon_label: "candidate: the outer boundary of every drawn hazard layer (the ERG zones and the modelled outlines) crosses this road; not a traffic plan"
    absent: "no modelled layer is drawn, so there is no modelled area: the figure is absent, not zero"
    # HB-186 (DN-028 ADDENDUM-12 decision 4): under a stable class the population's blocks are read by the tiles of
    # this many degrees that touch the planning area, one paged TIGERweb query per tile. csx night's planning area
    # (1,177 km2, 160 km on a diagonal) has a bounding box of 59,236 blocks, past the 50,000 cap of one query
    # (population_sources.yaml); the 97 tiles of 0.05 degrees that touch it hold 12,343
    # (the HB-186 evidence (held privately)). The cordons' road lookup reads the same tiles along the planning area's
    # boundary: its one box answered past the client's 5 MB response cap on every night brief
    # (docs/evidence/hb186/record_run2.jsonl). By day the one query stands for both.
    block_tile_deg: 0.05
    none_beyond: "the modelled outlines stay inside the ERG zones, so their outer boundary is the zones' own"
    title: "Population under the modelled area (2020 blocks)"
    figure: "{residents:,} residents{workers} under the modelled area ({engines}; {area:,.1f} km2, {blocks} blocks, {outside} wholly or partly beyond the ERG zones); the ERG protective action figure is {erg}"
    figure_workers: " and {workers:,} workers (LODES)"
    # HB-189 (DN-028 ADDENDUM-14 decisions 6 to 8): under the stable treatment the residents of the action levels'
    # planning area with their two parts, then the AEGL-1 band counted separately
    figure_parts: "; of the residents, {cloud:,} inside the moving cloud's area and {check:,} more inside SLAB's extent check only (one wind, no times)"
    figure_band: ". Counted separately, below this figure: {residents} more residents inside the {levels} band only (outlined, not an action level)"
    # HB-178 (Issue 78ccbb4b; HBD-419: "A lower bound is always written 'at least' with what cut it"): a figure under
    # an area the engine's grid or SLAB's table cuts, and that area's name, with what cut it
    at_least: "at least "
    cut_engine: "{what}, cut by {by}"
    erg_words: "{residents:,} residents and {workers:,} workers in the ERG zones"
    erg_absent: "not held (the population tool did not answer)"
    step_figure: "{n:,} residents under the area reached by {hplus}"
    # HB-157 item 14: the arrival line (the Responders tab and its own checklist group) and the wind-shift item
    arrival:
      line: "Modelled arrival ({level}, first order) at the nearest listed service and the suggested points: {parts}. Who moves first is not computed here (DN-024 section 3.11)"
      part: "{service}, {name}: {when}"
      by: "by {hplus} ({clock})"
      not_reached: "not reached by {hplus}"
      receipt: "the modelled arrival bands (HB-157 item 14; DN-024 section 3.6) and the Responders tab's nearest services (HB-142R)"
      shift_receipt: "the NWS gridpoint forecast over the modelled time; 30 degrees is a configured default (HB-157 ADDENDUM-02 item 2; DN-024 section 3.10)"
  # HB-155 ADDENDUM-01 and ADDENDUM-02 (records HBD-363 to HBD-369; Issues 96263e67 and c0ea2d82; DN-023 section 5):
  # one area for the services in the area, the sited points' candidates and, when HB-145 runs, traffic and the sources
  # view. It replaces HB-142R's radius rule (three times the protective action distance, floor 5 km) and HB-151's
  # nearest-three-per-class rule. The operator's reasoning (Issue c0ea2d82): the area is local, because responders and
  # hospitals are local and traffic matters for getting responders in and people out.
  area:
    # NO PUBLISHED BASIS (DN-023 section 5.1: the held corpus was searched once and holds no response-area radius):
    # the operator's default, 10 miles (16,093 m). He stated he has no justification for the number.
    radius_m: 16093
    # A class with none inside the radius widens to its nearest, never past this ceiling (100 miles; ADDENDUM-01
    # item 2). The area shown becomes the largest class radius used.
    ceiling_m: 160934
    # The reader's steps (ADDENDUM-02 item 5), in miles; "widen to nearest" is the per-class widening above.
    steps_mi: [5, 10, 20, 30, 50]
    metres_per_mile: 1609.344
    # ADDENDUM-02 item 4: stage one (the build's critical path) reads the radius's box, and the next step's box for a
    # class with none inside it, up to the ceiling; stage two (after the page is presented) reads the next step out
    # (20 miles), so one step of widening is in hand. Anything wider is read when the reader asks (a live serve).
    stage_two_mi: 20
    label: "default area radius: {miles:g} miles (operator default; no published basis held)"
    # Stage words for the Sources and MCP servers view's application rows (ADDENDUM-05 item 5): each stage is a
    # fetch of the brief application, not an MCP call, so it has a row and no strip mark.
    stage_title: "Services in the area, stage {n} ({miles:g}-mile box)"
    stage_one_note: "read before the brief is presented; the first screen and the suggested points depend on it"
    stage_two_note: "read after the brief is presented; one step of widening in hand"
  # HB-155 ADDENDUM-02 item 2: the traffic radius. Unset (null) means "the same as the area radius" (paired), because
  # traffic exists to get responders onto the scene and people out, so it is as local as the responders (the operator,
  # Issue c0ea2d82 item 3, who asked that the pairing and its reason be written down); set, it is independent. HB-145
  # reads it; this task draws no traffic. HB-145 ADDENDUM-01's 30-mile default is superseded by this pairing.
  traffic:
    radius_m: null
  nearby:
    # HB-155 ADDENDUM-01 item 3: every facility of each class outside the zones and within the area radius
    # (`derive.area`) is kept, nearest first. A class with none inside the radius widens to its nearest, up to the
    # area's ceiling, and the section prints the widened distance for that class; none inside the ceiling prints the
    # ceiling line. ADDENDUM-01 item 5: the Responders tab lists the nearest `listed_per_class` of each class, with a
    # "show all N" control; the map draws every kept facility.
    listed_per_class: 5
    widened_line: "{title}: none outside the footprint within {radius}; the search widened to the nearest, {widened}"
    ceiling_line: "{title}: none outside the footprint within the {ceiling} ceiling"
    show_all: "Show all {n}"
    count_line: "{n} within {radius}"
    # Class -> National Structures Dataset layers (structures/MapServer/layers?f=json, HB-10's probe): 16 is "Fire
    # Station / EMS Station" (one class in the dataset, listed under fire), 15 "Ambulance Service", 18 "Police
    # Station". Hospitals come from receiving_hospitals.
    classes:
      fire: {title: Fire, layers: [16]}
      ems: {title: EMS, layers: [15]}
      police: {title: Police, layers: [18]}
      hospital: {title: Hospitals, layers: []}
    # The CMS fields a hospital's popup prints: those the cache holds (facilities_sources.yaml cms.hospitals and
    # cms.pos). scripts/fetch_cms.py keeps only hospitals whose "Emergency Services" is Yes, so every held hospital
    # has an emergency department. Trauma level is not a CMS Hospital General Information column; inhalation or
    # chemical-burn capability is in no held source (Issue filed by HB-142R).
    hospital_ed: "yes (the CMS cache holds only hospitals whose Emergency Services is Yes)"
    capability_not_held: "capability: not in held data (no held source lists inhalation or chemical-burn capability)"
    trauma_not_held: "trauma level: not in held data (not a CMS Hospital General Information column)"
    label: "every fire, EMS and police station and hospital outside the ERG footprint within {radius} of the incident, and the nearest of a class with none inside it (HB-155 ADDENDUM-01; DN-019 ADDENDUM-02 F6); {area}; straight-line distance and bearing from the incident"
    # ADDENDUM-01 section 3: the responder's travel time over the held road graph at free-flow speeds by MTFCC class,
    # labelled as such: no live traffic in this repository. No held source gives a speed by class; these are the
    # configuration's assumptions, printed on every row, and the Issue HB-142R filed names the sources that would.
    travel:
      layers: [Transportation/MapServer/2/query, Transportation/MapServer/6/query]
      classes: [S1100, S1200]
      speed_kmh: {S1100: 100, S1200: 70}
      # From a station to the nearest held road, and from that road to the incident: a straight line at this speed.
      connector_kmh: 30
      junction_m: 1.0
      # HB-151: the roads are read in the box of the radius, or of the farthest listed service plus this margin where
      # that is larger (a widened class), so a route to a service near the box's edge can reach it from beyond: with
      # the box ending at the service itself, csx day's third hospital (Jefferson Medical Center, 27.6 km) had no
      # connecting road. An assumption, not a held value; 5 km keeps every box the radius's where the radius already
      # holds the farthest service and the margin.
      box_margin_m: 5000
      # HB-155 ADDENDUM-01 item 5: one Dijkstra from the incident gives every kept facility its time, so every one is
      # computed (the pair's replay stays within about 1.5 s of main's under the same load; HB-151's 4.2 s and 6.2 s
      # predate HB-157's SLAB runs; docs/evidence/hb155/replay_times.txt)
      label: "free-flow travel time over TIGER primary and secondary roads at assumed speeds by class ({speeds}; connectors {connector} km/h), no live traffic; assumed speeds, no held source"
      crosses: "the route crosses the ERG footprint: the responder goes around it"
      # HB-178 (Issue 76400690): a station whose nearest held road does not join the incident's within the travel
      # classes. Its distance and bearing are what is known; no time is estimated.
      no_route: "no route in the held roads (TIGER {classes}): {km:,.1f} km from the incident in a straight line, bearing {deg} degrees"
  # HB-155 (DN-023; VR-147; records HBD-359 to HBD-371): the command post, triage and staging suggested from held
  # criteria, each movable by the operator, and the responder routes to them. Every rule is a row of
  # `packs/siting_rules.json` with its held quote or its operator record; the values below that no held source gives
  # are marked NO PUBLISHED BASIS and printed on the layer's label. A suggested point is a suggestion: the label says
  # the incident commander sets it (DN-009 ADDENDUM-04 section 3).
  siting:
    # the three points, in the order they are chosen (DN-023 section 4.3) and listed
    points:
      command_post: {title: "Command post (suggested)", short: "Command post", symbol: command_post}
      triage: {title: "Triage (suggested)", short: "Triage", symbol: triage}
      staging: {title: "Staging (suggested)", short: "Staging", symbol: staging}
    # The exclusion area (item 5; ADDENDUM-04 item 1): the drawn hazard layers (`derive.drawn_hazards`: the ERG zones
    # and every drawn modelled outline), the protective action zone swept across the wind's spread, the downstream
    # path's corridor, and lower ground where the class is a dense gas.
    sweep:
      # NO PUBLISHED BASIS: the half-angle the zone is swept through when neither HB-143's station spread nor the
      # forecast's direction range gives one (a stated wind; a forecast with one direction over the window). Printed.
      min_half_angle_deg: 15
      # the sweep's rotation step; the union of the rotated zones is the swept zone
      step_deg: 5
    # NO PUBLISHED BASIS: the downstream path's corridor, each side of HB-58's path (a spill reaches the water and moves
    # with it; ERG "uphill and/or upstream"). Printed.
    corridor_m: 150
    low_ground:
      # the dense-gas channel's classes (`dense_gas.classes`): each is a gas or vapour heavier than air, which the ERG
      # guide says "will spread along the ground and collect in low or confined areas" (siting_rules `lower_ground`)
      classes: [tih_gas, flammable_liquefied_gas, flammable_liquid, cryogenic_asphyxiant]
      # NO PUBLISHED BASIS: how far from the incident held ground lower than the spill is excluded. Only the terrain
      # derivation's own points are held (HB-59: the zone boundaries and the downstream path), each standing for a disc
      # of its sampling spacing; elsewhere the elevation is not held and the label says so.
      within_m: 3000
    # The sectors, by the bearing from the incident measured from the direction the wind blows from (the brief's one
    # wind record). NO PUBLISHED BASIS for the widths: the ERG says "upwind" and gives no angle. Printed.
    sectors:
      upwind_half_deg: 45
      crosswind_half_deg: 135
    # NO PUBLISHED BASIS: "direct access from a primary or secondary road" (item 7) is a straight connector of at most
    # this length to the held primary and secondary roads; of the candidates with it, staging is the nearest to the
    # incident beyond the command post and triage (resources wait near the incident, NIMS p. 41's "await assignment");
    # with none, the one with the shortest connector. Printed on the point's reason.
    direct_access_m: 100
    # The candidates (item 6; records HBD-361 and HBD-362): the services in the area, the National Structures Dataset's
    # schools and other public buildings, TIGER parking lot roads and NTAD's truck parking (rest areas).
    candidates:
      # structures/MapServer layers (docs/evidence/hb155/probes/nsd_layers.json, read 2026-11-11)
      nsd_layers:
        3: Post office
        4: City or town hall
        5: Courthouse
        21: College or university
        22: Technical or trade school
        23: School
      # MTFCC S1780 "Parking Lot Road" (census-mtfcc-code-list) is in TIGERweb Transportation layer 8, Local Roads
      # (docs/evidence/hb155/probes/tigerweb_transportation.json). A lot is the lines of one OID's cluster.
      parking:
        layer: Transportation/MapServer/8/query
        mtfcc: S1780
        # NO PUBLISHED BASIS: parking lot road lines within this distance of each other are one lot.
        merge_m: 100
        # NO PUBLISHED BASIS: a lot whose road lines total less than this is not offered (a driveway's turnaround).
        min_length_m: 150
      # BTS NTAD Truck Stop Parking (FHWA's Jason's Law survey, compiled 2019-04-09; probes/ntad_truck_stop_parking.json):
      # public rest areas and truck stops on the National Highway System. No free federal layer of weigh stations was
      # found at rung 1; the class is named and not offered (DN-023 section 3).
      rest_areas:
        api: bts_ntad
        path: NTAD_Truck_Stop_Parking/FeatureServer/0
        out_fields: "OBJECTID,nhs_rest_stop,highway_route,mile_post,municipality,state,number_of_spots"
      weigh_stations: "weigh stations: no free federal layer found at rung 1 (DN-023 section 3); not offered"
      kinds:
        fire: "Fire station"
        ems: "EMS station"
        police: "Police station"
        hospital: "Hospital"
        public: "Public building"
        school: "School"
        parking: "Parking lot"
        rest_area: "Rest area or truck stop"
    # The words the layer, its popups and the block print.
    words:
      suggested: "suggested; the incident commander sets it"
      chosen: "{rule}: {why}"
      rejected: "{name} ({kind}): {why}"
      inside: "inside the {layer}"
      route_crosses: "its shortest road route from beyond the area crosses the {layer}"
      no_road: "no held primary or secondary road reaches it"
      far: "not the farthest of the three from the incident"
      sector: "{sector} of the incident"
      sector_words: {upwind: "upwind", crosswind: "crosswind", downwind: "downwind"}
      not_in_sector: "downwind of the incident"
      taken: "already the {point}"
      distance: "{km:,.1f} km, bearing {deg}° ({compass}) from the spill"
      hospital_triage: "{name}: triage (suggested) and a receiving hospital"
      none: "no candidate outside the hazard"
      point_none: "{point}: no candidate outside the hazard"
      elevation_not_held: "the ground's elevation here is not held (only the terrain derivation's own points are)"
      review: "review: the wind record changed since this point was suggested"
      moved: "moved by the operator at {time}"
      moved_inside: "{point} moved inside the {layer}"
      moved_receipt: "the operator's move (site_moved event at {time}) and DN-023 section 4.5"
      arrival_reached: "{point}: the modelled cloud reaches it by {hplus} ({clock})"
      label: "suggested points, chosen by the rules of packs/siting_rules.json (DN-023); exclusion area: {parts}; sectors from the wind record ({wind}), upwind within {up:g}°, crosswind within {cross:g}° (configured; no published angle); candidates: {kinds}; {weigh}; {area}"
      parts_sweep: "the protective action zone swept {half:g}° each side of the wind ({basis})"
      sweep_basis: {observed: "HB-143's station spread", forecast: "the forecast's direction range over the window", configured: "a configured minimum; no spread held"}
      parts_corridor: "the downstream path's corridor, {m:g} m each side (configured; no published basis)"
      parts_low: "held ground lower than the spill within {m:,.0f} m (dense-gas class {cls}; configured distance, no published basis)"
      parts_low_unheld: "lower ground not excluded: the terrain is not held for this brief ({why}), so the dense-gas class's ({cls}) low ground cannot be found"
      staging_direct: "{sector} of the incident, farther out than the command post and triage, with direct access to a primary or secondary road (a connector of at most {m:g} m, configured), the nearest such to the incident"
      staging_nearest_road: "{sector} of the incident, farther out than the command post and triage; none has direct access, so the one nearest a primary or secondary road"
    # Item 9: free-flow routes avoiding the exclusion area, from each nearest fire, EMS and police station to staging,
    # and from triage to each receiving hospital (the services in the area's hospitals); recomputed on a move.
    routes:
      label: "free-flow, assumed speeds; no live traffic"
      about: "Each route is the shortest free-flow drive over TIGER primary and secondary roads that avoids the exclusion area, at the travel speeds above, with a straight connector at each end; no live traffic. The directions link opens a hosted map from the coordinates alone; this page makes no call to it."
      none: "no held road route avoids the exclusion area"
      row: "{origin} to {dest}: {minutes:g} min, {km:g} km"
      row_none: "{origin} to {dest}: {why}"
      # a hosted directions page from coordinates alone (the operator's 09:48 ruling, Issue 0ccfb43c item 1: offered
      # as a link the operator can open); the page makes no call to it
      directions_url: "https://www.google.com/maps/dir/?api=1&origin={olat},{olon}&destination={dlat},{dlon}"
      directions: "Directions"
  # The same crossing, of a rail line (the NTAD rail features facilities_in_footprint read, HB-45's rail layer).
  rail:
    label: "candidate: the boundary of the ERG footprint crosses this rail line here; not a traffic plan"
  # The downstream path (DN-015 section 3).
  downstream:
    # D: the nearest 3DHP flowline to the spill within this distance starts the path; none within it, nothing is
    # drawn. A spill reaches water through drainage, so the nearest mapped stream can be hundreds of metres off: the
    # water fixture (un1746-small-i81-water) is 780 m from West Branch Marsh Run (HB-54 RESULT). Printed on the label.
    nearest_flowline_m: 1000
    # L: the path's length downstream, the NLDI `distance` parameter (km). Printed on the label.
    length_km: 10
    # NLDI (USGS Hydro Network-Linked Data Index, api.water.usgs.gov/nldi; usgs-nldi-navigation-docs): it navigates
    # NHDPlus V2 comids, not 3DHP ids (HB-54 probe: no 3DHP feature source). The start is the comid whose catchment
    # holds the point on the 3DHP flowline nearest the spill (`comid/position`), then `navigation/DM/flowlines`.
    nldi_api: nldi
    position: linked-data/comid/position
    navigation: "linked-data/comid/{comid}/navigation/DM/flowlines"
    # NLDI's line must stay within this distance of 3DHP's, plus half the river's width (below), or it is not the
    # stream the spill is nearest (HB-54 probe: the spill point itself fell in a catchment whose flowline is about 6 km
    # west). 50.8 m is the horizontal accuracy NHDPlus V2's source map is held to: the medium-resolution NHD at
    # 1:100,000, under the US National Map Accuracy Standards (1947: 90 % of well-defined points within 1/50 inch at map
    # scale, 1/50 in x 100,000 = 50.8 m; cited from general knowledge, not held). Past it, the path is the fallback.
    nldi_match_m: 50.8
    # Along the length, not at one point (HB-58; HB-54 compared the two lines at the start only, and refused the
    # Potomac at 79 m). The measure is Goodchild and Hunter's (1997, "A simple positional accuracy measure for linear
    # features", IJGIS 11(3), doi:10.1080/136588197242419): the share of a line within a buffer of a reference line,
    # here at a share of 1.0. From the cut (below), 3DHP's own downstream path is sampled every `along_step_m` for its
    # first `along_km`; a sample's separation is its distance to NLDI's path; NLDI is used when every separation is
    # within `nldi_match_m` plus half the river's width at that sample.
    # The width is measured, not read: NLDI's navigation carries `nhdplus_comid` only, and neither 3DHP layer carries a
    # width (usgs-3dhp-flowline-data-dictionary; usgs-3dhp-waterbody-layer: areasqkm only). It is the chord across the
    # 3DHP waterbody polygon of `width_types` that holds the sample, perpendicular to the flowline there; a sample on no
    # such polygon has width 0 and the fixed tolerance alone. Half the width, not all of it: a waterbody connector is an
    # "abstract connector over a portion of the landscape covered by water" (the dictionary), so two lines through one
    # river can lie anywhere across it, and half refuses a line hugging the far bank before it accepts one in another
    # river. On the fixtures (HB-58 RESULT section 1) every verdict is settled in the first 0.5 km; the largest
    # separation within 2 km is within 4 m of that within 10 km; and the step moves it by at most 3 m from 10 m to
    # 25 m. 25 m is half the fixed tolerance, so an excursion past it that runs 25 m along the river is sampled.
    along_km: 2
    along_step_m: 25
    width_types: [River]
    # 3DHP waterbody fields read for the width (layer 60, facilities_sources.yaml hydrography.waterbodies).
    width_fields: OBJECTID,id3dhp,gnisidlabel,featuretypelabel
    match_label: "; NLDI's line is used where it stays within {fixed_m:g} m plus half the river's width (the 3DHP River polygon, measured across) of 3DHP's, every {step_m:g} m over the first {km:g} km"
    # A live brief (not a replay, not a recording) calls NLDI with the client's timeout and retries a 5xx this many
    # times; past that it draws the fallback and says why (HB-58; HB-54: 116 s answers and 502s from NLDI).
    live_retries_5xx: 1
    # NLDI serves no names. A reach is named by the 3DHP flowline nearest its midpoint within this distance (the HB-54
    # probe found NLDI's and 3DHP's lines 12 m apart on the same stream); otherwise it prints its comid alone.
    name_match_m: 50
    # 3DHP flowline fields read (layer 50; usgs-3dhp-flowline-data-dictionary): the names, and the network's
    # hydrosequence and downstream hydrosequence (flownetworkderivatives, joined in 3DHP_all), which the fallback
    # follows.
    flowline_fields: id3dhp,gnisidlabel,featuretypelabel,mainstemid,hydrosequence,dnhydrosequence
    # The fallback when NLDI's path is not used (DN-015 section 3): from the nearest flowline, 3DHP's own downstream
    # connectivity (each flowline's dnhydrosequence is the next one's hydrosequence) over the flowlines held for the
    # footprint, ending at the footprint's edge, and the label says so.
    # The cut (HB-58): both paths begin where the spill projects onto the nearest flowline, keeping the part
    # downstream of it (3DHP flows in its digitized direction: the dictionary's flowdirectiontype codes 1 and 2). A
    # shape (DN-013: a milepost segment, a crossing's line) projects every `along_step_m`, and the cut is at the
    # upstream-most projection: material can enter the water anywhere along the shape, and the water it reaches is
    # the union of the paths from each entry, which begins there.
    fallback_label: "; NLDI's path was not used ({why}), so the path follows 3DHP's own downstream connectivity inside the footprint and ends at its edge"
    label: "the mapped flow path from the nearest flowline within {d_m:g} m of the spill, downstream for {l_km:g} km; no travel time, no dilution"
  # Workplaces by block (DN-015 section 4; HB-55): LODES8 WAC jobs per block (the files population_at_risk reads,
  # fixtures/lodes; vintage and version from population_sources.yaml `lodes`), joined on GEOID to the blocks the
  # population layer draws, with the population layer's ramp and breaks. Every column listed is printed when non-zero;
  # the list is the WAC file's C000 and its twenty NAICS sector columns, complete (lodes8-techdoc-8-4, WAC structure).
  workplaces:
    columns:
      C000: Total jobs
      CNS01: NAICS 11 Agriculture, Forestry, Fishing and Hunting
      CNS02: NAICS 21 Mining, Quarrying, and Oil and Gas Extraction
      CNS03: NAICS 22 Utilities
      CNS04: NAICS 23 Construction
      CNS05: NAICS 31-33 Manufacturing
      CNS06: NAICS 42 Wholesale Trade
      CNS07: NAICS 44-45 Retail Trade
      CNS08: NAICS 48-49 Transportation and Warehousing
      CNS09: NAICS 51 Information
      CNS10: NAICS 52 Finance and Insurance
      CNS11: NAICS 53 Real Estate and Rental and Leasing
      CNS12: NAICS 54 Professional, Scientific, and Technical Services
      CNS13: NAICS 55 Management of Companies and Enterprises
      CNS14: NAICS 56 Administrative and Support and Waste Management and Remediation Services
      CNS15: NAICS 61 Educational Services
      CNS16: NAICS 62 Health Care and Social Assistance
      CNS17: NAICS 71 Arts, Entertainment, and Recreation
      CNS18: NAICS 72 Accommodation and Food Services
      CNS19: NAICS 81 Other Services (except Public Administration)
      CNS20: NAICS 92 Public Administration
    label: "LODES workplace area characteristics, {vintage} (LODES {version}); whole-block counts"
    # population_at_risk's own limit sentence for jobs (tools/population_at_risk.py LIMITS; a test keeps them equal)
    note: "Daytime counts jobs located in the footprint; a worker with two jobs counts twice."
  # The county's establishments (DN-015 section 4): County Business Patterns through the Census Data API with
  # CENSUS_API_KEY (DN-003 section 1), every two-digit NAICS sector (INDLEVEL 2, which includes the ranges 31-33,
  # 44-45, 48-49 and the 00 total) for each county the population channel's blocks lie in. Complete, no selection.
  # 2023 is the newest vintage the API serves (HB-55 probe: data/2024/cbp answered 404).
  establishments:
    api: census
    dataset: 2023/cbp
    vintage: 2023
    get: NAICS2017,NAICS2017_LABEL,ESTAB
    indlevel: "2"
    label: "County Business Patterns {vintage}: establishments by two-digit NAICS sector, for the county as a whole"
  # Terrain (DN-015 section 5): elevation from the USGS Elevation Point Query Service at the spill and at sample points
  # along each zone boundary, at HB-49's spacing (union.spacing_m: the smallest isolation distance, at most 1 km);
  # land cover from the Annual NLCD COG mirror at the spill, over the footprint and along the path (HB-59 ADDENDUM-03).
  terrain:
    # Elevation, batched (HB-59; HB-55 RESULT section 7 item 4: EPQS is one GET per point, about 3 s each). The 3DEP
    # elevation ImageServer's getSamples answers a multipoint in one GET, from the same 3DEP DEMs EPQS reads (HB-59
    # probe: the water fixture's point read 219.394866943 m, resolution 1, from both). One call per sample set: the
    # spill, the zone boundaries' points, and the downstream path's vertices.
    samples_api: usgs_3dep
    samples_path: 3DEPElevation/ImageServer/getSamples
    # The longest URL the service accepts, characters (HB-59 probe: an 8,201-character URL answered 200 and an 8,531
    # one 414 URI Too Long, the 8 KiB request-line limit servers commonly hold). A set whose URL would pass it is split
    # into as few calls as fit.
    samples_max_url_chars: 8000
    # EPQS stays the fallback: when getSamples fails for a set, that set's points are read one by one from EPQS, and
    # the panel names the reason.
    epqs_api: epqs
    epqs_path: json
    # EPQS answers this for a point with no data (HB-55 probe of the documented behaviour; elevatr's documentation).
    no_data: -1000000
    # 3DEP's DEMs over the conterminous US: "All elevation values are in meters and ... referenced to the North
    # American Vertical Datum of 1988 (NAVD88)" (usgs-3dep-13-arcsec-dem-metadata). EPQS's answer names no datum.
    vertical_reference: "metres above NAVD88 (3DEP DEMs over the conterminous US)"
    # Land cover (HB-59 ADDENDUM-03): the public-domain Annual NLCD Cloud Optimized GeoTIFF mirror (nlcd-cog-mirror-stac;
    # source-coop-cboettig-land-cover), read by HTTP range through the one client (utils.fetch_range) and decoded by
    # hazbrief.brief.cog. One read serves the class at the spill, the class mix over the footprint and the classes
    # along the downstream path. MRLC's GeoServer (HB-55) no longer serves CONUS and USGS's dmsdata answered nothing
    # on 2026-10-28 (HB-59 RESULT ADDENDUM-01 and -02); neither is read or waited on.
    cover_api: nlcd_cog
    cover_path: "nlcd/nlcd-{vintage}-cog.tif"
    # The newest year the mirror holds (the STAC collection's temporal extent ends 2025-12-31).
    cover_vintage: 2025
    # The file's head that holds every image directory: the full-resolution IFD sits at byte 192 and the last
    # overview's ends before byte 17,860, where TileOffsets begins (HB-59 RESULT ADDENDUM-03 section 2).
    cover_head_bytes: 16384
    # The longest single range read: adjacent tiles of one row are read together up to this, under the client's
    # response cap (config.upstream_max_response_bytes, 5,000,000).
    cover_max_read_bytes: 2000000
    cover_label: "Annual NLCD {vintage} (USGS, public domain), via the NRP/source.coop mirror, EPSG:4326 nearest-neighbour; class names from the NLCD class legend"
    # The point is one cell, and the mirror moved each 30 m Albers cell to EPSG:4326 by nearest neighbour: of the
    # eight points MRLC's own WMS answered in HB-55, the mirror's 2021 cell matched five and all eight were within one
    # cell (HB-59 RESULT ADDENDUM-03 section 3).
    cover_point_note: "the class at the spill is the one cell holding it, and at a class edge the next cell may differ (the mirror's nearest-neighbour resampling)"
    # EPSG:4326 cells are equal in degrees, not in area: a cell's area is proportional to the cosine of its latitude.
    cover_mix_weighting: "share of the footprint's cells, each weighted by the cosine of its latitude"
    # The NLCD class names (mrlc-nlcd-class-legend).
    nlcd_classes:
      11: Open Water
      12: Perennial Ice/Snow
      21: Developed, Open Space
      22: Developed, Low Intensity
      23: Developed, Medium Intensity
      24: Developed, High Intensity
      31: Barren Land (Rock/Sand/Clay)
      41: Deciduous Forest
      42: Evergreen Forest
      43: Mixed Forest
      51: Dwarf Scrub
      52: Shrub/Scrub
      71: Grassland/Herbaceous
      72: Sedge/Herbaceous
      73: Lichens
      74: Moss
      81: Pasture/Hay
      82: Cultivated Crops
      90: Woody Wetlands
      95: Emergent Herbaceous Wetlands
    label: "elevation and cover shown as data; their effect on a release is the modelled tier (DN-009 E6), not drawn"
  # Recording only (scripts/record_derivations.py): NLDI's position query answered in 116 s on the HB-54 probe, past
  # the client's 30 s (config.upstream_timeout_seconds), so the recorder raises the client's timeout to this.
  record_timeout_s: 240

# Weather over the response window (DN-016; HB-56): the NWS gridpoint forecast at the spill as a table and a wind strip,
# and nowCOAST's radar as a toggled raster. Data only: the footprint is oriented on the wind it was built with and is
# never re-oriented on a forecast (DN-001 invariants 1 and 2).
# One brief, one wind (HB-133; Issue 90ac45af; hazbrief.brief.wind_record). The brief resolves one wind record before
# any channel is called; every wind consumer reads it, and a map whose consumers read two records is degraded.
wind_record:
  # the record's source as the page and the server print it (WindObservation.source holds at most 200 characters)
  forecast_source: "NWS gridpoint forecast {grid}, the cell for {hour}"
  stated_source: "{source}; stated wind, no forecast held for {hour}"
  # a stated wind the scenario gives beside a held forecast is not used (the operator's ruling on Issue 90ac45af)
  stated_unused: "The scenario's stated wind ({source}, {deg:.0f} degrees at {kmh:g} km/h) is not used: a forecast is held for {hour}"
  no_record: "no wind held (no forecast for the as-given hour and no stated wind)"
  describe: "the wind from {deg:.0f} degrees at {kmh:.1f} km/h ({source}, as of {as_of})"
  consumer: "{consumer} read {what}"
  engine_read: "the wind from {deg:.0f} degrees at {kmh:.1f} km/h ({source})"
  # DN-011 D2: a section that cannot be true is degraded, not rendered; this one names both records
  degraded_label: "two winds on one brief: the brief's wind is {record}, but {others}. The map is not drawn until every layer reads one wind (HB-133)"
  # Agreement within the engines' own rounding: the forecast window rounds direction to whole degrees and speed to
  # 0.1 km/h (derive._round_row); the server keeps both as given. Half a unit of each is the rounding, nothing more.
  tolerance_deg: 0.5
  tolerance_kmh: 0.05
  # HB-139 (DN-019 ADDENDUM-01 section 1): the record's source as the first screen prints it, in the addendum's three
  # forms, in the footprint wind line, the wind strip's first cell and the legend. {as_of} and {hour} are printed in
  # the incident's time zone. `stated_fallback_basis` is HB-133's stated wind when no forecast cell is held (the
  # weather source is forecast): it prints in the stated form, so a stated wind is never shown as a forecast.
  labels:
    forecast: "forecast, NWS cell {grid} for {hour}, as of {as_of}"
    observed: "observed, {dataset} station {station}, {hour}"
    # HB-143: an observed record from several stations says how it was chosen and how the others read (the method's
    # label, docs/evidence/hb143/prior_art.md); appended to `observed`
    observed_spread: "; the nearest of {n} stations with a fresh wind, {km:.1f} km away; the {n} read {arc} at {kmin:.1f} to {kmax:.1f} km/h (one representative station, EPA-454/R-99-005 section 3.5)"
    observed_one: "; the only one of the {read} nearest stations with a fresh wind, {km:.1f} km away (one representative station, EPA-454/R-99-005 section 3.5)"
    # the spread's bearings: the smallest arc that holds them, clockwise (observed_wind.arc); calm stations hold none
    arc: "from {lo:.0f} to {hi:.0f} degrees"
    arc_one: "from {lo:.0f} degrees"
    arc_none: "calm"
    stated: "stated: notional, from {deg:.0f} at {kmh:g} km/h, basis: {basis}"
  stated_fallback_basis: "{source}; no forecast held for {hour}"
  # the record's source when weather.source is stated: the server's WindObservation.source (at most 200 characters,
  # so the basis is bounded below in weather.source_schema)
  stated_config_source: "stated: notional, basis: {basis}"
  # the legend's line for the wind arrow (DN-019 section 2 item 1: the legend names what each layer is)
  legend: "the wind every layer reads: from {deg:.0f} degrees at {kmh:g} km/h ({label})"
  # a fixture that sets the source (DN-019 ADDENDUM-01 section 1: never silently): the line under the wind line
  fixture_basis: "Weather source {source}, set by the scenario file: {basis}"
  # Issue 473bdfeb's ruling (Desktop OODA on HB-133, 2026-11-09): a calm record is a true record. The ERG footprint
  # draws; each model that cannot run on it says so with the speed it needs; nothing replaces the record on its own.
  # - the puff (DN-018) releases nothing on a wind of 0 (HB-70 step 4): it needs a wind above 0 m/s;
  # - SLAB takes the puff's source term (DN-020 section 3.4) and the held SLAB guide (epa-slab-users-guide-1990) states
  #   no minimum wind speed of its own, so it needs what the puff needs;
  # - for comparison only, ALOHA "is applicable to cases where the wind speed is greater than 1 meter per second (at
  #   10 meters)" (noaa-aloha-technical-documentation PDF p. 12); no engine here takes that floor.
  calm:
    puff_needs_ms: 0
    puff: "calm {source}: the puff needs a wind above {ms:g} m/s, so no puff is released. The ERG footprint is drawn on the record; no other wind replaces it (Issue 473bdfeb): choose weather.source observed or stated to model another wind"
    dense_gas: "calm {source}: SLAB needs the puff's source term and the puff needs a wind above {ms:g} m/s (the held SLAB guide states no minimum wind speed of its own); no other wind replaces the record (Issue 473bdfeb)"

weather:
  # The brief's weather source (DN-019 ADDENDUM-01 sections 1 and 4; HB-139; hazbrief.brief.weather_source): one per
  # brief, set here, overridable per run by the CLI and the --serve page's query (never by a fixture silently: a
  # scenario's `weather:` block carries a `basis`). The three sources follow the held manuals: HPAC "has fast access to
  # real-time weather data through Meteorological Data Servers (MDS). HPAC also has embedded climatology or historical
  # weather data for use when real weather data is not available" (osd-ncbdp-specialized-radiological PDF p. 1); ALOHA:
  # "you must choose whether you are going to enter weather information manually or from a portable monitoring-or
  # SAM-station" (epa-aloha-users-manual-2007 PDF p. 36). Climatology is left out on purpose (DN-019 ADDENDUM-01
  # section 2). `stated` refuses a null field, naming it; `observed` refuses until its dataset is a held row with a
  # client (`observed_client.clients`), naming the acquisition.
  source: forecast
  # HB-143: `observed` reads the live NWS station observations (the source catalog's live_call row
  # `nws:observations`, docs/sources/catalog.yaml), recorded per brief like every live call (DN-011 D7), through
  # hazbrief.brief.observed_wind. The method is one representative station, chosen from the prior art
  # (docs/evidence/hb143/prior_art.md): the nearest of the `stations` nearest NWS stations whose latest observation
  # reports a wind within `tolerance_minutes` of the brief's hour (EPA-454/R-99-005, epa-mmgrma-1999, section 3.5, PDF
  # p. 40: "the single site should be located as close as possible to the source in question"), with the others
  # carried as a spread, not averaged. `min_stations` is the method's own: one representative station. Below it the
  # record is the forecast cell, with the reason on the first screen (HB-143 item 3).
  observed:
    dataset: "nws:observations"
    tolerance_minutes: 90
    stations: 3
    min_stations: 1
  stated:
    direction_from_deg: null
    speed_kmh: null
    stability_class: null
    mixing_height_m: null
    basis: null
  source_schema:
    # WindObservation.source is at most 200 characters; wind_record.stated_config_source wraps the basis in 26
    basis_max_chars: 160
    refusals:
      stated_null: "weather.source is stated, but weather.stated.{field} is null: a stated wind is given in full and never defaulted (DN-019 ADDENDUM-01 section 4)"
      observed_no_dataset: "weather.source is observed, but no observed-weather dataset is held (weather.observed.dataset is null). Acquire it first as a corpus row (DN-019 ADDENDUM-01 section 5: HB-135's list, item 12; NCEI ISD hourly or the HRRR analysis archive), or choose forecast or stated"
      observed_not_a_row: "weather.source is observed, but weather.observed.dataset {dataset!r} is not a row of corpus/sources.yaml or of the source catalog (docs/sources/catalog.yaml). Acquire it first as a corpus row (DN-019 ADDENDUM-01 section 5), or choose forecast or stated"
      observed_no_client: "weather.source is observed and {dataset!r} is held, but no client reads it yet (Issue {issue}); choose forecast or stated"
      # HB-143: an observed dataset with a client must stay a row of the registry the client reads it through
      observed_client_row_missing: "weather.source is observed, but weather.observed.dataset {dataset!r} is not a row of the source catalog (docs/sources/catalog.yaml), so its client has nothing to read through; restore the row, or choose forecast or stated"
      fixture_no_basis: "the scenario's weather block has no basis: a scenario file never sets the weather source silently (DN-019 ADDENDUM-01 section 1)"
      invalid: "weather.{field}: {why}"
    # the Issue that carries the archived observed client (filed by HB-139): a corpus row with no client names it
    observed_client_issue: "07c07030"
  # HB-143: the observed source's clients and what the record and the first screen print (hazbrief.brief.observed_wind)
  observed_client:
    # the dataset ids a client reads: each must be a row of the source catalog (docs/sources/catalog.yaml), and
    # `name` is how the record and its label name the dataset
    clients:
      "nws:observations": {name: NWS}
    # the method, as the record and the first screen name it, with its source (docs/evidence/hb143/prior_art.md)
    method: "one representative station, the nearest with a wind within {tol} min of the hour; the others are a spread, not averaged (EPA-454/R-99-005 section 3.5)"
    # the record's source as the server's WindObservation.source holds it (at most 200 characters)
    source: "observed: {dataset} station {station}, latest observation of {observed_at}, {km:.1f} km from the incident"
    # why a station was read and not used, one line each
    reasons:
      stale: "observed {span} {side} the brief's hour, past the {tol} min tolerance"
      no_wind: "its observation reports no wind speed"
      variable: "its observation reports {kmh:.1f} km/h with no direction (variable)"
      no_answer: "its latest observation is not held ({why})"
    # the first screen's line under the wind line, listing every station read
    stations_line: "Stations read ({method}): {stations}"
    station_used: "{station} {km:.1f} km, {wind}, observed {at} (the record)"
    station_spread: "{station} {km:.1f} km, {wind}, observed {at}"
    station_dropped: "{station} {km:.1f} km, not used: {why}"
    wind_calm: "calm"
    wind_from: "from {deg:.0f} at {kmh:.1f} km/h"
    # HB-143 item 3: fewer than `min_stations` stations have a fresh wind, so the record is the forecast cell. This is
    # the task's rule; DN-019 ADDENDUM-01 (hazbrief-mcp:HBD-211) says observed does not fall back on its own, and the
    # departure is carried to the Desktop by Issue {issue} (filed by HB-143)
    fallback: "Weather source observed, but {why}: the brief's wind is the NWS forecast cell instead (HB-143 item 3; Issue {issue})"
    fallback_issue: "94309222"
    too_few: "{fresh} of the {n} nearest NWS stations report a wind within {tol} min of {hour}, and the method needs {need}"
    no_stations: "no NWS station list is held for the incident point ({why})"
  # N, the forecast hours shown after the as-given time. The held ERG2024 prints no time frame for its Table 1 or Table 3
  # distances (DN-016 section 3's "first 30 minutes" is not in the 2024 text; HB-56 RESULT section 1). It names the
  # exposure periods its health criteria come from: AEGLs "are applicable to emergency exposure periods ranging from 10
  # minutes to 8 hours" (erg2024-en-pdf, Glossary, AEGL). N is the end of that range.
  window_h: 8
  # The longest exposure period the ERG's protective action distances were computed for: "When final AEGL values were
  # available for the chemical of interest, the 60 min, 30 min, and 10 min final AEGL-2 were employed"
  # (erg2024-methodology, section 4.2.1). The strip marks where it ends.
  erg_frame_h: 1
  # The angle past which a forecast wind is flagged against the wind the footprint is oriented on: the wind shift of
  # the Federal Meteorological Handbook No. 1 (held, fmh1-2019, FCM-H1-2019, section 5.4.6, page 5-2: "A wind shift is
  # indicated by a change in wind direction of 45 degrees or more in less than 15 minutes with sustained winds of 10
  # knots or more throughout the wind shift"; HB-60). The flag takes FMH-1's angle only: a forecast hour is not 15
  # minutes, and the strip flags at any speed.
  veer_flag_deg: 45
  # HB-133: the footprint is oriented on the brief's one wind record (hour 0), not an observed wind
  veer_label: "forecast wind {word} by {deg:.0f} degrees over the window; the footprint is oriented on the brief's wind at hour 0"
  # The gridpoint layers shown, with their unit as NWS states it (`uom`); any other unit is refused.
  layers:
    windSpeed: wmoUnit:km_h-1
    windDirection: wmoUnit:degree_(angle)
    temperature: wmoUnit:degC
    skyCover: wmoUnit:percent
    probabilityOfPrecipitation: wmoUnit:percent
  # Relative humidity at hour 0, read beside the window, not shown in it (HB-112 ADDENDUM-02 section 2): SLAB's RH and
  # the pool's longwave flux need it. Read as the window reads its layers; any other unit is refused (not defaulted).
  relative_humidity: {layer: relativeHumidity, uom: wmoUnit:percent}
  # The mixing height at hour 0, read the same way (HB-129; DN-021 section 3): VSMOKE takes it. Not shown in the window.
  mixing_height: {layer: mixingHeight, uom: wmoUnit:m}
  label: "NWS gridpoint forecast {grid}; hours from the as-given time; shown as data, the footprint is not re-oriented on it"
  # The nearest station's latest observation (HB-60; DN-016 sections 2 and 3): from the NWS points answer's
  # observationStations, the station nearest the spill (geodesic), and its observations/latest.
  observation:
    # The source catalog row whose horizon decides whether the observation is usable (DN-010 D4): observed no later than
    # the as-given time and within the horizon before it. Otherwise it is printed with its offset and feeds nothing.
    catalog_row: nws:observations
    # FMH-1 (fmh1-2019) section 9.4.5, page 9-2: "The ceiling shall be the lowest layer aloft reported as broken or
    # overcast. If the sky is totally obscured, the vertical visibility shall be the ceiling." NWS's cloudLayers amounts.
    ceiling_amounts: [BKN, OVC, VV]
    no_ceiling: no ceiling reported
    # The anemometer height is not in the API. FMH-1 section 2.6.5 (page 2-4) sites every sensor by "the Federal
    # Standard for Siting Meteorological Sensors at Airports", which is not held; it does not state the height itself.
    wind_height_label: "station standard, taken as 10 m (FMH-1 2.6.5 sites sensors by the Federal Standard for Siting Meteorological Sensors at Airports, not held)"
    label: "NWS station observation, the station nearest the spill; shown as data, the footprint is oriented on the wind it was given"
  # The Pasquill-Gifford stability class (DN-016 section 2; HB-57; DN-016 ADDENDUM-00 section 4): Turner's key as EPA
  # states it in EPA-454/R-99-005 (epa-mmgrma-1999), section 6.4.1, Tables 6-4 to 6-6, pages 6-12 to 6-14. Printed,
  # consumed by nothing (DN-001 invariant 1).
  stability:
    # Table 6-4, "Turner's Key to the P-G Stability Categories": a row per wind class, keyed by its highest whole knot
    # ("Since the method was developed for use with NWS data, the wind speed is given in knots"; the last row is
    # ">= 12"), its classes for net radiation index 4, 3, 2, 1, 0, -1, -2 (1 = A ... 7 = G).
    net_radiation_indices: [4, 3, 2, 1, 0, -1, -2]
    rows:
      - {knots_max: 1, classes: [1, 1, 2, 3, 4, 6, 7]}
      - {knots_max: 3, classes: [1, 2, 2, 3, 4, 6, 7]}
      - {knots_max: 5, classes: [1, 2, 3, 4, 4, 5, 6]}
      - {knots_max: 6, classes: [2, 2, 3, 4, 4, 5, 6]}
      - {knots_max: 7, classes: [2, 2, 3, 4, 4, 4, 5]}
      - {knots_max: 9, classes: [2, 3, 3, 4, 4, 4, 5]}
      - {knots_max: 10, classes: [3, 3, 4, 4, 4, 4, 5]}
      - {knots_max: 11, classes: [3, 3, 4, 4, 4, 4, 4]}
      - {knots_max: null, classes: [3, 4, 4, 4, 4, 4, 4]}
    # "For EPA regulatory modeling applications, stability categories 6 and 7 (F and G) are combined and considered
    # category 6" (section 6.4.1). The class printed is A to F.
    highest_class: 6
    # Table 6-5: insolation class 4 above 60 degrees, 3 above 35, 2 above 15, else 1 (the bound itself is the lower
    # class: "35 < Φ ≤ 60").
    insolation: [{above_deg: 60, class: 4}, {above_deg: 35, class: 3}, {above_deg: 15, class: 2}]
    # Table 6-6. Night is "from one hour before sunset to one hour after sunrise" (item 2).
    night_margin_h: 1
    # Item 2: night cover "≤ 4/10" is index -2, "> 4/10" is -1. Item 3(b): day cover "≤5/10" leaves the insolation class
    # unmodified. Cover is read as tenths (NWS percent / 10).
    night_clear_max_tenths: 4
    day_clear_max_tenths: 5
    # Item 1 and item 3(c): ceilings in feet; "10/10 and the ceiling is less than 7000 feet" is index 0, day or night.
    ceiling_low_ft: 7000
    ceiling_high_ft: 16000
    wind_height: "taken as at 10 m (NWS surface wind)"
    table: "Turner's key as EPA states it (EPA-454/R-99-005, Tables 6-4 to 6-6)"
    # DN-016 section 1, amended by DN-018 section 10 item 3 (HB-67): the first-order puff is the class's one consumer, so
    # "not used to compute anything on this screen" stopped being true; the label now names the one thing that reads it.
    label: "a classification of the present atmosphere from three held inputs; on this screen only the modelled first-order puff reads it"
  # Radar now (DN-016 section 4): nowCOAST's MRMS base-reflectivity mosaic, a WMS layer (no key; the capabilities state
  # "Fees NONE" and "AccessConstraints NONE"; HB-56 probe). Its time dimension's default is the newest scan, printed on
  # the layer list. The tiles are display, not record: a replayed brief shows "radar not held".
  # The first-order passive puff (DN-018 sections 4, 5, 8 and 9; HB-67; `derive.puff`, `hazbrief.brief.puff`): two
  # source envelopes from packs/release_scenarios.json, on the forecast wind above, by the class above, to the thresholds
  # packs/materials_properties.json holds, drawn beside the ERG footprint and never above it. Every input it lacks is
  # named and nothing is defaulted (DN-018 section 8, C3).
  puff:
    engine: "hazbrief.brief.puff (NumPy)"
    # DN-018 section 4 item 4: one hour, contours at the AEGL exposure durations.
    window_min: 60
    contour_minutes: [10, 30, 60]
    # HB-133 ADDENDUM-01: the drawn contour is the isoline through the field (hazbrief.brief.contours), simplified by
    # this fraction of one grid cell (Douglas-Peucker, topology kept): below the grid's own resolution, so the ring
    # says nothing finer or coarser than the field it is read from.
    contour_simplify_cells: 0.25
    # Seconds between puffs. The held implementation's own guidance (its README): "the right value for this parameter
    # depends on how rapidly the wind direction is changing"; the forecast changes hourly, so 10 s is fine-grained.
    puff_dt_s: 10
    # A puff lives the whole window: the held implementation's default (puff_duration 1200 s) is for a near-field
    # methane site and would drop a puff before the 30- and 60-minute contours.
    lifetime_s: 3600
    # The grid fits the puff (HB-70 step 1). Its half-width is the larger of the puff's reach and a floor:
    # - the reach: the farthest puff centre's travel over the window at the largest hourly wind driving the puff, plus
    #   `grid_sigma_multiple` times sigma_y at that distance (the held equation's along-wind spread is sigma_y: Jia et
    #   al. 2025 Eq. (2) puts (x - u t)^2 + y^2 over 2 sigma_y^2); crosswind, the same multiple of sigma_y, which never
    #   exceeds the reach, so the square grid takes the reach;
    # - the floor: HB-67 step 2's ERG protective action distance times `grid_factor`, so nothing drawn before shrinks.
    # Four sigma: a Gaussian at 4 sigma is exp(-8), 3.4e-4 of its peak.
    grid_factor: 2.0
    grid_sigma_multiple: 4
    # The cells across the floor grid; they set the cell size (2 x floor / grid_cells), which the grid keeps as it
    # grows (HB-70 step 1: "keep the cell size, not the cell count"), with an odd count so the spill is a cell centre.
    grid_cells: 161
    # The most cells a side, past which the cell grows instead of the count (HB-70 RESULT section 1): one envelope on
    # 1,001 cells a side took 1.2 to 1.3 s and on 2,001 took 4.3 to 4.6 s (UN1977 and UN1203 at Wilson Bridge, class B,
    # a stated 20,000 kg), against the channel's 20 s `timeout_s` for both envelopes on any machine. The largest
    # committed grid is 523 a side, so no committed brief's cell changes.
    grid_cells_max: 1001
    grid_coarsened_line: "At the ERG grid's cell size the puff's reach would need {needed:,} cells a side; the grid stops at {cells:,} and each cell grows to {step:.0f} m"
    grid_line: "Grid: {half:,.0f} m each way from the spill, the larger of the puff's reach ({reach:,.0f} m: {travel:,.0f} m travelled at the largest driving wind, {speed:.1f} m/s, over {minutes:.0f} minutes, plus {k:g} sigma_y, {spread:,.0f} m, class {cls}; crosswind {k:g} sigma_y, {spread:,.0f} m) and the ERG distance x {factor:g} ({floor:,.0f} m); {cells} x {cells} cells of {step:.0f} m"
    # The spill is at the ground and the contour is drawn at the ground (a ground-level release; ground-level
    # receptors): printed in the assumption on every contour.
    release_height_m: 0.0
    receptor_height_m: 0.0
    # The held implementation's skip_low_wind: "the model is unreliable in low wind speeds (< 0.5m/s) and doesn't run
    # if there is a wind speed of 0 m/s" (fastgaussianpuff-repo README, "Danger zone").
    low_wind_ms: 0.5
    low_wind_line: "{n} of {total} puffs not released into the model: the wind driving them was below {cut} m/s, where the puff is unreliable"
    # A contour reaching the grid's edge is clipped there; the extent printed is a floor, not a value (HB-69).
    beyond_grid_line: "{envelope}: at {minutes} minutes the release has travelled past the grid's edge ({half:,.0f} m from the spill); a threshold not drawn then may lie beyond the grid"
    grid_edge_line: "{envelope}: the contour at {thresholds} reaches the grid's edge, {half:,.0f} m from the spill; it extends at least that far"
    timeout_s: 20
    # HB-157 (DN-024 sections 3.5 to 3.10; hazbrief.brief.timeline): the puff at fixed steps from the as-given time, the
    # arrival bands, the uncertainty lines and the range of plume paths. Steps every 15 minutes to 1 hour, then hourly to
    # the horizon (the task's default, 6 h; ceiling 12). ALOHA stops at an hour and 10 km (epa-aloha-users-manual-2007
    # p. 30); HPAC's held fallout display runs to "first six hours" (osd-ncbdp-specialized-radiological p. 6). The run
    # ends at the first step whose interval reaches no new place, or at the horizon (HB-157 ADDENDUM-01 item 3).
    steps:
      fine_step_min: 15
      fine_until_min: 60
      coarse_step_min: 60
      horizon_h: 6
      ceiling_h: 12
      # The arrival sampling between steps: a place the cloud crosses inside one interval is caught at this spacing.
      sample_min: 5
      # The first candidate end the grid is sized for: the puff's own window, so a run that ends inside the hour keeps
      # the grid the contours already use (HB-70's rule); a run still growing there is run again to the next step.
      first_grid_min: 60
      # The step run's own budget: up to six steps' worth of grids on the worst committed brief takes a few seconds.
      timeout_s: 120
      level_line: "Steps and arrival: one level of concern, {threshold} ({as_printed}; {source}), the class's first threshold at its longest held duration"
      end_lines:
        no_new_place: "Modelled to H+{end}: no new place reaches the level after that step (horizon {horizon} h)"
        never_reached: "Modelled to H+{end}: the level is not reached anywhere by then (horizon {horizon} h)"
        horizon: "Modelled to the horizon, H+{end}; the cloud still reaches new places then"
      # ADDENDUM-02 item 1: a layer computed on one wind says so at every step after its own (a stated or observed wind;
      # SLAB's popup reads it on a dense release)
      one_wind: "computed on the {clock} wind; does not follow later shifts"
      # DN-025 (HB-162R): a forecast-driven puff is carried on the forecast wind of every hour it travels
      follows_wind: "on the forecast wind of each hour from {clock}"
      open_end: "modelled to H+{minutes}; continues"
      arrival_title: "Modelled arrival, first order: {threshold}"
      arrival_band: "reached by H+{label} ({clock})"
      # HB-161 item 9: a title is at most eight words; "first order" stays, so the layer reads as what it is
      step_title: "Modelled step outline, first order: {threshold}"
    # ADDENDA 03 to 05 (docs/evidence/hb160/for_hb157.md): the wind-direction uncertainty lines, by the construction NOAA
    # publishes in the ALOHA technical documentation, computed by hazbrief.
    uncertainty:
      # x5 = seconds x U3: "a distance 5 minutes downwind of the source" (noaa-aloha-technical-documentation section
      # 4.5.3, p. 57)
      seconds: 300
      # sigma_y = s_y1 x / sqrt(1 + s_y2 x), Table 13, rural, "for both roughness classes" (Tech. Doc. pp. 43 to 45)
      table13: {A: [0.22, 0.0001], B: [0.16, 0.0001], C: [0.11, 0.0001], D: [0.08, 0.0001], E: [0.06, 0.0001], F: [0.04, 0.0001]}
      # U3 from the 10 m wind by ALOHA's power law (Tech. Doc. p. 49) with the class exponents the source term holds
      # (weather.source_term.constants.power_law_n, p. 22)
      ref_height_m: 10.0
      to_height_m: 3.0
      title: "Wind-direction uncertainty lines (hazbrief's calculation)"
      # HB-163 ADDENDUM-01 item 3: what the two lines are drawn about (the harm path, never a step)
      around_cloud: "the modelled cloud's {tier} area reached at any time"
      around_reached: "the area the puff's steps reached"
      # DN-025 section 3 item 4: on a passive release each step's area is rotated by its own hour's angle
      by_step: ". Each step's area is rotated by the angle of its own hour's wind (DN-025): {angles}"
      by_hour_item: "hour {hour} {alpha:.1f} degrees"
      # HB-161 ADDENDUM-02 items 1 and 2 (operator, 2026-11-11 07:29 EST): the credit is the TEVV section's method
      # field, cited by its document; the brief names no tool hazbrief does not run, so the disclaimer is gone. The
      # Manual's sentence (`quote`) is the section's "not checked against" field (`tevv.sections`).
      credit: "the outline rotated {alpha:.1f} degrees either side of the wind about the source, the angle from the Gaussian plume's width 5 minutes downwind (x5 = 300 x U3 = {x5:,.0f} m, sigma_y {sy:,.0f} m, Table 13 rural coefficients, class {cls}); the construction of NOAA Technical Memorandum NOS OR&R 43, section 4.5.3, p. 57, implemented by hazbrief. Departures: sigma_y is the held Briggs form, not the puff's own Pasquill-Gifford curve; U3 = {u3:.2f} m/s is the {u10:.2f} m/s wind at 10 m reduced by the memorandum's power law, p. 49 (n = {n}); that sigma_y is read at x5 is a reading of the section, which does not write sigma_y(300 U3). No circle is drawn at low wind: the held texts give no rule for it."
      # The held Manual's sentence, as the corpus parse holds it (p. 45); the test compares it to the parsed text.
      quote: "The \"uncertainty lines\" around the longest threat zone enclose the region within which, about 95 percent of the time, the gas cloud is expected to remain."
    # ADDENDUM-02 items 2 to 4: the range of plume paths and the wind shift
    range:
      # HB-161 item 9: the title names the layer; "not a probability" is its TEVV section's limit (T14)
      title: "Range of plume paths (forecast wind's range)"
      what: "the puff run again at the low and high ends of the wind's direction ({lo:.0f} to {hi:.0f} degrees from) and speed ({klo:.1f} to {khi:.1f} km/h) over hours {hours}, with the central run; the band is their outer boundary"
      stated: "a stated wind has no range: nothing else was given to vary"
      no_rows: "no forecast wind is held over the modelled time to take a range from"
      # DN-025 (HB-162R): the puff follows the forecast hour by hour, so one-wind runs at the forecast's ends do not bound
      # its path; the layer is retired (T14), so nothing is run in its place
      follows: "not run: the puff follows the forecast hour by hour (DN-025), so runs on one wind at the forecast's ends do not bound its path"
    # 30 degrees is a configured default, the size HB-143 measured between forecast and observation on csx day; not a
    # held threshold (the strip's own flag keeps FMH-1's 45 degrees, weather.veer_flag_deg)
    shift_limit_deg: 30
    shift_item: "Forecast wind shifts from {a:.0f} to {b:.0f} degrees at {clock}; the plume's later path is less certain"
    sigma_label: "Pasquill-Gifford curves, rural, ISC3 Volume II Tables 1-1 and 1-2 (EPA-454/B-95-003b)"
    # DN-018 section 9, verbatim, with its five placeholders.
    # `{wind}` is `wind_forecast` (DN-018 section 9's words, so a forecast-driven label is unchanged) or, with a stated
    # wind (HB-70 step 3), `wind_stated`: the label must not say "NWS forecast" over a wind the forecast did not give.
    label: "First-order passive puff ({engine} {version}); not a dense-gas model; source assumed: {assumption}; wind: {wind}; stability class {class} by EPA's Turner key. The ERG footprint is the protective action distance."
    wind_forecast: "NWS forecast as of {as_of}"
    wind_stated: "stated by {source}"
    # The panel's first assumption line names the wind driving the puff (HB-70 step 3).
    wind_forecast_line: "Wind: NWS gridpoint forecast {grid}, updated {as_of}; each puff takes the wind of the hour it is released in"
    # DN-025 section 3 item 1 (HB-162R): after its release a puff is carried on the wind of every hour it travels, each
    # forecast hour's value held over its hour (the NWS gridpoint value's own interval); its spread is read at the
    # distance travelled along that path
    wind_follows_line: "Each puff is then carried on the forecast wind of every hour it travels, each hour's value held over that hour; its spread grows with the distance travelled along that path (DN-025)"
    # DN-025 section 3 item 5: a passive release's points measured from the puff's own field at the receptor height,
    # every 2 minutes, SCICHEM's sensor interval (HB-167 Part C item 12)
    points:
      interval_s: 120
    wind_stated_line: "Wind: stated, {speed:.1f} m/s from {direction:.0f} degrees, by {source}{observed}; it replaces the NWS forecast for every hour of the window"
    # HB-143: the observed record (weather.source observed) drives every hour of the window as one wind, as a stated
    # one does: the held engines take one wind, uniform in time (ALOHA, noaa-aloha-technical-documentation PDF p. 12),
    # and HPAC holds a surface observation good for "a period of two to four hours after the surface observations are
    # taken" (osd-ncbdp-specialized-radiological PDF p. 4), longer than the puff's window_min
    wind_observed: "observed, {source}"
    wind_observed_line: "Wind: observed, {speed:.1f} m/s from {direction:.0f} degrees, {source}; one observation drives every hour of the window (HPAC: good for two to four hours after it is taken)"
    # The fall-through (HB-75): an hour the forecast reads 0 takes the nearest station's observation (HB-60) when it is
    # usable at the as-given time and reads a wind; its age and distance always print beside it (DN-009 C1). The
    # observation is one point at one time and the forecast is a model; the line says which drove the puff.
    wind_observation_line: "Wind: NWS gridpoint forecast {grid}, updated {as_of}, reads calm for {calm_hours}; station {station}'s observation, {kmh:.1f} km/h ({ms:.1f} m/s) from {direction:.0f} degrees, observed {observed} ({age} before the as-given time), {distance:.1f} km from the spill, is used for those hours{rest}; each puff takes the wind of the hour it is released in"
    wind_observation_rest: ", and the forecast for {hours}"
    wind_observation_source: "NWS observation, station {station}, {distance:.1f} km from the spill (forecast {grid} reads 0 km/h this hour)"
    wind_observation: "station {station} observation of {observed_at} for {calm_hours} (the NWS forecast as of {as_of} reads calm)"
    # The scenario's stated_wind block (HB-70 step 3; hazbrief.brief.stated_wind), refused like the release block.
    stated_wind_refused: "the stated wind block is refused ({why})"
    # HB-133: the brief holds no wind record (no forecast for the as-given hour and no stated wind)
    no_wind_record: "no wind held for the as-given hour (no forecast cell and no stated wind)"
    # Calm (HB-70 step 4). The held texts give no calm treatment for a puff, so none is invented:
    # - FMH-1 (fmh1-2019 p. 29, section 5.5.2) says only how calm is reported: "When no motion of air is detected, the
    #   wind shall be reported as calm";
    # - ISC3 Volume II (epa-isc3-users-guide-vol2 PDF p. 18, p. 1-5) floors the plume equation's stack-height wind, "The
    #   stack height wind speed, us, is not allowed to be less than 1.0 m/s", and its preprocessor PCRAMMET
    #   (epa-pcrammet-users-guide PDF p. 52, section 4.4) sets "Wind speeds below 1.0 ms-1 (calms included)" to 1.0.
    #   Both bound a steady plume's 1/u; the puff's u moves the cloud, and a floor would carry it 3.6 km an hour through
    #   air that is not moving. What ISC3 does with the calm hour PCRAMMET marks is in ISC3 Volume I, not held;
    # - ALOHA (noaa-aloha-technical-documentation PDF p. 12): "it should not be used for very low wind speeds or calm
    #   conditions"; the held implementation's README: it "doesn't run if there is a wind speed of 0 m/s".
    calm_line: "wind 0: no puff released; state a scene wind to draw it"
    dense_gas_clause: "not a dense-gas model"
    # an envelope that ran and drew no contour (its extents are all 0 m): the layer's reason (HB-110)
    no_contour: "no contour: the modelled concentration stays below every threshold at its minutes"
    not_drawn: "Puff not drawn: {what}"
    # HB-163 ADDENDUM-02 item 2: a release the rule does not class passive runs no puff
    not_run_line: "Puff not run: the release is {line} (DN-026)"
    # HB-120 (DN-020 ADDENDUM-02 item 4): the routing table's not-applicable row, the guide's reason in the ERG's words.
    # Not a degradation: the chemistry takes no dispersion model, so the panel prints it as a statement.
    not_applicable: "Puff: {reason}"
    envelopes:
      worst_case:
        title: "worst case"
        assumption: "EPA RMP worst case: the stated quantity, {quantity:,.0f} kg ({quantity_source}), released as a gas over {minutes:.0f} minutes, at the ground"
      # the source term's envelope (HB-110 step 5): drawn in the worst case's place where a source term exists
      source_term:
        title: "source term"
      alternative:
        title: "alternative release"
        assumption: "EPA RMP alternative release: a {hole_cm:.1f} cm hole ({hole_source}) at {rate:.2f} kg/s by RMP Equation 7-1, until the stated {quantity:,.0f} kg ({quantity_source}) is gone or the window ends ({minutes:.1f} minutes), at the ground"
    # The scenario's release block (DN-018 ADDENDUM-00 section 3; HB-69; hazbrief.brief.release): the quantity is given,
    # never defaulted. These are the lines the panel prints when it is absent or refused.
    release:
      not_given: "release quantity not given. The quantity is on the shipping papers or the train consist"
      refused: "the release block is refused ({why})"
      hole_not_given: "hole size not given"
    # EPA RMP OCA Guidance Equation 7-1, the alternative release from a hole, choked gas flow
    # (epa-rmp-oca-guidance-2009 p. 78; flammable gases by the same method, p. 97):
    #   QR = HA x Pt x (1 / sqrt(Tt)) x GF, QR in pounds per minute, HA in square inches, Pt in psia, Tt in K.
    # Every number below is parsed from its quote, and tests/test_brief_release.py verifies each quote on its held page.
    # A liquefied gas's Pt is its equilibrium vapour pressure at 25 C (Exhibit B-1, as p. 78 directs), so Tt is 298 K.
    equation_7_1:
      terms:
        - {doc: epa-rmp-oca-guidance-2009, page: 78, quote: "QR = Release rate (pounds per minute)"}
        - {doc: epa-rmp-oca-guidance-2009, page: 78, quote: "GF = Gas Factor"}
      tank_temperature_k: {doc: epa-rmp-oca-guidance-2009, page: 78, quote: "(77 F) is 298 K", pattern: 'is ([0-9]+) K'}
      lb_min_per_kg_s: {doc: epa-rmp-oca-guidance-appendices-1999, page: 44, quote: "132.2 = Conversion factor for kilograms per second to pounds per minute", pattern: '^([0-9.]+) ='}
      m2_per_in2: {doc: epa-rmp-oca-guidance-appendices-1999, page: 44, quote: "6.4516 x 10 -4 = Conversion factor for square inches to square meters", pattern: '^([0-9.]+) x 10 (-?[0-9]+) ='}
      # Per material: the Exhibit row as printed; `gas_factor` and `vapor_pressure_psia` are the positions of the values
      # among the row's numbers after the name (Exhibit B-1: molecular weight, ratio of specific heats, endpoint mg/L,
      # ppm, LFB, DF, GF, vapour pressure; Exhibit C-2: molecular weight, ratio, LFL, UFL, LFL mg/L, GF, LFB, DF, PFF,
      # FFF, and no vapour pressure).
      gases:
        "1017": {doc: epa-rmp-oca-guidance-appendices-1999, page: 7, exhibit: "Exhibit B-1", quote: "7782-50-5 Chlorine 70.91 1.32 0.0087 3 ERPG-2 0.19 0.31 29 113 Dense", gas_factor: 6, vapor_pressure_psia: 7}
        "1005": {doc: epa-rmp-oca-guidance-appendices-1999, page: 7, exhibit: "Exhibit B-1", quote: "7664-41-7 Ammonia (anhydrous) c 17.03 1.31 0.14 200 ERPG-2 0.073 0.71 14 145 Buoyant", gas_factor: 6, vapor_pressure_psia: 7}
        "1978": {doc: epa-rmp-oca-guidance-appendices-1999, page: 25, exhibit: "Exhibit C-2", quote: "74-98-6 Propane 44.10 1.13 2.0 9.5 36 22 0.14 0.83 Dense 5.7 0.38", gas_factor: 5, vapor_pressure_psia: null}
    layer_title: "Modelled, first order: {envelope}"
    panel_title: "Modelled, first order (passive puff)"
    # The source-term envelope (HB-110 Part C step 5): where `source_term` computes a release, it replaces the EPA RMP
    # worst case (DN-020 section 3.1); the alternative release keeps its own rule. The assumption names the release
    # model, its rate and duration, its two declared assumptions and every property's tier.
    source_term_envelope:
      # HB-161 ADDENDUM-02 item 1: the release as the fact; its method is cited by document on the TEVV page
      # (`tevv.sections` source_term)
      two_phase: "two-phase flashing release: {mean:.1f} kg/s for {minutes:.1f} minutes ({released:,.0f} kg of the stated {quantity:,.0f} kg, {quantity_source}), flashed fraction {flashed:.2f}, aerosol fraction {aerosol:.2f}, at {ts:.1f} K, at the ground; {assumptions}; properties: {values}{notes}"
      pool: "evaporating pool: {mean:.2f} kg/s for {minutes:.1f} minutes ({released:,.0f} kg of the stated {quantity:,.0f} kg, {quantity_source}), pool up to {diameter:.0f} m across at {tp:.1f} K ({branches}), at the ground; {assumptions}; properties: {values}{notes}"
      value: "{name} {value} {unit} ({tier}; as printed: {as_printed}; {source})"
      # HB-206 item 4: what the floor does, in the same sentence (docs/evidence/hb206/prior_art.md section 5)
      instantaneous: "the release computed to end in {seconds:.0f} s, modelled as one minute, the shortest source the method allows: its mass is unchanged, so near the source its rate and peak are lower than computed, while farther downwind the peak is set by the mass"
      omitted: "not modelled: {what}"
      # One note per tier a value carries (HB-124 step 5; HB-110 ADDENDUM-03 section 3).
      tier_notes:
        # HB-126: CPS joins them (the same input echo; the held Shomate row starts at 298 K, above the boiling point).
        model-test-input: "model-test-input: a program's test-case input (for chlorine, the SLAB user's guide's PR4 test inputs DHE, CPSL, RHOSL and CPS, epa-slab-users-guide-1990 PDF p. 136), not a benchmark-validated property; CPSL, RHOSL and CPS print no temperature, and DHE is used at the 239.10 K it states."
        reference-table: "reference-table: a value read from a held reference table (NIST WebBook, NIST Fluid Systems or CAMEO Chemicals)."
      not_used: "Source term: {why}; the EPA RMP worst case is drawn instead"
  # The source term from the container (DN-020 section 3.1; HB-110; hazbrief.brief.source_term). Every constant the
  # ALOHA methods use, beside its held quote and page (test_source_term.py (a test held privately) verifies each `text_layer` quote on
  # its page; a `rendered_page` entry was read from the page image because the text layer is garbled or withheld, and
  # docs/evidence/hb110/methods.md transcribes it). Pages are the PDF's own (ALOHA technical documentation: printed + 8).
  source_term:
    constants:
      dt_s: {value: 1.0, doc: null, page: null, quote: null, note: "the integration step; ALOHA uses up to 150 steps an hour (technical documentation p. 19), one second is finer"}
      max_duration_s: {value: 3600.0, doc: noaa-aloha-technical-documentation, page: 19, quote: "ALOHA limits the duration of any source to one hour", read_by: text_layer}
      averaging_s: {value: 60.0, doc: noaa-aloha-technical-documentation, page: 19, quote: "the shortest source duration allowed in ALOHA is one minute", read_by: text_layer, note: "the release's largest average is over one minute, the shortest averaged step"}
      discharge_coefficient: {value: 0.61, doc: noaa-aloha-technical-documentation, page: 33, quote: "where Cdis is the discharge coefficient (0.61)", read_by: text_layer}
      vented_pressure_factor: {value: 1.01, doc: noaa-aloha-technical-documentation, page: 33, quote: "when the computed value for Ph reaches 1.01 Pa , it is held constant at that value", read_by: text_layer}
      hne_le_m: {value: 0.1, doc: noaa-aloha-technical-documentation, page: 35, quote: "el = 0.1 m.", read_by: text_layer}
      short_pipe_m: {value: 0.1, doc: noaa-aloha-technical-documentation, page: 36, quote: "to a pipe length of 10 cm, the upper limit of the model", read_by: text_layer}
      pipe_interpolation_m: {value: [0.1, 1.0], doc: noaa-aloha-technical-documentation, page: 36, quote: "For pipe diameters between 0.1 and 1 meter, ALOHA interpolates between the Homogeneous Nonequilibrium Model and the Bernoulli equation", read_by: text_layer}
      big_hole_ratio: {value: 0.2, doc: noaa-aloha-technical-documentation, page: 36, quote: "β c > 0.2", read_by: rendered_page, note: "the critical pressure ratio's big-hole case, typeset"}
      gas_constant_j_mol_k: {value: 8.3144, doc: noaa-aloha-technical-documentation, page: 76, quote: "Rc is the gas constant (8.3144 J K-1 mole-1)", read_by: text_layer}
      clausius_p0_pa: {value: 101000.0, doc: noaa-aloha-technical-documentation, page: 76, quote: "standard pressure (101,000 Pa)", read_by: text_layer}
      min_depth_m: {value: 0.005, doc: noaa-aloha-technical-documentation, page: 34, quote: "terminates the spreading when the depth drops to 5 mm", read_by: text_layer}
      max_diameter_m: {value: 200.0, doc: epa-aloha-users-manual-2007, page: 56, quote: "(up to a maximum diameter of 200 meters)", read_by: text_layer}
      deacon_coefficient: {value: 0.03, doc: noaa-aloha-technical-documentation, page: 21, quote: "* 10 0.03 n UU z", read_by: text_layer, note: "U* = 0.03 U (10 / z)^n, typeset"}
      deacon_height_m: {value: 10.0, doc: noaa-aloha-technical-documentation, page: 21, quote: "* 10 0.03 n UU z", read_by: text_layer}
      power_law_n:
        rows: {A: 0.108, B: 0.112, C: 0.120, D: 0.142, E: 0.203, F: 0.253}
        doc: noaa-aloha-technical-documentation
        page: 22
        quote: "Stability Class n A 0.108 B 0.112 C 0.120 D 0.142 E 0.203 F 0.253"
        read_by: text_layer
      von_karman: {value: 0.4, doc: noaa-aloha-technical-documentation, page: 22, quote: "k is the VonKarmon constant = 0.4", read_by: text_layer}
      euler_constant: {value: 0.577, doc: noaa-aloha-technical-documentation, page: 23, quote: "is Euler’s constant (taken to be 0.577)", read_by: text_layer}
      turbulent_schmidt: {value: 0.85, doc: noaa-aloha-technical-documentation, page: 23, quote: "is the turbulent Schmidt number set equal to 0.85", read_by: text_layer}
      roughness_reynolds: {value: [0.13, 2.0], doc: noaa-aloha-technical-documentation, page: 23, quote: "3.85 1.3 ln for 0.13: smooth, or 0.13 7.3 5 for 2 : rough", read_by: text_layer}
      fsc_smooth_a: {value: 3.85, doc: noaa-aloha-technical-documentation, page: 23, quote: "3.85 1.3 ln for 0.13: smooth", read_by: text_layer}
      fsc_smooth_b: {value: 1.3, doc: noaa-aloha-technical-documentation, page: 23, quote: "3.85 1.3 ln for 0.13: smooth", read_by: text_layer}
      fsc_smooth_c: {value: 0.13, doc: noaa-aloha-technical-documentation, page: 23, quote: "3.85 1.3 ln for 0.13: smooth, or 0.13", read_by: rendered_page, note: "the ln(0.13 Sc) term, typeset"}
      fsc_rough_a: {value: 7.3, doc: noaa-aloha-technical-documentation, page: 23, quote: "7.3 5 for 2 : rough", read_by: text_layer}
      fsc_rough_b: {value: 5.0, doc: noaa-aloha-technical-documentation, page: 23, quote: "7.3 5 for 2 : rough", read_by: text_layer}
      # The laminar Schmidt number: p. 15 defines it in words as "the ratio of the molecular kinematic viscosity of air
      # to the molecular diffusivity of the contaminant gas in air" (nu / kappa) and typesets it Sc = kappa_c / nu. The
      # two disagree by a factor Sc^2. The manual's Example 1 (benzene, p. 56, 77.2 lb/min) is what ALOHA computed:
      # the typeset form reproduces it, the worded form does not (docs/evidence/hb110/methods.md section 4, both runs
      # in worked_examples_result.json). The source term follows the form ALOHA's own output shows it computes.
      schmidt_form: {value: typeset, doc: noaa-aloha-technical-documentation, page: 23, quote: "The laminar Schmidt number, Sc , is the ratio of the molecular kinematic viscosity of air to the molecular diffusivity of the contaminant gas in air", read_by: text_layer, note: "typeset: Sc = kappa_c / nu; worded: Sc = nu / kappa_c"}
      water_vapour_diffusivity_m2_s: {value: 2.39e-5, doc: noaa-aloha-technical-documentation, page: 23, quote: "molecular diffusivity of water vapor in air set equal to 2.39 x 10-5 m2 s-1", read_by: text_layer}
      brighton_correction_limit: {value: 4.0, doc: noaa-aloha-technical-documentation, page: 20, quote: "when the correction factor for highly volatile liquids reaches 4", read_by: text_layer}
      emissivity: {value: 0.97, doc: noaa-aloha-technical-documentation, page: 26, quote: "the puddle emissivity (set equal to that of water = 0.97)", read_by: text_layer}
      stefan_boltzmann: {value: 5.67e-8, doc: noaa-aloha-technical-documentation, page: 26, quote: "the Stefan-Boltzman constant (= 5.67 x 10-8 W m-2K-4)", read_by: text_layer}
      longwave_reflectivity: {value: 0.03, doc: noaa-aloha-technical-documentation, page: 26, quote: "the surface reflectivity to longwave radiation (set to that of water = 0.03)", read_by: text_layer}
      radiation_factor:
        rows: {0: [0.740, 44.3e-6], 1: [0.750, 44.3e-6], 2: [0.760, 44.3e-6], 3: [0.770, 44.2e-6], 4: [0.783, 40.7e-6], 5: [0.793, 40.5e-6], 6: [0.800, 39.9e-6], 7: [0.810, 38.4e-6], 8: [0.820, 35.4e-6], 9: [0.840, 31.0e-6], 10: [0.870, 26.6e-6]}
        doc: noaa-aloha-technical-documentation
        page: 26
        quote: "0 0.740 44.3 1 0.750 44.3 2 0.760 44.3 3 0.770 44.2 4 0.783 40.7 5 0.793 40.5 6 0.800 39.9 7 0.810 38.4 8 0.820 35.4 9 0.840 31.0 10 0.870 26.6"
        read_by: text_layer
      solar_constant: {value: 1111.0, doc: noaa-aloha-technical-documentation, page: 25, quote: "2 1111 1 0.0071 sin .1", read_by: text_layer, note: "Fs = 1111 (1 - 0.0071 CI^2)(sin phi - 0.1), typeset"}
      solar_cloud_factor: {value: 0.0071, doc: noaa-aloha-technical-documentation, page: 25, quote: "2 1111 1 0.0071 sin .1", read_by: text_layer}
      ew_a: {value: 99.89, doc: noaa-aloha-technical-documentation, page: 27, quote: "5431.3 99.89 exp 21.66 100", read_by: text_layer}
      ew_b: {value: 21.66, doc: noaa-aloha-technical-documentation, page: 27, quote: "5431.3 99.89 exp 21.66 100", read_by: text_layer}
      ew_c: {value: 5431.3, doc: noaa-aloha-technical-documentation, page: 27, quote: "5431.3 99.89 exp 21.66 100", read_by: text_layer}
      water_heat_transfer: {value: 500.0, doc: noaa-aloha-technical-documentation, page: 27, quote: "2 G( ) 500 W F t T m K", read_by: text_layer}
      ground:
        rows: {dry_sandy_soil: [2.34, 1.74e-6], concrete: [8.28, 3.74e-6], default_soil: [8.64, 4.13e-6], moist_sandy_soil: [5.31, 3.02e-6]}
        doc: noaa-aloha-technical-documentation
        page: 28
        quote: "Dry Sandy Soil 2.34 1.74 x 10-6 Concrete 8.28 3.74 x 10-6 Default Soil 8.64 4.13 x 10-6 Moist Sandy Soil 5.31 3.02 x 10-6"
        read_by: text_layer
      air_cp_j_kg_k: {value: 1004.0, doc: noaa-aloha-technical-documentation, page: 29, quote: "approximated as a constant 1,004 J kg-1 K-1", read_by: text_layer}
      open_country_z0_m: {value: 0.03, doc: noaa-aloha-technical-documentation, page: 48, quote: "Choosing Open Country sets the surface roughness to 0.03 m", read_by: text_layer}
      # US Standard Atmosphere 1976: its text layer is OCR noise (corpus/sources.yaml: text withheld), so these are
      # read from the rendered pages, as HB-66 read its Tables 2 and 3.
      gravity_m_s2: {value: 9.80665, doc: us-standard-atmosphere-1976, page: 19, quote: "The quantity g0 (= 9.80665 m/s2)", read_by: rendered_page}
      sutherland_beta: {value: 1.458e-6, doc: us-standard-atmosphere-1976, page: 35, quote: "β is a constant equal to 1.458 × 10-6 kg/(s·m·K1/2)", read_by: rendered_page}
      sutherland_s_k: {value: 110.4, doc: us-standard-atmosphere-1976, page: 35, quote: "S is Sutherland's constant, equal to 110.4 K", read_by: rendered_page}
      conductivity_coefficient: {value: 2.64638e-3, doc: us-standard-atmosphere-1976, page: 35, quote: "kt = 2.64638 × 10-3 · T^3/2 / (T + 245.4 × 10^-(12/T)) (53)", read_by: rendered_page}
      conductivity_s_k: {value: 245.4, doc: us-standard-atmosphere-1976, page: 35, quote: "kt = 2.64638 × 10-3 · T^3/2 / (T + 245.4 × 10^-(12/T)) (53)", read_by: rendered_page}
      air_molecular_weight_kg_mol: {value: 0.0289644, doc: us-standard-atmosphere-1976, page: 19, quote: "Table 3: N2 28.0134 0.78084; O2 31.9988 .209476; Ar 39.948 .00934; CO2 44.00995 .000314; Ne 20.183 .00001818; He 4.0026 .00000524; Kr 83.80 .00000114; Xe 131.30 .000000087; CH4 16.04303 .000002; H2 2.01594 .0000005", read_by: rendered_page, note: "sum of F_i M_i over Table 3 = 28.9644 kg/kmol (tests recompute it)"}
      water_molecular_weight_kg_mol: {value: 0.01801534, doc: us-standard-atmosphere-1976, page: 19, quote: "Table 3: O2 31.9988; H2 2.01594", read_by: rendered_page, note: "H2O = H2 + O2 / 2 = 2.01594 + 15.9994 = 18.01534 kg/kmol (tests recompute it)"}
      one_atmosphere_pa: {value: 101325.0, doc: us-standard-atmosphere-1976, page: 18, quote: "P_0 1.013250 x 10^5 N/m^2 (or Pa)", read_by: rendered_page, note: "the pack's air.standard_pressure_pa, same receipt"}
      pa_per_bar: {value: 100000.0, doc: us-standard-atmosphere-1976, page: 18, quote: "mb millibar pressure 100 (N/m2)", read_by: rendered_page, note: "1 bar = 1000 mb = 1e5 Pa; the NIST Antoine rows give P in bar"}
    # The two declared assumptions (DN-020 section 3.1), each from the ALOHA manual's tank example; docs/evidence/hb110/
    # assumptions.md carries the pages and the ERG "large spill" basis.
    assumptions:
      hole:
        area_m2: 2.58064e-3
        width_m: 0.0508
        height_m: 0.00254
        kind: hole
        # HB-161 ADDENDUM-02 item 1: the assumption as the fact; where it came from is on the TEVV page
        label: "hole assumed: a seam failure 40 inches long and 0.1 inch wide (2.58e-3 m2) at the bottom of the tank"
        source: "epa-aloha-users-manual-2007 p. 75"
        quote: "creating a rectangular hole 40 inches long and 0.1 inch wide"
        quote_bottom: "a hole that occurs at the bottom of the tank will give the worst-case estimate"
        doc: epa-aloha-users-manual-2007
        page: 75
        inch_m: {value: 0.0254, doc: epa-rmp-oca-guidance-appendices-1999, page: 44, quote: "2.54 x 10 -2 = Conversion factor for inches to meters"}
      storage_ambient: "storage temperature assumed: the air temperature"
      storage_refrigerated: "storage temperature assumed: the boiling point, a refrigerated liquid at atmospheric pressure (the ERG name says refrigerated liquid)"
      pool_spill: "the stated quantity spilled at once onto default soil at the air temperature, spreading until 5 mm deep"
      ground_kind: default_soil
      roughness: "open country, z0 0.03 m (noaa-aloha-technical-documentation p. 48): no roughness is held for the spill"
      pressure: "ambient pressure: the standard atmosphere's 101,325 Pa (us-standard-atmosphere-1976 p. 18)"
    lines:
      unidentified: "no source term: {why}"
      no_container: "no source term: the container is unknown"
      no_quantity: "no source term: the release quantity is not given"
      no_state: "not applicable: {why} (UN{un})"
      above_critical: "not applicable: UN{un}'s critical temperature, {tc:.1f} K, is below the air's {t:.1f} K, so it cannot be a liquid under pressure"
      no_weather: "not available: no ambient temperature or wind is held for the spill"
      not_available: "not available: {why}"
  # HB-163 ADDENDUM-02 item 1 (DN-026 section 3; hazbrief.brief.engine_rule): which engine a release is modelled with,
  # by the critical Richardson number the held NOAA technical documentation states for choosing between its heavy-gas
  # and Gaussian calculations (noaa-aloha-technical-documentation section 4.4.1, printed pp. 46 to 47, PDF pp. 54 to
  # 55): "When Ric is less than 1, ALOHA considers the gas to be passive". Ri_c = H g_hat / U*^2. The friction velocity
  # is the same document's surface-layer profile (section 4.2, printed pp. 40 to 41, PDF pp. 48 to 49).
  engine_rule:
    threshold: 1.0
    constants:
      gravity_m_s2: 9.80665
      # the source term's own constants (weather.source_term.constants), repeated here so the rule reads one block
      gas_constant: 8.3144
      ambient_pressure_pa: 101325.0
      air_molar_mass_kg_mol: 0.0289644
    profile:
      # "k is the von Kármán constant, taken to be 0.4" (section 4.2, printed p. 40)
      von_karman: 0.4
      wind_height_m: 10.0
      # psi: -4.7 zeta for zeta > 0; a = (1 - 15 zeta)^(1/4) for zeta < 0 (printed p. 41)
      stable_coeff: 4.7
      unstable_coeff: 15.0
      # L = a z0^b by Pasquill class (printed p. 40); class D is neutral (L infinite)
      obukhov: {A: [-11.4, 0.10], B: [-26.0, 0.17], C: [-123.0, 0.30], D: null, E: [123.0, 0.30], F: [26.0, 0.17]}
    basis:
      source_term: "the source term ({model}): its mean rate, its density at the release temperature, the source term's wind, roughness and class"
      worst_case: "the EPA RMP worst case the puff releases (the stated quantity over its duration), as the material's vapour at the air temperature (an assumption: no source term ran)"
    words:
      dense: "dense: Ri_c {ri:,.0f} at or above {threshold:g}"
      passive: "passive: Ri_c {ri:.3g} below {threshold:g}"
      not_determined: "not modelled: the release could not be classed ({missing})"
      # HBD-464 (HB-206; docs/evidence/hb206/protocol.md section 2): appended to the class's words for a release the
      # source term floors to one minute
      floored: ", the release computed to end in {seconds:.0f} s and classed as one minute at its one-minute rate"
  # The dense-gas client (DN-020 section 3.2; HB-111; hazbrief.brief.dense_gas): SLAB's input deck from the source term
  # and the weather, run in the `hazbrief-models` image (deploy/models/) or, for development, by the binary
  # HAZBRIEF_SLAB_BIN names, and its output read into a footprint at the level of concern. Each value names its page.
  # The guide is `epa-slab-users-guide-1990` (PDF pages; printed = PDF - 6); its text layer is the kit's parse.
  dense_gas:
    image: hazbrief-models
    # HB-133 ADDENDUM-01 section 2: the footprint as nested bands, one per held level of concern, as ALOHA draws threat
    # zones (held, epa-aloha-users-manual-2007 PDF p. 16: "For each LOC you choose, ALOHA estimates a threat zone ...
    # If three LOCs are chosen, ALOHA will display the threat zones in red, orange, and yellow. When you use ALOHA's
    # default LOCs, the red zone represents the worst hazard"; p. 12 the same for the display). For the
    # toxic class, the AEGL tiers the pack holds at the class level's averaging time (the same table the class level is
    # read from), lowest concern (outermost) first; any other class draws its class level alone ("one level held").
    bands:
      tiers: [AEGL-1, AEGL-2, AEGL-3]
      primary_tier: AEGL-2
      basis: "an AEGL tier at SLAB's averaging time, as a band beside the class level (HB-133 ADDENDUM-01)"
    docker: docker
    # SLAB's longest distributed test case runs in well under a second; this bounds a pathological deck.
    timeout_s: 300
    # IDSPL by the source term's model (DN-020's table; ADDENDUM-01 section 2, last row): the guide's Table 1 (PDF p. 50)
    # source types "1-evaporating pool release, 2-horizontal jet release". HB-110's hole is a seam at the tank's bottom,
    # so a horizontal jet, not PR4's vertical one. The client routes by `Result.model`, never by material.
    idspl:
      "two-phase flashing release": 2
      # A boiling cryogen's pool (UN1977) is IDSPL 1 even when it is gone in seconds (HB-112, the decision HB-111 left):
      # "it is recommended that an evaporating pool release of any finite duration be run with the source type" 1;
      # SLAB itself redefines it as 4, "short duration evaporating pool release", and restarts when no steady plume
      # forms (epa-slab-users-guide-1990 PDF p. 51, read from the rendered page; HB-102 ocr_slab/p51.txt).
      "evaporating pool": 1
    # The sub-step multiplier: every distributed test case uses 1 (INPR1-INPR4 line 2), the guide's Table 1 field.
    ncalc: 1
    # SLAB's default saturation pressure (SPB -1, SPC 0: the Clapeyron equation through TBP and DHE), as PR1 and PR3 use
    # it. The guide's form (PDF p. 53) is Antoine's in natural log anchored at TBP; the pack's NIST rows map onto it
    # (SPB = ln 10 B, SPC = C), but they are piecewise in temperature where SLAB takes one form, give 0.92 to 0.97 atm at
    # the pack's chlorine TBP where SLAB forces 1 atm, and do not reproduce PR4's own SPB 1978.34, SPC -27.01
    # (docs/evidence/hb111/antoine_vs_pr4.txt). So the default, which needs no unverified mapping.
    spb: -1.0
    spc: 0.0
    # The guide's AS for a two-phase jet (section 3.1.3.3, PDF p. 56): "AS = RHOSL . A_r / rho_m", rho_m = 1 /
    # [(1 - CMEDO)/RHOS + CMEDO/RHOSL], RHOS = WMS . P_a / (R_c . TBP), "P_a = 101325. N/m3", "R_c = 8.31431 J/(mol-K)",
    # A_r "the actual area of the rupture or opening". For a pool, "AS is the area of the evaporating pool" (same page).
    ambient_pressure_pa: {value: 101325.0, doc: epa-slab-users-guide-1990, page: 56, quote: "P_a = 101325. N/m3", read_by: rendered}
    gas_constant_j_mol_k: {value: 8.31431, doc: epa-slab-users-guide-1990, page: 56, quote: "R_c = 8.31431 J/(mol-K)", read_by: rendered}
    # HS: the jet's centre height. No height above ground is held for HB-110's hole (a seam at the tank's bottom); ALOHA
    # enters zero "if the chemical is released at ground level" and a non-zero height only for a Gaussian (passive)
    # release (epa-aloha-users-manual-2007 p. 132). A pool is at ground level (the guide, section 3.1.3.6, PDF p. 57).
    jet_height_m: 0.0
    jet_height_label: "jet centre assumed at ground level: no height above ground is held for the tank's bottom seam"
    # TAV: the concentration averaging time, which sets the level of concern's duration (the pack's AEGL-2 cell at
    # TAV / 60 minutes). 3600 s is the ERG's own basis, the 60-minute AEGL-2 (erg2024-methodology section 4.2.1;
    # DN-020 section 3.2), so the ERG footprint and this one answer the same exposure question.
    averaging_time_s: 3600.0
    loc_kind: AEGL-2
    loc_basis: "AEGL-2 at SLAB's averaging time; the ERG's own basis is the 60-minute AEGL-2 (erg2024-methodology section 4.2.1)"
    # XFFM: the farthest downwind distance SLAB computes. PR4, the guide's chlorine case, uses 10000 m (INPR4 line 19).
    # A level still exceeded at the last row is reported as reaching beyond it, never as ending there.
    max_distance_m: 10000.0
    # HB-157 item 6 (DN-024 section 3.1; Issue 3359fc8b F3): a drawn band still above its level at the last row is run
    # again with XFFM times this factor, up to the ceiling: the distance SLAB's wind carries the cloud over the steps'
    # horizon (weather.puff.steps.horizon_h: the run's domain is sized to the modelled time, task item 6), never past
    # `max_distance_ceiling_m`, a run bound, not a held value (SLAB's run takes well under a second). Without the
    # horizon, csx night's 60-minute average reached 160 km on a 1 m/s wind, 44 hours of travel. ALOHA truncates at
    # 10 km (epa-aloha-users-manual-2007 p. 30); hazbrief does not: a band still open at the ceiling is drawn without
    # its end edge, labelled `open_end`.
    # HB-157 (DN-024 section 3.5): SLAB is not stepped; its plane tables are averaged over TAV
    averaged: "the concentration averaged over {s:,.0f} s from the release (SLAB's TAV), not one moment; not stepped"
    max_distance_factor: 2.0
    max_distance_ceiling_m: 80000.0
    open_end: "modelled to {km:,.1f} km, the wind's travel over the {h}-hour horizon; continues"
    # HB-186 (DN-028 ADDENDUM-12 decision 1): under a stable class (E or F, `agreement.yaml reach.stable_stab`), where
    # SLAB's area is part of every level's planning area, the run is carried until its lowest level closes, as the
    # guide's own procedure says ("an initial SLAB run may have to be made using an estimated value of XFFM to
    # determine the value of XFFM that will cover the concentration range of interest", epa-slab-users-guide-1990
    # printed p. 52, PDF p. 58): XFFM doubles (`max_distance_factor`) with no cut at the horizon's travel, and every
    # row SLAB prints is read. The guide states no distance limit, so `ceiling_m` is a run bound that stops the loop in
    # code, not a held value: a level still open there is drawn open with `open_end` and written "at least". Every
    # night brief's levels close before it (docs/evidence/hb186/closure_probe.tsv). By day nothing changes.
    # HB-189 (DN-028 ADDENDUM-14 decision 5, amending ADDENDUM-12 decision 1): under the stable treatment (any hour of
    # the horizon class E or F, `derive.stability_hours`) SLAB checks how far within the time the brief covers. XFFM
    # still doubles from `max_distance_m`, and the run stops once its lowest level closes or its rows reach the time
    # bound: the release hour's wind's travel over the steps' horizon (weather.puff.steps.horizon_h) times
    # `time_bound_factor`, the operator's "Something needs to go 20% over or 30% over just to try and finish"
    # (2026-11-15, thread hz-18; the larger, 1.3). SLAB's area is drawn and counted to the nearer of closure and the
    # bound; a level the bound stops is drawn open with `open_end` and every count over it is "at least". `ceiling_m`
    # stays a run bound in code, not a held value.
    stable_run:
      ceiling_m: 320000.0
      time_bound_factor: 1.3
      open_end: "still above its level at {km:,.1f} km, where the release hour's wind ({ms:.2f} m/s) carries the cloud in {h:.1f} hours (the {horizon}-hour horizon and 30 percent over); not drawn past it"
    # ZP: the concentration height. ALOHA's level of concern is "a threshold concentration of the gas at ground level"
    # (epa-aloha-users-manual-2007 p. 16). SLAB prints a plane table for each non-zero ZP and always for ZP(1).
    receptor_height_m: 0.0
    # The y/bbc ratios of SLAB's plane table ("y/bbc= 0.0 0.5 1.0 1.5 2.0 2.5", every distributed output).
    crosswind_ratios: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5]
    # Pasquill class to SLAB's STAB (Table 1, PDF p. 50: "STAB stability class value"; 1 to 6 for A to F).
    stab: {A: 1.0, B: 2.0, C: 3.0, D: 4.0, E: 5.0, F: 6.0}
    hints:
      no_image: "build the models image: sh deploy/models/build.sh (README, \"The models image\"), or set HAZBRIEF_SLAB_BIN to a SLAB binary"
      no_docker: "install Docker and build the models image (sh deploy/models/build.sh), or set HAZBRIEF_SLAB_BIN to a SLAB binary"
      no_binary: "HAZBRIEF_SLAB_BIN must name an executable SLAB binary; unset it to use the models image"
      run_failed: "run the deck by hand (docker run --rm -i --network none hazbrief-models < deck) to see SLAB's own message"
      source_term: "the source term is the first premise (DN-020 section 3.1): this footprint needs a source term"
      property: "a pack task supplies the property from a held page (packs/src/materials_properties.yaml)"
      weather: "the weather channel supplies it (NWS gridpoint forecast); nothing is defaulted"
      loc: "the thresholds pack holds no AEGL-2 cell at this averaging time; set dense_gas.averaging_time_s to a held duration"
      threshold: "a pack task supplies the class's level of concern from a held page (packs/src/materials_properties.yaml levels_of_concern)"
      not_recorded: "record it: rebuild the brief with HAZBRIEF_SLAB_RECORD=1 and the models image built (sh deploy/models/build.sh)"
    # ── the layer on the brief (HB-112; DN-020 section 3.3 and ADDENDUM-01; DN-019) ──────────────────────────────────
    # Its default (DN-019 section 3: "on once HB-112 lands") is `map.defaults.dense_gas`.
    # The channel's own inputs (HB-112 step 1): the source term the puff computed (DN-020 section 3.4: the same source
    # term), the meteorology the puff drove on, and the models runner. A missing one degrades this layer alone (C3).
    needs: [puff, stability, forecast]
    # HB-173 item 9: named for what it is, one time-averaged footprint on one wind (T7's limit), at most eight words
    layer_title: "SLAB, one wind, time-averaged: {legend}"
    panel_title: "Modelled, dense gas (SLAB)"
    not_drawn: "Dense-gas footprint not drawn: {what}"
    # HB-120 (DN-020 ADDENDUM-02 item 4): the three states of the modelled tier are drawn, not applicable (this line,
    # the routing table's reason in the ERG's words, and no layer) and not available (`not_drawn`, naming what is
    # missing).
    not_applicable: "Dense-gas footprint: {reason}"
    # HB-120: the routing table's level-of-concern class (packs/release_routing.json `loc_class`) to this channel's
    # class below; a map is keyed by the storage state the table routed (`any` where the guide routes every state
    # alike). No parallel threshold path (HB-120 ADDENDUM-01 section 1): `toxic` is `tih_gas`, AEGL-2 then the IDLH.
    loc_class_keys:
      toxic: tih_gas
      flammable_lfl:
        pressure_liquefied: flammable_liquefied_gas
        refrigerated_liquid: flammable_liquefied_gas
        ambient_liquid: flammable_liquid
        any: flammable_liquefied_gas
      oxygen_deficiency: cryogenic_asphyxiant
    # HB-112 step 1: no image, no docker and no binary read so, with the hint that fixes it
    unavailable: "dense-gas model not available on this machine ({why})"
    # The level of concern per DN-001 class (DN-020 ADDENDUM-01 section 2 item 2; HB-112 ADDENDUM-00), read from the
    # pack's `levels_of_concern` block (HB-109) by its `kind`. TAV, SLAB's averaging time, per class:
    # - toxic: 3600 s, the ERG's own basis, the 60-minute AEGL-2 (`averaging_time_s` above);
    # - flammable and oxygen deficiency: 10 s. Neither threshold is a time-weighted exposure: ALOHA "uses a shorter
    #   averaging time when estimating the flammable areas" because flame pockets form inside a cloud whose average is
    #   below the LEL (epa-aloha-users-manual-2007, section on flammable LOCs; it prints no number), and the SLAB
    #   guide's own pool, jet and instantaneous test cases of methane and ammonia (INPR1 to INPR3, line 19 of each
    #   distributed deck in epa-slab-code.zip) use TAV 10 s. Its chlorine case (INPR4) uses 1 s.
    # The 1991 sentence per release (DN-020 ADDENDUM-01 item 5): Burro behind the cryogenic pool, Desert Tortoise and
    # Goldfish behind the pressurised jets, no trial behind a pool of a liquid at the air's temperature. The counts are
    # DN-020 section 3.3's, from `epa-dense-gas-evaluation-1991` as docs/evidence/hb102/evaluation_1991.md reads it.
    classes:
      tih_gas:
        loc_kind: aegl2
        averaging_time_s: 3600.0
        legend: "toxic, AEGL-2 {minutes:g} min"
        loc_words: "AEGL-2 {minutes:g} minutes, {ppm:g} ppm ({ref}), SLAB averaging over {tav:g} s"
        puff_threshold: "AEGL-2"
        # HB-119 ADDENDUM-00: a material the seed does not hold and the compiled AEGL table publishes none for takes the
        # NIOSH Pocket Guide's IDLH (the resolver's `idlh` block), and the label says so. An IDLH states no exposure
        # duration (cameo-chemicals-help-locs), so SLAB's averaging time stays the class's.
        fallback_kind: idlh
        fallback_legend: "toxic, IDLH (no AEGL published)"
        fallback_words: "level of concern: IDLH, {ppm:g} ppm ({ref}; no AEGL published; an IDLH states no exposure duration), SLAB averaging over {tav:g} s"
      flammable_liquefied_gas:
        loc_kind: lfl_fraction
        averaging_time_s: 10.0
        legend: "flammable cloud, {fraction:g}% LFL{proxy}"
        # HB-161 ADDENDUM-02 item 1: the fraction's document is cited on the dense-gas TEVV section (T7)
        loc_words: "{fraction:g}% of the LFL, {pct:.3g}% by volume (LFL {lfl:g}%{proxy}, {lfl_ref}), SLAB averaging over {tav:g} s"
        puff_threshold: "LFL"
      flammable_liquid:
        loc_kind: lfl_fraction
        averaging_time_s: 10.0
        legend: "flammable cloud, {fraction:g}% LFL{proxy}"
        # HB-161 ADDENDUM-02 item 1: the fraction's document is cited on the dense-gas TEVV section (T7)
        loc_words: "{fraction:g}% of the LFL, {pct:.3g}% by volume (LFL {lfl:g}%{proxy}, {lfl_ref}), SLAB averaging over {tav:g} s"
        puff_threshold: "LFL"
      cryogenic_asphyxiant:
        loc_kind: oxygen_deficiency
        averaging_time_s: 10.0
        legend: "oxygen below {o2:g}%"
        # SLAB's table is the released gas's volume fraction; oxygen falls below the threshold where air is diluted by
        # it: x = 1 - threshold / (air's oxygen fraction), the pack's `air.asphyxiant_vol_pct_at_threshold`, printed.
        loc_words: "oxygen below {o2:g}% by volume ({ref}): the released gas above {pct:.3g}% by volume, 1 - {o2:g}% / {air_o2:g}% (air's oxygen fraction {air_o2_fraction:g}, {air_ref}), SLAB averaging over {tav:g} s"
        puff_threshold: "oxygen below"
    flammable_clause: "a vapour-cloud extent, not a fire or overpressure distance; thermal radiation, overpressure and BLEVE stay ERG guidance"
    # The pack's proxy sentence, "propane properties used for LPG", read into the legend's "(propane, proxy for LPG)"
    # (HB-112 ADDENDUM-02 section 3; DN-020 ADDENDUM-01 item 4).
    proxy_pattern: '^(?P<of>.+?) properties used for (?P<for_>.+)$'
    proxy_legend: " ({of}, proxy for {for_})"
    proxy_line: "properties: {label} (UN{of_un}), {doc} p. {page}: \"{quote}\"; LFL and molecular weight are the proxy's"
    # The label, DN-020 section 3.3 with its bracketed values filled from the run (HB-112 step 3), per class and per
    # release (ADDENDUM-00), the tier clause beside the engine (ADDENDUM-01 section 2).
    label: "Modelled, dense gas: SLAB (LLNL, 1990), run in {engine}{tier_clause}. Source: {source}. Level of concern {loc}. Checked: {check}. {evaluation} The ERG footprint is the protective action distance."
    engine_image: "`hazbrief-models` {image_id}"
    engine_binary: "a local binary, sha256 {sha}"
    check: "SLAB test cases 1 to 4 reproduce at build"
    tier_clause: "; source term rests on model-test-input values ({names})"
    source_two_phase: "{model}, {rate:.3g} kg/s for {duration}, flashed {flashed:.2f}, hole {hole_m2:.3g} m2 assumed (a seam 40 inches by 0.1 inch), from {quantity:,.0f} kg in a {container}"
    source_pool: "{model}, {rate:.3g} kg/s for {duration}, pool up to {area:,.0f} m2, from {quantity:,.0f} kg in a {container}"
    duration: "{seconds:,.0f} s"
    duration_instantaneous: "{seconds:,.0f} s (the one-minute floor; computed {computed:.3g} s)"
    evaluation:
      # HB-178 (audit row 4): each trial named with its material, as the cryogenic pool's is; the held words: "controlled
      # releases of ammonia (Desert Tortoise), liquefied natural gas (Burro), and hydrofluoric acid (Goldfish)" (PDF p12)
      jet: "1991 EPA evaluation: within a factor of 2 on 0/6 Desert Tortoise (ammonia), 0/7 Goldfish (hydrofluoric acid); under-predicts pressurised jets by 2.5 to 3."
      cryogenic_pool: "1991 EPA evaluation: within a factor of 2 on 8/10 Burro (LNG, an evaporating cryogenic pool)."
      pool: "No 1991 trial; checked against a worked example of the cited manual."
    # Each held value's tier, in the cell beside its doc_id and page (HB-112 ADDENDUM-01 section 2); the SLAB names of
    # the source-term inputs, and the once-per-material sentence for a model-test-input value.
    slab_names:
      "heat of vaporisation": DHE
      "liquid heat capacity": CPSL
      "liquid density": RHOSL
      "normal boiling point": TBP
      "molecular weight": WMS
      "vapour heat capacity": CPS
      "saturation pressure (Antoine)": "SPB, SPC: SLAB's default used"
    # HB-126: CPS is a vapour property, so the sentence no longer says "liquid properties"; for chlorine the held
    # reference table (the NIST Shomate row) starts at 298 K and is not extrapolated to the boiling point.
    model_test_input_sentence: "{names} are the SLAB user's guide's recommended test inputs (Table 2, 1990); no reference-table value for them is held for {material} at its boiling point"
    # Reach flags (HB-112 ADDENDUM-02 section 6): a level still exceeded at SLAB's last row or widest ratio.
    beyond_line: "beyond {x:,.0f} m"
    reach_line: "{x:,.0f} m"
    # The panel's run-record sentence follows the channel's state (HB-114 step 5a.2; Issue 6367111e): a drawn
    # footprint's record holds its deck and SLAB's output hash; on a not-applicable or not-available channel
    # the sentence states the channel's state in the line the panel already prints.
    run_record_drawn: "its deck, SLAB's output hash and its inputs are in the evidence appendix"
    run_record_state: "it records the channel's state: {state}"
    # The record (HB-112 step 4; ADDENDUM-02 section 6): every run's deck, output and engine, recorded so the briefs,
    # the extents table and the label test regenerate from it, not from a fresh run, on a machine without the image.
    recordings_dir: fixtures/evidence/slab_runs
    not_recorded: "not available: SLAB's run for this deck ({sha}) is not recorded in {dir}"
    # The comparison the layer prints beside itself (HB-112 step 5; DN-020 section 3.4): ERG, puff, dense gas.
    comparison_line: "Beside the ERG: protective action distance {erg:,.0f} m; puff {puff} ({puff_at}); dense gas {dense}. Modelled over ERG: puff {puff_ratio}, dense gas {dense_ratio}"
  # The smoke layer (DN-021 sections 3 to 6; HB-129; hazbrief.brief.smoke): VSMOKE's PM2.5 at its downwind distances
  # banded into PM2.5 AQI categories, the sensitive-population overlay per band, and the message block per band. Only
  # a scenario with a `fire` block (fixtures/scenario_fires.yaml) has the layer; its map default is
  # `map.defaults.smoke`. The client's own words, hints and label are src/hazbrief/brief/vsmoke.yaml's; the words
  # below are the brief's. While VSMOKE is not built (Issue 69cc2af7) every fire brief prints `not_drawn` with the
  # client's refusal lines, and the overlay and message block print `follows` instead of rows (HB-129 ADDENDUM-01
  # sections 2 and 3). No band is drawn from any other engine's concentration (DN-020 section 3.4).
  smoke:
    panel_title: "Modelled, smoke (VSMOKE)"
    # the scenario's fire block's own note on its emission rate and heat release (fixtures/scenario_fires.yaml)
    note_line: "Emission rate and heat release: {note}"
    # the one line on a fire brief where the bands are not drawn (ADDENDUM-01 section 3)
    follows: "The sensitive-population overlay and the message block follow the smoke layer's AQI bands; no band is drawn (the lines above), so no tract, facility or message is listed"
    # the PM2.5 AQI table (HB-128 step 6): `categories` only, never `guide_printed_pm25` (HB-128 finding 2)
    table: packs/src/aqi_pm25_breakpoints.json
    # VSMOKE's output: PM2.5 at this many downwind distances (DN-021 section 3); a profile of any other length is
    # refused, so the reader cannot attach to a different table silently
    profile_points: 31
    # the facilities are listed in this many worst bands (DN-021 section 5: "the two worst categories")
    worst_bands: 2
    # the facility kinds listed, by the facilities tool's payload key (DN-021 section 5: schools, nursing homes,
    # hospitals), with the words they print under
    facility_kinds: {schools: schools, nursing_homes: nursing homes, hospitals: hospitals}
    # the PLACES arithmetic, shown (HB-129 step 4): prevalence among adults times the tract's adults (Census 2020, the
    # file's totalpop18plus) times the tract's area share inside the band
    places_arithmetic: "{percent:.1f}% x {adults:,} adults x {share:.3f} = {count:,.1f}"
    places_not_estimated: "not estimated"
    # the arrival line (DN-021 section 6): the band's near edge over the brief's wind speed, from the as-given time
    arrival: "reaches {from_m:,.0f} m about {minutes} min after {when}, at {speed:.1f} m/s"
  radar:
    api: nowcoast
    path: observations/weather_radar/ows
    layer: conus_base_reflectivity_mosaic
    opacity: 0.6
    not_held: "radar not held: a replayed brief draws no live tiles; a live brief draws nowCOAST's newest base-reflectivity scan here"
    label: "NOAA nowCOAST MRMS base reflectivity (WMS {layer}), scan {time}; display only, not recorded"
    # Its default (DN-009 ADDENDUM-03 section 1 item 3; DN-019 section 3) is `map.defaults.radar`.
  # Satellite cloud (HB-103 Part A): nowCOAST's geostationary satellite WMS (`/geoserver/observations/satellite/ows`;
  # capabilities recorded 2026-11-04, "Fees NONE", "AccessConstraints NONE"). Two GOES East and West bands, chosen by
  # the footprint's own day or night (`day_night.period`, the ERG's day and night): the capabilities' abstracts say the
  # visible band "provides detection and analysis of clouds and weather systems during daytime", and the longwave
  # infrared band (Band 14, 11.2 um) is thermal, so it sees cloud by night. Both list scans 5 minutes apart over about
  # the last 6 hours; the default is the newest. Display only, as radar is; the snapshot below is the recorded image.
  satellite:
    api: nowcoast
    path: observations/satellite/ows
    bands:
      day: {layer: goes_visible_imagery, name: "GOES visible, Band 2 (0.64 um)"}
      night: {layer: goes_longwave_imagery, name: "GOES longwave infrared, Band 14 (11.2 um)"}
    opacity: 0.6
    # its default (DN-019 section 3: off) is `map.defaults.satellite`
    not_held: "satellite not held: a replayed brief draws no live tiles; a live brief draws nowCOAST's newest GOES scan here, the visible band by day and the longwave infrared band by night"
    label: "NOAA nowCOAST GOES East and West satellite imagery, {band} (WMS {layer}), scan {time}, chosen for the footprint's {period}; display only, not recorded"
  # The wind field (HB-103 Part B): one arrow per NWS gridpoint cell over the footprint's bounding box plus one cell,
  # read from each cell's own /gridpoints/{wfo}/{x},{y} answer at each forecast hour's start (`nws.value_at`), as the
  # window reads the spill's cell. The cells are the spill's cell at offset x and y; which offsets cover the box is
  # worked out from the spill cell's own polygon (the answer's `geometry`), and each arrow sits at its own cell's
  # centre. NWS grids increase x eastward and y northward (the NDFD grid, a Lambert conformal projection).
  wind_field:
    # one cell of margin around the footprint's bounding box (HB-103 step 3)
    margin_cells: 1
    # the most cells either way of the spill's cell: a bound on the calls a footprint can ask for, not a value read
    # (the largest committed footprint, 9.9 km across at Point of Rocks by night, needs 3 each way)
    max_offset: 8
    # its default (HB-103 shipped it off; DN-019 section 3 turns it on) is `map.defaults.wind_field`
    label: "NWS gridpoint forecast, one arrow per 2.5 km cell (the spill's cell and its neighbours, each read from its own gridpoint answer); arrows point downwind, length by speed; shown as data, the footprint is not re-oriented on it"
    footprint_label: "the wind the footprint is oriented on ({source}, as of {as_of})"
    # HB-114 step 1 (Issue 0e90fb2e): a cell whose grid does not cover the hour is read at its grid's nearest covered
    # hour, with the mismatch on this line (the forecast table labels its uncovered hours the same way); a cell with no
    # value there either is an open circle, never filled from another cell. HB-141 F1 (HBD-215; the operator's "dashed
    # lines all over the place" were these cells, read days or weeks after the as-given hour): such a cell is drawn as
    # an open circle, its reading in its title, never as an arrow. An arrow is the wind at the stepped hour.
    uncovered_line: "{n} of {cells} cells hold no forecast for {when}: their grids, updated {updated}, are valid from {valid_from}; each is read at its grid's nearest covered hour, {read_at}, and drawn as an open circle, not an arrow, so it is not the wind at {when}"
    # HB-141 F1 (HBD-215): the legend line, the footprint's cell drawn full and every other cell at this opacity
    legend: "wind field: NWS grid, hour as stepped; footprint on the cell marked"
    own_title: "the cell the footprint's wind record reads"
    muted_opacity: 0.45
    blank_line: "{n} of {cells} cells hold no forecast for {when} or at any hour near it; drawn as an open circle, never filled"
    read_at_title: "read at {read_at}, its grid's nearest covered hour, not {when}"
    # HB-114 step 1 (Issue 33223d90; DN-019 section 5): NWS answers 404 "Gridpoint Does Not Exist" past an office's grid
    # edge (HB-103 found five at the MD-PA line, CTP's south edge). The cell is not drawn and the entry says why; the
    # neighbouring office's grid is not read.
    off_grid_line: "{wfo}'s grid ends before them (NWS answers \"{title}\"); the neighbouring office's grid is not read"
    title: "NWS {grid}, updated {updated}"
    missing_line: "{n} cell(s) not drawn: {why}"
    # the arrow's longest length on screen, pixels (the largest speed in the field); arrows keep their screen size
    # as the map zooms, as wind arrows on a web map do
    arrow_px: 44
    color: "#1f4e79"
    # the footprint's own wind, drawn at the spill in the page accent
    footprint_px: 56
  # The snapshot (HB-103 Part C): at brief time, a live brief asks each service for one image of the map's extent (WMS
  # GetMap, PNG, EPSG:3857, the newest scan at or before the as-given time) and stores it in the evidence store with
  # its request url, the service's time value and the fetch time. A replayed brief draws the stored image instead of
  # "not held". nowCOAST holds only recent scans (radar about the last 8 hours, GOES about the last 6, on the 2026-10-27
  # and 2026-11-04 capabilities), so a scenario whose time has passed cannot be given one.
  snapshot:
    # the longer side of the image, in pixels; the other follows the extent's shape in EPSG:3857
    max_px: 1024
    format: image/png
    # the activity name a stored snapshot is found by in a replayed brief
    activity: weather_snapshot
    none_recorded: "no snapshot recorded for this scenario's time ({when}): a snapshot is taken only by a live brief, from the scans nowCOAST holds at that moment (radar about the last 8 hours, satellite about the last 6), and none is held in this brief's stores"
    too_old: "no snapshot recorded for this scenario's time ({when}): nowCOAST's {layer} lists scans from {first} only"
    label: "{service} snapshot, {layer}, scan {time}, fetched {fetched}; record {sha}"

# The page (D5; HB-38 RESULT section 4's house style and its pinned-CDN rule).
page:
  # the live shell's header line (HB-154 item 4): the place as the location record's point, and how it was derived
  # when the scenario gave a milepost, a crossing or an address rather than a point
  head_place: "{lat:.4f}° {ns}, {lon:.4f}° {ew}"
  head_derived: " (derived by {how})"
  # HB-158 ADDENDUM-01 item 2 (the operator, 2026-11-10 19:25 EST, Issue ad8be8a7 item 3): a source or a section is in
  # one of three states, and no other status word reaches the page. Each state has its own shape as well as its colour,
  # so it reads without colour (WCAG 2.2 SC 1.4.1, "Use of Color", named as a general source, quotation not verified;
  # DN-019 ADDENDUM-04 section 2). `retrieved` takes the call's end time; a replay prints `recorded` with the
  # recording's date in its place (`retrieved` on a brief whose calls were made in this run).
  states:
    retrieving: {glyph: "◌", words: "Retrieving"}
    retrieved: {glyph: "●", words: "Retrieved {time}"}
    recorded: {glyph: "●", words: "Recorded {date}"}
    failed: {glyph: "✕", words: "Could not retrieve"}
  # a section's state (DN-011 D2, and "stale", rendered with a source past its horizon) as one of the three
  section_states: {pending: retrieving, rendered: retrieved, stale: retrieved, degraded: failed}
  font_stack: "Calibri, Carlito, 'Segoe UI', Arial, sans-serif"
  text: "#000000"
  grey: "#595959"
  # orange, 5.2:1 on white (HB-38: #C55A11 fails AA at 4.3:1)
  accent: "#C2410C"
  # Leaflet 1.9.4, pinned on jsDelivr and vendored byte for byte under src/hazbrief/brief/vendor/ (HB-45): the page
  # inlines it, so every layer draws with no network (HB-45 step 7). The sha256 values are checked at render time and
  # equal Leaflet's published SRI hashes (sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo= for the script,
  # sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY= for the stylesheet). BSD-2-Clause, its LICENSE beside it.
  leaflet_origin: https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/
  leaflet_dir: src/hazbrief/brief/vendor/leaflet-1.9.4
  leaflet_js_sha256: db49d009c841f5ca34a888c96511ae936fd9f5533e90d8b2c4d57596f4e5641a
  leaflet_css_sha256: a7837102824184820dfa198d1ebcd109ff6d0ff9a2672a074b9a1b4d147d04c6
  # The roads overlay: the TIGERweb roads image build_ics_201 drew Block 4 over, read from the evidence store (an
  # entity its record `used`) and embedded at the frame it was asked for (EPSG:3857). It is opaque
  # (transparent=false), so it is off over a basemap and switched on when the basemap's tiles do not load.
  roads_export_path: /Transportation/MapServer/export
  roads_attribution: "Roads: U.S. Census Bureau TIGERweb"
  # Block 10 tables the nearest five receiving hospitals; the hospitals section and the map show the same five.
  hospitals_shown: 5
  # The blackboard (DN-019 section 2 item 4; C1, no value without its source and age beside it; HB-114 step 5): the
  # wind the footprint is oriented on, in the first-actions panel and in the wind strip's first cell. {label} is the
  # record's source in DN-019 ADDENDUM-01's form (wind_record.labels; HB-139); `wind_unlabelled` is the label of a
  # wind no record was resolved for (a brief built by a test harness).
  footprint_wind_line: "Oriented on the wind from {deg:.0f} degrees at {kmh:g} km/h ({label})"
  strip_source_line: "{label}"
  wind_unlabelled: "{source}, as of {as_of}"
  # DN-012 section 7: the literal banner on every screen and export, top and bottom.
  banner: "EXERCISE EXERCISE EXERCISE"
  # The header and footer heights the full-screen map is laid out under (px). The header is the banner (24) and one
  # title line (h1 at 20 px, 4 px padding each side); HB-141 F10 moved the status chips out of it to a row below the
  # map, so it no longer holds their second line (it was 92).
  header_px: 60
  footer_px: 28

# The workbench map (DN-012 sections 2, 3; HB-45). One set of GeoJSON layers, bound to whichever map object exists.
map:
  # The Google Maps JavaScript API, loaded once with the key in the script URL as Google documents it (the
  # bootstrap's `key`, `callback` and `loading=async` parameters). The key is an application setting
  # (hazbrief.brief.settings, DN-004), never the server's. Google draws; it is never a source of record (DN-012 s3).
  google_js: https://maps.googleapis.com/maps/api/js
  # Seconds to wait for the Google script before falling back to Leaflet (a blocked or offline page).
  google_timeout_s: 8
  # HB-210: the map's note when Google's script refuses the key (Google calls `gm_authFailure`), fails to load, or does
  # not answer within `google_timeout_s` (the last two draw Leaflet). Read only by a page that carries a key
  # (static/google.js); the committed briefs carry the same words inline in their own map script.
  google:
    note_refused: "Google refused the Maps key; build the brief without it (--no-google)."
    note_blocked: "Google Maps did not load (offline or blocked); the map is Leaflet."
    note_timeout: "Google Maps did not answer; the map is Leaflet."
  # HB-210: Google's traffic layer (`google.maps.TrafficLayer`), a switch on the Google map only, off at first (the
  # operator, 2026-11-10: traffic joins the view switches at the map's top right; `web.shell.overlays` traffic). Google
  # draws it in the browser; hazbrief requests, receives and stores no traffic data, so it has no record and no catalog
  # row as a source of record (DN-012 section 3: Google draws, it is never a source of record). The row exists only on
  # a page with a key; on the Leaflet fallback it is `not_available` and no switch. `label` is its DN-010 line, {time}
  # the time the page was opened in the brief's zone. The legend is the colour key Google's own help states for its
  # traffic lines (Google Maps Help, "Get traffic info & check busy times": green no traffic delays, orange medium
  # traffic, red traffic delays, the darker the red the slower; https://support.google.com/maps/answer/3092439, not
  # fetched in this session: the task's network allowlist holds Google's map hosts only). Google publishes no hex
  # values. The green and the orange are the commonest pixels of those colours on the traffic lines of
  # docs/evidence/hb210/traffic_on.png (HB-210 Part C: #16e098, 8,929 px; #ffcf43, 162 px). NO MEASURED BASIS for the
  # two reds: no road showed them at that look; they are recalled values of Google's palette, to be replaced by a
  # measurement from a look that shows them.
  traffic:
    title: "Traffic now (Google, drawn live in the browser)"
    figure: "live"
    not_available_figure: "not available"
    not_available: "Not available without a Google key: Google's map did not draw on this page."
    label: "Live, Google; page opened {time}"
    drawn_by: "Drawn by Google in the browser. hazbrief requests, receives and stores no traffic data."
    legend:
      - {color: "#16e098", label: "No traffic delays"}
      - {color: "#ffcf43", label: "Medium traffic"}
      - {color: "#f24e42", label: "Traffic delays"}
      - {color: "#a92727", label: "Slowest (darker red)"}
  # The no-key fallback base layers, first is the default, each a radio in the layer control (`label`). Catalog rows
  # basemap:osm and basemap:usgs, whose `terms` carry each source's licence; neither takes a key. HB-141 (F7, HBD-222):
  # the street map is the default and topographic a switch. `needs_referer`: the OSMF Tile Usage Policy requires a
  # Referer from web pages and a page opened from file:// sends none (HB-47 RESULT; catalog basemap:osm), so a page
  # opened from a file opens on the first tile that does not need one, and says so; served over http it opens on the
  # first. The sources are unchanged here (F9 is HB-142's).
  fallback_tiles:
    - name: OpenStreetMap
      label: Street
      url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      attribution: "&copy; OpenStreetMap contributors (ODbL)"
      max_zoom: 19
      needs_referer: true
    - name: USGS National Map topographic
      label: Topographic
      url: https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}
      attribution: "Basemap: U.S. Geological Survey, The National Map"
      max_zoom: 16
      needs_referer: false
  # what the layer control says when a page opened from a file cannot open on the street map (HB-141 F7)
  # HB-161 item 9: a status key beside the map, no sentence; why (the street map's tile policy needs a web page's
  # Referer, HB-47) is the comment above
  file_basemap_note: "From a file: {name}; serve for the street map"
  # The extent: every zone of the footprint (the protective action zone and the isolation circle on its upwind edge)
  # with this padding, and never narrower than min_extent_m across, so a 30 m isolation zone shows its streets.
  fit_padding_px: 24
  min_extent_m: 1200
  # The wind arrow: drawn from the spill downwind, as this share of the largest zone's reach, and never shorter than
  # arrow_min_m. A symbol, not a value: its speed and source are in its popup.
  arrow_share: 0.35
  arrow_min_m: 300
  # HB-133: the wind arrow's popup source when the brief resolved its one wind record
  wind_record_source: "the brief's one wind record: {source}"
  # Geometry read from an exchange is generalized for display (Douglas-Peucker, shapely `simplify`) at this
  # tolerance in degrees (about 10 m), and coordinates are rounded to this many places (about 1 m). Counts and
  # lengths stay the tool's.
  simplify_deg: 0.0001
  coord_places: 5
  # ... and cropped to the first view's extent widened by this share of its size on each side: a river polygon or a
  # long rail line is drawn around where the map looks, not to its far end, and the crop edge is off the first view
  # (HB-45 screenshots: a crop at the footprint's own bounds drew the Potomac as a square around a 100 m zone).
  clip_margin_share: 1.0
  # The population choropleth: 2020 Census block population (P1_001N), five classes, a one-hue sequential ramp
  # (light to dark; the dataviz skill's validated blue). Fixed breaks so every brief's legend reads the same.
  population_breaks: [1, 25, 100, 250]
  population_ramp: ["#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"]
  # HB-192 (DN-024 ADDENDUM-01 decision 9; ADDENDUM-01 section 3): the blocks under the modelled area are drawn
  # dissolved by their colour class (one shape per class, computed locally), simplified so no vertex moves more than
  # `tolerance_deg` (2e-4 degrees: 22 m north-south, 17 m east-west at 39 N, about 0.4 to 2 pixels on the committed
  # first views, as the frames' tolerance). Every count is still read block by block (`modelled_population` rows), and the
  # popup says so.
  # HB-192 (DN-024 ADDENDUM-01 decision 9; ADDENDUM-01 section 2): the road blocks the first map draws: where the
  # boundary crosses a primary or secondary road (derive.roads.classes, TIGER MTFCC as the held road records carry
  # it), and every road at the scene's isolation boundary (`scene_zones`). Every other candidate is listed on the
  # Timeline page (threat.yaml `blocks_table`). Each drawn block says it is a candidate that may not be possible to
  # staff, and one inside the moving cloud's AEGL-1 outline says so (ADDENDUM-02 item 4).
  first_map_blocks:
    scene_zones: [initial_isolation_zone, fire_isolation]
    staff_words: "a candidate only: it may not be possible to staff"
    inside_aegl1_words: "this block stands inside the moving cloud's AEGL-1 outline: it guards the AEGL-2 planning
      area, and staff there may need protection from AEGL-1"
    # the layer's reason where the data holds candidates and none is on a primary or secondary road (map.empty_rows)
    none_drawn: "none on a primary or secondary road: {n} candidates listed on the Timeline page"
  population_dissolve:
    tolerance_deg: 0.0002
    title: "Census blocks with {range} residents each, dissolved"
    range_first: "fewer than {hi}"
    range_mid: "{lo} to {hi_less}"
    range_last: "{lo} or more"
    blocks: "Blocks in this class"
    residents: "Residents, whole blocks (2020 Census)"
    counted: "Counted"
    counted_words: "block by block under the modelled area, each by its area share (the figure); the map draws the
      blocks dissolved by class, so the page carries only what it draws"
  # Colours by layer (house style: orange is the isolation zone and the spill, grey the protective action zone).
  colors:
    spill: "#C2410C"
    initial_isolation_zone: "#C2410C"
    fire_isolation: "#9A3412"
    protective_action_zone: "#595959"
    wind: "#000000"
    receiving_hospitals: "#000000"
    schools: "#7C3AED"
    care: "#BE185D"
    emergency_services: "#B91C1C"
    rail_lines: "#3F3F46"
    grade_crossings: "#3F3F46"
    water: "#0E7490"
    # the derived location's own shape (HB-49): the accent, so it reads with the spill symbol it sits under
    location: "#C2410C"
    # the derivations (DN-015; HB-54): candidates in a dark amber that reads on the grey zone and the basemap; the
    # downstream path in the water colour's darker shade, dashed, so it reads as a route over the waterways layer
    roadblock_candidates: "#92400E"
    rail_candidates: "#3F3F46"
    downstream: "#155E75"
    # the first-order puff (DN-018 section 9; HB-67): violet, dashed outlines with a faint fill, a colour no ERG zone
    # uses, so a modelled contour never reads as a protective action zone; worst case darker than the alternative
    puff_worst_case: "#5B21B6"
    puff_alternative: "#8B5CF6"
    # the source term's envelope (HB-110), drawn in the worst case's place: the same violet family, a shade between
    puff_source_term: "#6D28D9"
    # the dense-gas footprint (DN-020 section 3.3; HB-112): green, a hue no ERG zone, facility or puff layer uses, with
    # a dotted outline (DN-019 section 2 item 3: a distinct pattern per footprint, for colour-blind readers and print),
    # so it never reads as the puff's dashed violet or the ERG's solid grey
    dense_gas: "#047857"
    # past rail hazmat releases (HB-136R): an ochre no zone, facility or modelled layer uses, so a reported past
    # release never reads as a facility or a value of this incident
    incidents_nearby: "#A16207"
    # the services outside the footprint (HB-142R item 1): a teal no zone, facility or modelled layer uses, so a
    # station outside the zone never reads as one in it (the in-footprint stations are red)
    nearby_services: "#0F766E"
    # HB-157 (DN-024): the puff's time layers in its violet family; the arrival bands from dark (first reached) to
    # light (`arrival_ramp`), the step outline the darkest violet, solid; the uncertainty lines a dashed grey-violet;
    # the range of plume paths a faint lavender fill with no outline, so it never reads as the uncertainty lines
    arrival_bands: "#4C1D95"
    step_outline: "#3B0764"
    uncertainty_lines: "#6B5B95"
    plume_range: "#C4B5FD"
    # the population under the modelled area: the population ramp's dark end, outlines only on the choropleth
    modelled_population: "#7F1D1D"
    # the cordons on the modelled boundary: the roadblock symbol in a darker amber than the ERG zones' candidates
    modelled_cordons: "#78350F"
    # HB-155: the suggested command post, triage and staging in the FGDC symbols (HB-152) on a navy no zone, facility or
    # modelled layer uses, so a suggestion never reads as a facility; the routes to them a dashed navy. The edge of the
    # area read is a thin dotted ring in the services' own teal (a mark of that layer, layers._area_ring)
    sited_points: "#1E3A8A"
    siting_routes: "#1E40AF"
  # HB-163 items 4 and 5 (DN-026 section 4): the modelled cloud by health-effect level. The colour order is the held
  # convention: "If you choose three LOCs, ALOHA will display the threat zones in red, orange, and yellow. By default,
  # the red zone represents the worst hazard." (noaa-aloha-threat-zones-output). Each level is a filled area named by
  # its tier's own definition in a few words (cameo-chemicals-help-locs: AEGL-3 "life-threatening health effects or
  # death"; AEGL-2 "irreversible or other serious, long-lasting adverse health effects or an impaired ability to
  # escape"; AEGL-1 "notable discomfort, irritation ... not disabling"), keyed by its threshold and averaging time.
  # Translucent fills, the innermost drawn on top, so the nested areas read as one cloud and the basemap shows
  # through; no ERG zone takes a fill of these hues (the zones keep their hatched outline style).
  cloud:
    levels:
      AEGL-1: {id: harm_aegl1, color: "#F2C200", title: "AEGL-1: notable discomfort, not disabling"}
      AEGL-2: {id: harm_aegl2, color: "#EA7A17", title: "AEGL-2: serious, lasting harm or impaired escape"}
      AEGL-3: {id: harm_aegl3, color: "#C00000", title: "AEGL-3: life-threatening effects or death"}
    fill_opacity: 0.45
    weight: 1
    key: "{ppm:g} ppm, {minutes:g} min"
    level_row: "{name} {ppm:g} ppm at {minutes:g} min"
    path_view: "reached at any time"
    label: "Modelled, dense gas: {engine}, run in `hazbrief-models` {engine_id}, release {release:g} min"
    # DN-025 section 3 item 5: a passive release's cloud is the puff's run
    label_puff: "Modelled, passive puff, first order: {engine} {engine_id}, release {release:g} min"
    not_reached: "the level is not reached at any step"
    # HB-178 (Issue 78ccbb4b; HBD-419): a level whose area reached at any time meets the engine's grid is cut there. The
    # cut is drawn on the level's own layer as a dashed dark line along the grid's edge (a second cue beside colour:
    # NUREG-0700 r4 guideline 1.3.8-10, nrc-nureg-0700-r4 p. 83, "Color coding should be redundant with some other
    # display feature."), its legend entry says so, and every count under it reads "at least" (`derive.modelled`). The
    # held display practice for a bounded zone: ALOHA "truncates threat zones that are longer than 10 kilometers"
    # (epa-aloha-users-manual-2007 p. 30) and says so; NUREG-0700 r4 14.3-4: "the unvalidated status of the data should
    # be clearly indicated" (p. 512).
    cut:
      title: "{name}: cut by the engine's domain"
      words: "the engine's domain (its grid) ends here, {km} km from the release each way; nothing is computed beyond it, so this area, its reach, the people counted under it and any arrival beyond the edge are at least what is drawn"
      # HB-182: {km} is each edge the level's own area meets (agreement.domain_edges), written as below and joined
      km: "{:,.1f}"
      km_join: " and "
      # the popup names no tool hazbrief does not run (HB-161 ADDENDUM-02, HBD-374), so ALOHA's p. 30 stays in the comment above
      basis: "a lower bound is written 'at least' with what cut it (HBD-419); a value not wholly computed is said to be so (NUREG-0700 r4 14.3-4, p. 512)"
      key: "; at least: cut by the engine's domain (dashed)"
      color: "#1A1A1A"
      dash: "3 3"
      weight: 3
    # the one row a dense release prints when the cloud is not modelled (ADDENDUM-02 item 2; ADDENDUM-06 item 5)
    not_modelled_id: cloud
    not_modelled_title: "Modelled cloud"
    no_cloud: "not modelled"
    # item 6 and ADDENDUM-04 items 1 and 2: the measured times, one row under the levels (measurements, no advice);
    # the closed row is the headline, each line at most twelve words
    times:
      at: "{clock} ({hplus})"
      never: "none"
      headline: "Scene clear {clock}"
      headline_open: "On scene at {clock}"
      roadblocks: "{n} roadblocks reached from {clock}"
      roadblocks_none: "no drawn roadblock reached"
      headline_full: "The last level leaves the scene at {at}"
      headline_open_full: "A level still covers the scene at the run's last step, {at}"
      roadblocks_full: "{n} drawn roadblocks reached at the lowest level or above; the first at {at}"
      places_head: "Places the cloud reaches"
      blocks_head: "Roadblocks"
      unnamed: "unnamed"
      place: "{name}: arrives {arr}; {tier} for {mins:g} min; clear {clear}"
      block: "{name}: {tier}; arrives {arr}; {mins:g} min above; clear {clear}"
      block_not: "{name}: not reached"
      # HB-173 (Issue 54dfacf4; DN-028 ADDENDUM-04 decision 5), as DN-028 ADDENDUM-10 decisions 1 and 3 and ADDENDUM-12
      # decisions 2 and 5 amend it: under a stable class each level's planning area is SLAB's area together with
      # SCICHEM's, and every time is from SCICHEM's unresolved run; a place inside the planning area at a level the run
      # does not reach there has no time (the closed headline at most twelve words)
      # HB-189 (DN-028 ADDENDUM-14 decision 10): under the stable treatment every time is the moving cloud's, from its
      # run at the stated vertical setting; a place inside SLAB's extent check only is listed with no time and why
      planning_place: "{name}: inside the {tier} planning area ({engine}); no time"
      headline_slab: "{head} ({vres:g} m run); {n} untimed in SLAB's check"
      headline_slab_none: "{head} ({vres:g} m run)"
      slab_full: "Times are the moving cloud's, from SCICHEM's run at a {vres:g} m vertical setting (an approximation, not converged); each level's planning area is the cloud's area together with SLAB's extent check, which gives no times"
      slab_head: "Inside SLAB's extent check only, not reached at that level by the moving cloud: no time, because SLAB's area is one wind's, time-averaged, with no times"
    # ADDENDUM-06 item 2 (HBD-378, HBD-379): the uncertainty area, outlined, off; its key says turbulence only
    extent:
      id: cloud_extent
      title: "Possible extent, turbulence only"
      color: "#7A0000"
      weight: 1.5
      dash: "4 4"
      key: "{name} or 5 percent chance, turbulence only"
  # HB-173 (HBD-390; DN-028 ADDENDUM-04 decision 6), as DN-028 ADDENDUM-10 decisions 1 and 2 amend it: under a stable
  # class SLAB carries the levels, so the planning shape is SLAB's area at every level, filled in the level's colour as
  # the cloud's levels are (the brief's level areas), on the first view; a level SLAB's table ended inside is drawn open
  # at that end (`open_key`), as SLAB's own layer draws it. The legend names the engine (item 8). A brief without one
  # offers no row.
  # HB-186 (DN-028 ADDENDUM-12 decisions 2 and 3): each level's planning area is SLAB's area together with SCICHEM's;
  # SLAB's part is filled in the level's colour, and SCICHEM's forecast-turned part (its area outside SLAB's) is a dashed
  # outline in the level's colour with no fill, on the first view. Fill against an unfilled dashed outline is a shape
  # and pattern code that does not rest on colour (MIL-STD-1472H 5.17.25.11, PDF p. 409; NUREG-0700 r4 PDF p. 35); the
  # legend names each part.
  # HB-189 (DN-028 ADDENDUM-14 decisions 1 and 6, reversing ADDENDUM-12 decision 3): under the stable treatment the
  # moving cloud is the primary layer, its stepped levels on the first view with the time control; this layer is
  # SLAB's extent check, its band outside the cloud's area at each level, a dashed outline with no fill in the level's
  # colour (the codes of section 2 of ADDENDUM-12 kept, the roles swapped), on the first view. Each feature's popup
  # names it as an extent check on one wind with no times.
  planning:
    id: planning_shape
    # at most eight words (HB-161 item 9); the key names each part in full
    title: "SLAB's extent check, one wind, no times"
    weight: 1.5
    key: "{levels}: SLAB's extent check outside the moving cloud, dashed outline (one wind, time-averaged; no times); the moving cloud's area is the filled levels"
    # the row's figure (the key is the legend's; a row's figure never shrinks)
    figure: "SLAB check, {n} levels"
    label: "Modelled, dense gas: SLAB; record {record}"
    engine:
      slab: "SLAB's extent check"
      scichem: "the moving cloud's area"
      both: "the moving cloud's area and SLAB's extent check"
    # the two parts as each feature's popup names them
    part:
      cloud: "The moving cloud's area: SCICHEM's run by level, timed, hour by hour"
      check: "SLAB's extent check: one wind (the release hour's), time-averaged, no times; outside the moving cloud's area"
    check_dash: "6 5"
    # an SVG paint: no fill (the page's style reads a feature's own `fill`)
    check_fill: "none"
    times: "none from SLAB; the times on this brief are the moving cloud's"
    reach_scichem: "Reach, the moving cloud"
    reach_slab: "Reach, SLAB's check"
    # HB-186 (DN-028 ADDENDUM-12 decision 1): SLAB gives no time; the hours the release hour's wind would take to carry
    # the cloud to SLAB's reach, where they exceed the steps' horizon
    travel: "Travel to SLAB's reach"
    travel_words: "{h:,.0f} hours on the release hour's wind ({ms:.2f} m/s), past the {horizon:g}-hour horizon; SLAB's area is where that wind would carry the cloud if it held"
  # HB-189 (DN-028 ADDENDUM-14 decisions 1, 3 and 8, amending ADDENDUM-10 decision 2): under the stable treatment the
  # moving cloud's stepped levels are on the first view with the time control; their legend states the vertical
  # setting as an approximation. The AEGL-1 level is outlined (`outlined_levels`: no fill), the action levels filled
  # (decision 8, Desktop's assumption). `layers_off` is what stays off on the first view.
  slab_levels:
    layers_off: [cloud_extent]
    outlined_levels: [harm_aegl1]
    cloud_key: "; SCICHEM at a {vres:g} m vertical setting, an approximation, not converged"
    cloud_figure: "SCICHEM, {vres:g} m"
  # HB-157 item 11: the arrival bands' fills, first reached darkest; a band past the last colour takes the last
  arrival_ramp: ["#4C1D95", "#6D28D9", "#8B5CF6", "#A78BFA", "#C4B5FD", "#DDD6FE", "#EDE9FE", "#F5F3FF", "#FAF5FF"]
  # HB-157 item 8: a candidate inside another drawn hazard layer is drawn at this opacity (muted)
  muted_opacity: 0.45
  # The residential-density choropleth (HB-142R item 2; DN-019 ADDENDUM-02 F8): residents per square kilometre of each
  # held block (the population tool's own blocks and counts; no new call), classed in quantile bands of the brief's
  # own blocks (Brewer and Pickle 2002, "Evaluation of methods for classifying epidemiological data on choropleth
  # maps in series", Annals of the AAG 92(4): quantiles are the recommended default for a choropleth; cited by
  # title, not held). The area is the block's whole area (land and water) from its TIGERweb geometry, on the local plane (layers.block_area_km2).
  residential:
    title: "Residential density by Census block (2020)"
    bands: 5
    ramp: ["#fef3c7", "#fcd34d", "#f59e0b", "#b45309", "#78350f"]
    label: "residents per km² of the whole block (2020 Census DHC count over the block's whole area, land and water, from its TIGERweb geometry on the local plane); {n} quantile bands of this brief's {blocks} blocks"
    legend: "Residential density, 2020 Census blocks, residents per km² in {n} quantile bands: {bands}"
  # Past rail hazmat releases inside the brief's zones (HB-136R step 6; DN-010 D3: every point is a held record): the
  # committed points scripts/build_incident_map.py writes from the held FRA Form 54 extract (HB-135), each with its
  # year, severity, FRA report and dataset row. History, not a value of this incident; no sentence is generated from it.
  # PHMSA's 5800.1 incidents are not held (Issue ff08a05d), so the layer is rail only until they are.
  incidents_nearby:
    path: fixtures/incidents/fra_released_incidents_2016_2025.geojson
    title: "Past rail hazmat releases in the zones (FRA Form 54)"
    popup_title: "Rail hazmat release, {year}"
    label: "FRA Form 6180.54 rail equipment accident reports, row {row} (sha256 {sha}), {period}; committed points {path}; not a live source"
    none: "no rail hazmat release in the zones among the {n:,} FRA Form 54 releases of {period} (highway, air and water releases are not held)"
    location_words: {reported_coordinates: "the report's own latitude and longitude (Form 54 Blocks 50 and 51)"}
  # the crossing point's symbol radius (px), drawn under the spill symbol (radius 8), so both show
  location_point_radius: 11
  # The fill patterns (DN-019 section 2 item 3; HB-114 step 4): ALOHA's threat-zone window gives "a distinct pattern per
  # zone for colour-blind readers and black-and-white print" (epa-aloha-users-manual-2007 pp. 45, 152), and the brief
  # adopts the rule for every footprint layer. Each is an SVG <pattern> in user space: `hatch` lines at `angle` degrees
  # `gap_px` apart, `cross` two such sets at right angles, `dots` a dot every `gap_px`. Over the pattern sits a tint in
  # the layer's colour at its old fill opacity, so the colour reads as before. The worst zone is the densest (the
  # isolation zone, cross-hatched); the modelled layers use line directions and dots no ERG zone uses. Leaflet fills
  # with the pattern; Google's Data layer has no pattern fill, so there the colour alone carries it.
  patterns:
    initial_isolation_zone: {kind: cross, angle: 45, gap_px: 6, width_px: 1.4}
    fire_isolation: {kind: hatch, angle: 135, gap_px: 6, width_px: 1.4}
    protective_action_zone: {kind: hatch, angle: 45, gap_px: 10, width_px: 1.2}
    puff_source_term: {kind: hatch, angle: 0, gap_px: 7, width_px: 1.2}
    puff_worst_case: {kind: hatch, angle: 0, gap_px: 7, width_px: 1.2}
    puff_alternative: {kind: hatch, angle: 90, gap_px: 7, width_px: 1.2}
    dense_gas: {kind: dots, angle: 0, gap_px: 8, width_px: 1.6}
    # HB-163: the cloud's levels, each its own pattern as well as its colour (DN-019 section 2 item 3), so the nested
    # levels read apart in greyscale and in print; none repeats an ERG zone's angle and kind
    harm_aegl3: {kind: hatch, angle: 90, gap_px: 5, width_px: 1.4}
    harm_aegl2: {kind: hatch, angle: 135, gap_px: 6, width_px: 1.2}
    harm_aegl1: {kind: dots, angle: 0, gap_px: 6, width_px: 1.2}
  # the pattern's line or dot opacity; the tint under it keeps the layer's own fill opacity
  pattern_opacity: 0.75
  # HB-133 ADDENDUM-01: the modelled bands' fill. Translucent so road names and water bodies read through it (the
  # operator's review: dark cells hid the base map); nested bands add, so the innermost reads darkest. The range is
  # what test_hb133_bands.py (a test held privately) holds the value to; a reader may tune the value inside it.
  band_fill_opacity: 0.18
  band_fill_opacity_range: [0.1, 0.3]
  band_weight: 1
  # The legend (DN-019 section 2 items 1 and 2; HB-114 step 4): one entry per footprint layer naming what it is, the
  # time it stands for and the action. ARAC's plots carry "abbreviated, generalized actions that may be considered
  # within this area" (osd-ncbdp-specialized-radiological pp. 13 to 14). The ERG's action is the zone's own note where a
  # guide gives the distance, else the ERG 2024 Table 1 column headings (erg2024-en-pdf p. 292, "First ISOLATE in all
  # Directions", "Then PROTECT persons Downwind during DAY / NIGHT"); the modelled entries name their levels of concern
  # and averaging times as drawn, each its own (HB-114 ADDENDUM-01 section 2; Issue 74492d10 stays open).
  legend:
    erg_isolate: "First ISOLATE in all Directions"
    erg_protect: "Then PROTECT persons Downwind during {period}"
    erg_toward: " downwind, toward {deg:.0f} degrees"
    # HB-161 item 9: no sentence on the map; the action and its table entry are two clauses of one key
    erg: "{what}, {distance}: {action}; {tag}; for the {period} at {when}"
    puff: "{what}: contours at {levels}{beside}; the first {window} minutes after a release at {when}, on the wind as of {wind_as_of}; a level of concern, not a protective action distance"
    puff_beside: "; set beside the ERG at {at}"
    dense: "{what}: {level}; {reach}; on the wind as of {wind_as_of}; a level of concern, not a protective action distance"
    dense_reach: "farthest downwind {x:,.0f} m (dense gas over ERG {ratio})"
    dense_beyond: "beyond {x:,.0f} m (dense gas over ERG {ratio}): SLAB's table ends while the cloud is still above the level, so this is a lower bound, not an extent"
    # HB-189 (DN-028 ADDENDUM-14 decision 5): under the stable treatment SLAB is drawn to the time bound, not its table
    dense_beyond_time: "beyond {x:,.0f} m (dense gas over ERG {ratio}): SLAB is drawn to the time bound (the release hour's wind's travel in the horizon and 30 percent over) while the cloud is still above the level, so this is a lower bound, not an extent"
    # HB-133 ADDENDUM-01: the bands, outermost first, each with its threshold, unit, duration and receipt (DN-010 D4)
    dense_bands: "; bands, outermost first: {bands}; each band's fill opacity is {opacity:g}"
    dense_band: "{tier} {ppm:g} ppm at {minutes:g} min ({receipt})"
    dense_band_absent: "{tier} not reached on the plane"
    dense_one_level: "; one level held"
    # HB-157: the puff's time layers (arrival bands, step outline, range of plume paths)
    timeline: "{what}: {level}; {end}; {wind}; a level of concern, not a protective action distance"
  # The operator cue block (HB-115 ADDENDUM-01 section 2, the operator's direction of 2026-11-07): at most six lines
  # headed "Before you act on this", each a signal and what is true when it holds, with its receipt: a quoted held page
  # or the brief's own numbers. No line is advice. A line prints only where the brief's state makes its signal true
  # (`layers.cue_lines`). Its default is `map.defaults.cue_block`. Every quote below is checked against the held parsed
  # text by test_hb115_cue_block.py (a test held privately). Two candidates of the addendum are departed from, in the HB-115 RESULT: no
  # held page states that either engine omits rain scavenging, so no rain line; and a night brief holds no day row, so
  # the night line quotes ALOHA's limitation instead of a night-over-day ratio.
  cue_block:
    heading: "Before you act on this"
    max_lines: 6
    # the receipt beside each line, and the line's form: "<signal>: <fact>"
    line: "{signal}: {text}"
    receipt: "{doc} p. {page}"
    lines:
      # Row "night and stable": the brief's own stability class, and ALOHA's limitation for very stable air.
      night_stable:
        when_classes: ["E", "F"]
        signal: "Night, stability class {cls} on this brief"
        # HB-161 ADDENDUM-02 item 1: the fact and its quotation; the document is cited on the TEVV page, so the
        # receipt is the stability class's reference number (`tevv`), not the document id
        text: "very stable air is among the conditions that make a dispersion estimate unreliable: \"{quote}\""
        quote: "Gas concentrations within the cloud can remain high far from the source."
        doc: epa-aloha-users-manual-2007
        page: 28
        tevv: stability_class
      # Row "a tank involved in fire": the brief's own fire isolation distance (the guide's) and the ERG's rule for it.
      tank_fire:
        signal: "Fire involved: the fire isolation zone is {distance}"
        text: "the ERG: \"{quote}\""
        quote: "the fire hazard distance should be used as an isolation distance and Table 1 should be used to protect downwind for residual material release."
        doc: erg2024-en-pdf
        page: 282
      # Row "the ERG distance is the floor": the ERG on adjusting its distances. "The ERG footprint is the protective
      # action distance" is not repeated here: both modelled labels already end with it (HB-115 load read, cut L-01).
      erg_floor:
        signal: "A modelled layer is drawn"
        text: "it is one scenario; the ERG: \"{quote}\""
        quote: "These adjustments should only be made by technically qualified personnel."
        doc: erg2024-en-pdf
        page: 282
      # Row "the dense-gas engine under-predicts pressurised jets": the label's own 1991 sentence, `dense_gas.evaluation.jet`.
      jet:
        # HB-173 (Issue 41d9c57c): the 1991 evaluation is SLAB's, so the signal names SLAB, the second method; the drawn
        # cloud is SCICHEM's, whose own reported evaluation is section T45's
        signal: "SLAB, the second method, on a pressurised jet"
        # DN-028 ADDENDUM-10 decision 1, as ADDENDUM-12 decision 2 amends it: under a stable class SLAB's area is part
        # of every level's planning area
        signal_slab_levels: "SLAB, whose time-bounded area is every level's extent check here, on a pressurised jet"
        text: "{sentence}"
        quote: "For DT-NH3, SLAB consistently underpredicted maximum concentrations by a factor of 2.5 at both 100 m and 800 m."
        doc: epa-dense-gas-evaluation-1991
        page: 94
        # the held text is an OCR parse with no page numbers ("DI-NH3", "800 mM"); the page and quote are checked
        # against HB-102's transcription, which the label's counts already cite (DN-020 section 3.3)
        transcript: docs/evidence/hb102/evaluation_1991.md
      # Row "indoor concentration is not modelled": a fact of this brief, with ALOHA's page for how indoor concentration
      # is estimated when it is.
      indoor:
        signal: "People indoors"
        # HB-161 ADDENDUM-02 item 1: the fact alone; how another method estimates indoor concentration is the
        # source term's TEVV "Further checks, not run" (`quote` stays for the held-text test)
        text: "the modelled layers are outdoor concentrations; this brief estimates no indoor concentration"
        quote: "To estimate indoor pollutant concentration, ALOHA first estimates the building's air exchange rate"
        doc: epa-aloha-users-manual-2007
        page: 105
        tevv: source_term
      # Row "the night chlorine extent is a lower bound" (Issue 2ed5d412 stays open): the dense-gas legend's own words and
      # number, `legend.dense_beyond`, never reworded (HB-115 ADDENDUM-02 section 1).
      lower_bound:
        # HB-173 (Issue 54dfacf4): the reach is SLAB's legend's, so the signal names SLAB, the second method; both
        # engines' reaches are the checklist's Two methods item
        signal: "SLAB's reach, the second method"
        signal_slab_levels: "SLAB's time-bounded reach, every level's extent check under the stable treatment"
        text: "{reach}"
        doc: null
        page: null
        receipt_text: "the dense-gas layer's own legend on this brief"
  # The defaults (DN-019 section 3; HB-114 step 3): what a reader sees on before any click, one line per layer id the
  # page offers, read by `layers.build` and the layer list and never typed in a renderer ("Every default is one line in
  # orchestrator.yaml, never a literal in a renderer"). Values are the quoted words "on" and "off": YAML 1.1 reads a
  # bare on as a boolean. A layer the brief does not hold (radar on a replayed brief, a puff on a guide no release model
  # applies to; HB-120) offers no box, so "on" means on where drawn. test_hb114_defaults.py (a test held privately) holds a copy of
  # DN-019's table and goes red when a default moves here without a DN-019 addendum.
  defaults:
    # Row 1, "the protective action distance is the product": the spill point and its location record (DN-013), the
    # ERG zones (the fire isolation zone is the guide's own ERG zone), and the roadblock candidates of HB-54, roads and
    # rail (the panel's "Roadblock candidates" lists both).
    spill: "on"
    location: "on"
    initial_isolation_zone: "on"
    protective_action_zone: "on"
    fire_isolation: "on"
    roadblock_candidates: "on"
    rail_candidates: "on"
    # Row 2: the footprint wind (the arrow the footprint is oriented on) and the wind field at the brief's hour.
    wind: "on"
    wind_field: "on"
    # Row 3: radar, "on when live or when a snapshot is held"; a box exists only when one is.
    radar: "on"
    radar_snapshot: "on"
    # Row 4: satellite cloud, live or stored, off ("two raster layers at once hide the footprint").
    satellite: "off"
    satellite_snapshot: "off"
    # Row 5: the puff, its first envelope (the source term's, or the worst case's where no source term ran; HB-110).
    # The alternative envelope is a second shape for the same hazard, so it is off and listed (section 2 item 1: one
    # footprint per hazard with one legend entry).
    puff_source_term: "on"
    puff_worst_case: "on"
    puff_alternative: "off"
    # Row 6: the dense-gas footprint (HB-112 has landed). HB-163 (ADDENDUM-03 item 2): SLAB is the second dense-gas
    # method, drawn only beside the modelled cloud and off by default.
    dense_gas: "off"
    # The smoke footprint's AQI bands (DN-021 section 7; HB-129 step 3): on for a fire fixture, the only brief that
    # has the layer (a scenario with a `fire` block). Not a row of DN-019's table: DN-021 governs it, as HB-115
    # ADDENDUM-01 governs the cue block. While VSMOKE is not built no band is drawn, so no box is offered.
    smoke: "on"
    # Row 7 ("downstream path, waterbodies, structures, hospitals, low-lying areas") and every layer the table does
    # not name: off, listed.
    downstream: "off"
    water: "off"
    schools: "off"
    care: "off"
    emergency_services: "off"
    receiving_hospitals: "off"
    rail_lines: "off"
    # HB-136R step 6: past rail hazmat releases inside the zones, off and listed (DN-019 section 3: a new layer is off
    # unless an addendum turns it on)
    incidents_nearby: "off"
    # HB-142R items 1 and 2 (DN-019 ADDENDUM-02 F6, F8): the services outside the footprint and the residential
    # density, new layers, off and listed by DN-019 section 3's rule; F8 names the choropleth "off by default".
    # HB-157 item 9 turns the services on (Issue 3359fc8b F6: the stations beside the hospitals went unnoticed).
    nearby_services: "on"
    # HB-155 (DN-023; VR-147): the suggested points and their routes are on (item 8: "on by default"); the edge of the
    # area read is drawn with the services it bounds (ADDENDUM-02 item 6: an empty map past it reads as not fetched)
    sited_points: "on"
    siting_routes: "on"
    # HB-157 (DN-024 section 3): the arrival bands are the default modelled view (item 11), the step outline is what
    # the time control moves (item 12), the uncertainty lines are on with their layer (ADDENDUM-03 item 2), and the
    # cordons on the modelled boundary are row 1's roadblocks (item 8); the population under the modelled area is off
    # as the population layer is, and the range of plume paths is off (ADDENDUM-02 item 3)
    # HB-163 items 8 and 9 (ADDENDUM-01 item 4): the first view draws the incident, the ERG zones, the modelled cloud
    # reached at any time by level and its two side lines, and the suggested points; every other modelled layer is off
    # and one click away: the step outline, the arrival bands, the other engine (dense_gas, below), the uncertainty
    # area, the modelled cordons and the modelled population. These lines replace HB-157's (arrival bands, step
    # outline and modelled cordons on) by HB-163's records.
    harm_aegl3: "on"
    harm_aegl2: "on"
    harm_aegl1: "on"
    cloud: "on"
    # HB-173 (HBD-390; DN-028 ADDENDUM-04 decision 6): the planning shape is on the first view; it exists only under a
    # stable class, where since DN-028 ADDENDUM-12 it is SLAB's area together with SCICHEM's at every level (the brief's
    # level areas), and there the cloud's stepped levels and extent are off (`map.slab_levels`)
    planning_shape: "on"
    cloud_extent: "off"
    arrival_bands: "off"
    step_outline: "off"
    uncertainty_lines: "on"
    modelled_cordons: "off"
    modelled_population: "off"
    plume_range: "off"
    residential_density: "off"
    grade_crossings: "off"
    flags: "off"
    population: "off"
    workplaces: "off"
    # Not a map layer: the operator cue block (HB-115 ADDENDUM-01 section 2, "a DN-019 layer with a declared default
    # (on)"); its <details> opens when on.
    cue_block: "on"
    roads: "off"
    # Row 8: the hour stepper opens at this forecast hour (0, the brief's hour).
    hour_stepper: 0
  # HB-154 item 5 (DN-019 ADDENDUM-03 section 3): the layer list's rows grouped under plain headings, in this order,
  # each row under the group that lists its layer id. Every layer the list can offer is listed once; a row whose
  # layer no group lists stops the render (engineering standards section 4). A group no drawn layer falls in prints
  # its heading and `empty`, never a row.
  # HB-158 (DN-019 ADDENDUM-04 section 3; the operator's review of 2026-11-10, G5): the Sited points group is gone until
  # the siting layer exists ("until the siting layer exists the block is absent, not an empty heading"); HB-155 adds
  # its group, titled "Command post, triage and staging (suggested)". A group's rows print in its `layers` order (the
  # zones before the models), not in draw order. The `none` group holds the rows of layers with nothing to draw
  # because nothing is there (`empty_rows`, `as: none`), muted, collapsed on the live page.
  layer_groups:
    - id: hazard
      title: Hazard
      # HB-163: the modelled cloud's levels, worst first, then its side lines and its turbulence extent, under the ERG
      # zones; `cloud` is the one row a dense release prints when the cloud is not modelled
      # HB-171 item 10: the threat timeline's next rows (`threat_next`) first, above the group's existing rows
      # HB-173: the planning shape follows the cloud's levels it reaches past
      layers: [threat_next, spill, location, initial_isolation_zone, protective_action_zone, fire_isolation, harm_aegl3,
               harm_aegl2, harm_aegl1, planning_shape, cloud, cloud_times, uncertainty_lines, cloud_extent,
               arrival_bands, step_outline,
               plume_range, dense_gas, puff_source_term, puff_worst_case, puff_alternative, smoke, downstream, water,
               flags, incidents_nearby]
    - id: responders
      title: Responders
      layers: [nearby_services, emergency_services, receiving_hospitals]
    - id: access
      title: Access
      layers: [roadblock_candidates, modelled_cordons, siting_routes, rail_candidates, roads, rail_lines,
               grade_crossings]
    # HB-155 ADDENDUM-05 item 1 (HBD-345: "Sited points" told the operator nothing): the suggested points' group, after
    # Access; its id is `siting`, never `sited`
    - id: siting
      title: "Command post, triage and staging (suggested)"
      layers: [sited_points]
    - id: people
      title: People
      layers: [population, modelled_population, residential_density, workplaces, schools, care]
    - id: weather
      title: Weather
      # HB-210: traffic (a page with a Google key only) first, the weather's switches after it
      layers: [traffic, wind, wind_field, radar, radar_snapshot, satellite, satellite_snapshot]
    - id: none
      title: "Checked, none found"
      layers: []
      holds: none
  # HB-158 item 3 (G4, G10, G11): each layer row is one line: its box, its swatch, a name of a few words and the one
  # figure that matters; the full title, legend, label line and source open under it (a <details>). `name`: the row's
  # short name (the full title is in the expansion when it differs); `unit`: the noun after a count; `figure`: a figure
  # other than the count, read from the layer's own held text: `zone` (the ERG distance's US-unit part, which ERG 2024
  # Table 1 and Table 3 print beside the metric, then `zone_words`), `farthest` (the legend's "farthest downwind N m"),
  # `steps` (the legend's "Modelled to H+N"), `wind` (the legend's direction and speed), `none` (no figure).
  rows:
    zone_words: {initial_isolation_zone: "all round", protective_action_zone: "downwind", fire_isolation: "all round"}
    layers:
      spill: {name: "Spill point", figure: none}
      location: {name: "Location as given", unit: shape}
      initial_isolation_zone: {name: "Initial isolation zone", figure: zone}
      protective_action_zone: {name: "Protective action zone", figure: zone}
      fire_isolation: {name: "Fire isolation zone", figure: zone}
      arrival_bands: {name: "Modelled arrival", figure: steps}
      step_outline: {name: "Modelled outline at the step", figure: steps}
      uncertainty_lines: {name: "Wind-direction uncertainty", unit: lines}
      # HB-163: a cloud level's row prints its key (the threshold and its averaging time)
      harm_aegl3: {name: "AEGL-3, life-threatening", figure: legend}
      harm_aegl2: {name: "AEGL-2, serious, lasting", figure: legend}
      harm_aegl1: {name: "AEGL-1, discomfort", figure: legend}
      cloud_extent: {name: "Possible extent, turbulence only", figure: none}
      cloud: {name: "Modelled cloud", figure: none}
      plume_range: {name: "Range of plume paths", figure: steps}
      # HB-173 item 9: the second engine named for what it is, one time-averaged footprint on one wind (T7's limit)
      dense_gas: {name: "SLAB, one wind, time-averaged", figure: farthest}
      # DN-028 ADDENDUM-10 item 8: the legend names the engine per layer; the row prints its key
      planning_shape: {name: "Levels, planning area (stable)", figure: legend}
      puff_source_term: {name: "Puff: source term", unit: contours}
      puff_worst_case: {name: "Puff: worst case", unit: contours}
      puff_alternative: {name: "Puff: alternative release", unit: contours}
      smoke: {name: "Smoke (AQI bands)", unit: bands}
      downstream: {name: "Downstream path", unit: path}
      water: {name: "Waterways", unit: features}
      flags: {name: "Flags with a location", unit: flags}
      incidents_nearby: {name: "Past rail releases", unit: releases}
      # HB-155 ADDENDUM-05 item 2: the layer is every service in the area now, not the nearest three
      nearby_services: {name: "Services in the area", unit: stations}
      sited_points: {name: "Command post, triage, staging", unit: points}
      siting_routes: {name: "Routes to the suggested points", unit: routes}
      emergency_services: {name: "Stations in the zones", unit: stations}
      receiving_hospitals: {name: "Receiving hospitals", unit: hospitals}
      roadblock_candidates: {name: "Roadblock candidates", unit: points}
      modelled_cordons: {name: "Roadblocks, modelled edge", unit: points}
      rail_candidates: {name: "Rail crossings of the edge", unit: points}
      roads: {name: "Roads image", figure: none}
      rail_lines: {name: "Rail lines", unit: segments}
      grade_crossings: {name: "Grade crossings", unit: crossings}
      population: {name: "Population", unit: blocks}
      modelled_population: {name: "Population, modelled area", unit: blocks}
      residential_density: {name: "Residential density", unit: blocks}
      workplaces: {name: "Workplaces", unit: blocks}
      schools: {name: "Schools", unit: schools}
      care: {name: "Hospitals, nursing homes", unit: sites}
      wind: {name: "Wind", figure: wind}
      wind_field: {name: "Wind field", unit: cells}
      radar: {name: "Radar now", figure: none}
      radar_snapshot: {name: "Radar snapshot", figure: none}
      satellite: {name: "Satellite now", figure: none}
      satellite_snapshot: {name: "Satellite snapshot", figure: none}
      traffic: {name: "Traffic", figure: none}
  # HB-158 item 4 (G1, G6): a layer with nothing to draw is sorted by its reason, first match wins (`starts` or
  # `contains`, matched against the reason as the layer gives it):
  # - `none`: nothing is there. Its normal row, muted, in the `none` group, its line `say`, the reason in the expansion.
  # - `gap`: the reader would expect it and it could not be had (a source not reached or not recorded, a model not run).
  #   Listed under one collapsed line, "N layers could not be drawn" (`gaps_line`), each with `say` and its reason, and
  #   each a Data gaps item worded the same (`layer_gap_line`).
  # - `unlisted`: off by default and irrelevant to this incident when it has nothing to draw; not on the brief. The
  #   operator's example (G1) is the past rail releases layer: "no rail hazmat release in the zones" told him nothing.
  # A reason no rule matches is a gap with `gap_default` (shown, never hidden), and test_hb158_less_at_once.py (a test held privately)
  # holds every reason on the 28 committed briefs to a rule.
  empty_rows:
    - {layer: incidents_nearby, as: unlisted}
    # HB-155 ADDENDUM-05 item 3 (HBD-346, HBD-358): no candidate survives for any point is a gap the reader would
    # expect filled, listed under the could-not-be-drawn line and a Data gaps item in the same words; a point missing
    # beside drawn ones is its own Data gaps item (orchestrator.siting_gaps), not an empty layer
    - {starts: "no candidate outside the hazard", as: gap, say: "no candidate outside the hazard"}
    - {starts: "no held road route avoids", as: gap, say: "no route avoids the hazard"}
    - {contains: "a brush fire", as: none, say: "not for this incident"}
    - {contains: "No dispersion model applies", as: none, say: "no release model for this guide"}
    - {starts: "none in the footprint", as: none, say: "none in the zones"}
    - {starts: "no grade crossing in the footprint", as: none, say: "none in the zones"}
    - {starts: "no rail line in the footprint", as: none, say: "none in the zones"}
    - {starts: "no waterway in the footprint", as: none, say: "none in the zones"}
    - {starts: "no road of class", as: none, say: "none in the zones"}
    # HB-192 (DN-024 ADDENDUM-01 decision 9): every candidate is off the first map, on the Timeline page's table
    - {starts: "none on a primary or secondary road", as: none, say: "none on a major road"}
    - {starts: "no rail line crosses a zone boundary", as: none, say: "none crosses a zone edge"}
    - {starts: "none of this incident's", as: none, say: "none has a location"}
    - {starts: "no flag holds", as: none, say: "none for this incident"}
    - {starts: "the guide gives no such zone", as: none, say: "none for this incident"}
    - {starts: "the level is not reached", as: none, say: "level not reached"}
    - {starts: "no contour", as: none, say: "level not reached"}
    - {starts: "no modelled layer is drawn", as: none, say: "no modelled area"}
    - {starts: "no step outline", as: none, say: "no modelled outline"}
    - {starts: "no outline to draw", as: none, say: "no modelled outline"}
    # HB-163 (ADDENDUM-02 item 2; ADDENDUM-06 item 5): a dense release's cloud not modelled (the release not classed,
    # or SCICHEM's own refusal), worded as the refusal begins
    - {starts: "not modelled: the release could not be classed", as: gap, say: "not modelled: release not classed"}
    - {starts: "not modelled", as: gap, say: "not modelled"}
    - {contains: "its upstream answer is not recorded", as: gap, say: "not recorded"}
    - {contains: "No recorded exchange", as: gap, say: "not recorded"}
    - {contains: "a replayed brief draws no live tiles", as: gap, say: "not recorded"}
    - {starts: "no snapshot recorded", as: gap, say: "not recorded"}
    - {starts: "the derivations have not run", as: gap, say: "not run"}
    - {contains: "calm forecast", as: gap, say: "model not run: calm wind"}
    - {contains: "not given", as: gap, say: "model not run: an input not given"}
    - {contains: "not in the puff's materials pack", as: gap, say: "model not run: material not held"}
    - {contains: "not resolved to an ID number", as: gap, say: "model not run: material not identified"}
    - {contains: "storage state is not held", as: gap, say: "model not run: property not held"}
    - {contains: "does not hold", as: gap, say: "model not run: property not held"}
    - {contains: "no source term", as: gap, say: "model not run: no source term"}
    - {contains: "is unavailable", as: gap, say: "could not retrieve"}
    - {starts: "NLDI", as: gap, say: "could not trace"}
  gap_default: "could not be drawn"
  gaps_line: "{n} layers could not be drawn"
  gaps_line_one: "1 layer could not be drawn"
  layer_gap_line: "{name}: {say}"
  layer_gap_receipt: "the layer list: {reason}"
  # HB-161 item 6: an open band is drawn with no outline at its end, and its legend carries this one key; the sentence
  # that said how the run ended is the layer's TEVV section (`tevv`)
  open_key: "continues beyond what is drawn"
  # HB-161 items 3 to 5 (operator, 2026-11-11 06:38 EST): the modelled layers' legends are their keys alone, a
  # threshold with its value, unit and time and the distance a reader acts on; everything else is the TEVV section
  key_legend:
    timeline: "{threshold}, {as_printed}; steps to {end}"
    puff: "contours at {levels}"
    dense: "{reach}; bands: {bands}"
    dense_band: "{tier} {ppm:g} ppm at {minutes:g} min"
    dense_reach: "farthest downwind {x:,.0f} m"
    dense_beyond: "beyond {x:,.0f} m"

# HB-161 ADDENDA 01 to 05 (operator, 2026-11-11 06:38, 07:12 and 07:29 EST): the TEVV page. Every brief writes
# `tevv.html` beside `brief.html` from the same state; one section per thing the brief draws or states from a method.
# A section's number belongs to its id, never to a brief: the same number means the same thing on every brief, and a
# number is never reused (a retired id keeps its number with `retired:`). On the brief the number is a small link at the
# end of the layer's row, on its popup, in the tab summary, beside a method's heading in the Zones and models tab and on
# each Sources and MCP servers row that feeds the section. Each section's fields are fixed (ADDENDUM-01 item 3,
# ADDENDUM-02 item 3); each field is a statement of fact.
# - `checked` and `not_checked` are HB-159's to set from the graph (HB-159 ADDENDUM-02); until it runs they are filled
#   from what the labels stated and the section is marked `pending_state`.
# - `agreement` lists valid methods only (ADDENDUM-03 item 1): a modelled layer reads `agreement_hb163` until HB-163
#   runs; a section computed by one method reads `one_method`.
# - `further` is the only place a tool hazbrief does not run is named as a tool (ADDENDUM-02 item 3); a check there is
#   never a step the operator is asked to do.
# - `tools`: the channels and derivations whose Sources and MCP servers row carries the section's number.
tevv:
  file: tevv.html
  prefix: "T"
  title: "Test, evaluation, verification and validation: {name}"
  lede: "One section per thing the brief draws or states from a method. A number on the brief opens its section here; the same number means the same thing on every brief."
  link_text: "TEVV"
  link_title: "TEVV section {ref}: {what}"
  pending_state: "state set by checkpoint four"
  one_method: "one method"
  # HB-163 ADDENDUM-05 item 1: the cloud's three level layers document one section, the harm path
  aliases: {harm_aegl1: harm_path, harm_aegl2: harm_path, harm_aegl3: harm_path, cloud: engine_rule}
  # HB-162R (DN-025 section 3 item 5): on a passive release the cloud by level is the puff's run, so its level layers,
  # its steps and its point lines document the puff's sections (T51 to T54); T45 to T49 stay SCICHEM's
  # (`tevv.brief_cfg`)
  engine_aliases:
    puff: {harm_aegl1: puff_harm_path, harm_aegl2: puff_harm_path, harm_aegl3: puff_harm_path, harm_path: puff_harm_path,
           cloud_at_time: puff_cloud_at_time, arrival_lines: puff_arrival_lines, roadblock_lines: puff_roadblock_lines}
  # HB-163 ADDENDUM-05 item 2 (ADDENDA 02, 03 and 06 item 7): "Agreement between methods". On a dense release the cloud's
  # sections and SLAB's list the other valid dense-gas method with its numbers; the puff never appears there. The held
  # comparison is read from HB-167's evidence files (never retyped) for the briefs whose release it was run on.
  agreement:
    sections: [harm_path, cloud_at_time, cloud_extent, arrival_lines, roadblock_lines, dense_gas, planning_shape]
    files: {table: docs/evidence/hb167/scichem_vs_slab.tsv, stats: docs/evidence/hb167/paired_stats.json}
    cases: {csx-point-of-rocks-day: csx-day, csx-point-of-rocks-night: csx-night}
    # by day the two agree; at night they do not, and the measured cause and the untraced remainder are stated
    cases_rule: {csx-day: agree, csx-night: disagree}
    held_reach_line: "SLAB (section T7), held comparison {case}, {tier}: 60-minute reach SCICHEM {scichem:,.0f} m, SLAB {slab:,.0f} m{beyond} (SCICHEM over SLAB {ratio}; {file})"
    stats_line: "SLAB (section T7), paired centreline 60-minute concentrations at {pairs} distances: MG {mg:.2f}, VG {vg:.2f}, FAC2 {fac2:.2f}, r {r:.2f}, FB {fb:.2f}, NMSE {nmse:.2f} ({file})"
    cause_line: "SLAB (section T7), the cloud {at}: SLAB {slab}, SCICHEM {scichem} (SCICHEM over SLAB {ratio}); {speed}; {centre}"
    untraced_line: "The cloud's depth and speed account for a factor of 2.9 to 8.6 of the night disagreement; a factor of 1.2 to 1.9 is not traced (Issue c57f9281; DN-028 section 3)."
    # HB-172: HB-167's held comparison ran SCICHEM on the calculated layer, which a stable class no longer takes
    # (HBD-389). For a case HB-169 re-ran on the PGT layer, the row says so and gives that run, read from HB-169's files.
    stable_layer:
      cases: {csx-night: csx-night}
      files: {reach: docs/evidence/hb169/fix_before_after.tsv, trace: docs/evidence/hb169/night_trace.tsv}
      tier: AEGL-3
      trace_variant: fix
      distances_m: [100, 500, 1000, 5000]
      line: "The held comparison above ran SCICHEM on the calculated layer (CALC), which a stable class no longer takes (HBD-389; DN-028 ADDENDUM-03). On the PGT layer this brief draws, the same release puts the {tier} 60-minute reach at SCICHEM {after:,.0f} m (from {before:,.0f} m), SLAB {slab:,.0f} m, and SLAB over SCICHEM at {ratios} at {distances} ({files})."
    beyond: " (beyond SLAB's table)"
    # HB-173 (DN-028 ADDENDUM-04): this brief's own measure and both reaches per level, each lower bound written as one,
    # the agreement record's line (it replaces HB-163's per-level reach line, which wrote a cut reach as a plain one)
    measure_line: "SLAB (section T7) on this brief's release: {line} (section {ref})"
    # the records the measure's section reads (its run record field)
    records:
      lines: "SCICHEM's lines run, fixtures/evidence/scichem_lines/{sha}.json"
      slab: "SLAB's run, record {sha}"
      cloud: "SCICHEM's drawn record {sha}"
    none: "SLAB (section T7) drew no level this brief's cloud draws"
  # HB-184 (DN-028 ADDENDUM-10 decision 5): the Conditions of use sections' table and their line for this brief
  conditions:
    caption: "Conditions of use, from one table: each row's evidence file and line, and its source"
    columns: ["Condition", "What the evidence shows", "Evidence", "Source"]
    line: "line {n}"
    this_brief: "This brief: class {cls}; its levels are {engine}"
    engines: {planning: "the moving cloud's area together with SLAB's extent check (any stable hour)", scichem: "SCICHEM's"}
    agreement: "Two dense-gas engines run on this release: SCICHEM's conditions of use are section {scichem}, SLAB's section {slab}, and their measure on this release section {measure}"
  rule_words:
    numbers: "release {kind}, {q:.2f} kg/s; density {rho:.2f} kg/m3 against air {rho_a:.3f} kg/m3; characteristic dimension H {h:.3f} m; wind at 10 m {u10:.2f} m/s; roughness {z0:g} m; class {cls}; friction velocity {u:.3f} m/s"
    missing: "not held: {what}"
  cloud_words:
    steps: "{n} output steps, every 5 minutes, {first} to {last}"
    release: "the release lasts {m:g} minutes; the cloud is attached to the source while it lasts"
    source: "{tier} covers the source last at {hplus}"
    source_never: "{tier} never covers the source at an output step"
    left: "the cloud left the modelled domain at {hplus}"
    points: "{n} points measured at breathing height (1.5 m) in the held record"
    points_puff: "{n} points measured from the puff's field at the ground (0 m), the height its areas are drawn at, every 2 minutes"
    # HB-192 (DN-024 ADDENDUM-01): the frames the time control and Play show
    frames: "the time control and Play show {n} frames, every {every} minutes: each level's outline drawn from a {spacing} m mesh of the engine's mean on the receptor plane, simplified at {tol} m and drawn within {within} m of the outline before simplifying (DN-024 ADDENDUM-01)"
    frames_accuracy: "a point lookup on the mesh, against each measured point's own sensor (named places, suggested points, roadblocks) at the frame's time (1.5 m above ground, the mesh at the ground): median ratio {median}, worst {worst}, over {n} place-frames where the place's sensor reads AEGL-1 or above"
  # HB-192 (Part C item 8): the Benchmarks and requirement section's lines, from the graph's projection
  benchmark_words:
    row: "{id}: {statement} hazbrief's status: {status}."
    # HB-205 (Issue f35aa70b): a scored status carries on its own line the reason its row's note gives, the note's
    # sentence after "Status: {status}.": "below" alone reads as a run that scored worse where no run was made.
    scored: ["statistically significant at 95 percent, above", "statistically significant at 95 percent, below", "not statistically significant at 95 percent"]  # HB-212, HB-213 ADDENDUM-02: scripts/benchmark_state.py's states, the Census Bureau's words
    row_reason: "{id}: {statement} hazbrief's status: {status}: {reason}"  # HB-214: the reason is now the numbers and "see the benchmark table"
    note: "{id}: {note}"
    projection: "the benchmark requirement, BENCH-0 to BENCH-9, a projection of the graph: docs/evidence/hb192/benchmark_rows.md"
  none_stated: "none stated"
  as_in: "as in {ref}"
  fields:
    - {key: what, name: "What it is"}
    - {key: method, name: "Method and its source"}
    - {key: inputs, name: "Inputs for this brief and where each came from"}
    - {key: run_record, name: "Run record"}
    - {key: checked, name: "Checked against"}
    - {key: not_checked, name: "Not checked against"}
    - {key: limits, name: "Limits the method's own source states"}
    - {key: agreement, name: "Agreement between methods"}
    - {key: further, name: "Further checks, not run"}
  # the popup rows of a moved layer that are documentation, and the field each goes to (task item 2; the inventory's
  # classes, `docs/evidence/hb161/map_strings.tsv`)
  moved_rows:
    "Level of concern": inputs
    "Source assumed": inputs
    "Quantity from": inputs
    "Release rate": method
