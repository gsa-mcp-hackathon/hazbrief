  # HB-197 item 2; HB-212 and HB-213 (the states by statistical significance, scripts/benchmark_state.py).
  # HB-214 ADDENDUM-01 item 4 (the operator, 2026-11-20 21:49 EST: "If we were to produce anything that was for a
  # slide, it would have to be extremely condensed"): this slide does not carry the evidence table. It carries four
  # rows of it, hazbrief's two engines against the measurements and the engine a stable brief draws first (SCICHEM)
  # against HPAC and ALOHA, in four columns, and one line saying the full table is in the evidence; each cell is read
  # from the table's own record (docs/evidence/hb214/benchmark_table.md, written by scripts/benchmark_table.py). The
  # five-row cap leaves SLAB against the tools to the full table (every one of its six lines reads No). The notes
  # are the table's numbered notes, in its words.
  - id: benchmarks
    part: technical
    title: "Benchmarks: one field trial scored; others not yet"
    dense: true
    items:
      - table:
          header: [Compared, Ratio, 95 percent limits, "Statistically different?"]
          rows:
            - cells: ["SCICHEM against the measurements", "2.88", "1.58 to 5.27", "Yes, below"]
              source: docs/evidence/hb214/benchmark_table.md
              accent: true
            - cells: ["SLAB against the measurements", "1.43", "0.83 to 2.47", "No"]
              source: docs/evidence/hb214/benchmark_table.md
            - cells: ["SCICHEM against HPAC", "1.66", "0.87 to 3.16", "No"]
              source: docs/evidence/hb214/benchmark_table.md
            - cells: ["SCICHEM against ALOHA", "1.35", "0.62 to 2.94", "No"]
              source: docs/evidence/hb214/benchmark_table.md
      # HB-219: the three names spelled out or explained where the deck first prints them; the full table's path
      # moved to the notes (a body prints no file path)
      - quote: >-
          HPAC (Hazard Prediction and Assessment Capability) and ALOHA (Areal Locations of Hazardous Atmospheres)
          are tools responders rely on; SLAB is hazbrief's second dense-gas model.
        source: docs/evidence/hb219/plain_words.md
        restates: [docs/evidence/hb214/benchmark_table.md, README.md]
    notes:
      - label: The full table, every test with its definitions and notes, is in the evidence
        value: docs/evidence/hb214/benchmark_table.html
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          Ratio: against the measurements, the geometric mean of measured over predicted concentration (MG); against
          a tool, the run's MG divided by the tool's. 1 means no difference; above 1 means the run's concentrations
          are lower.
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          Statistically different?: Yes when the 95 percent limits leave out 1, with below or above for the run's
          concentrations; No when they include 1; Not yet tested where no run is held.
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          Jack Rabbit II Trial 7: one trial, five arcs at 0.2 to 5 km, all of one release, not five independent
          releases.
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          The limits are Hanna, Strimaitis and Chang (1993), equation 34, at the 95 percent confidence level; the
          words are the Census Bureau's.
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          Why HPAC and ALOHA, the operator: "the community tools that people have been relying on ... the gold
          standard for the community."
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          Two models can agree and both be wrong (Warner et al., page 40). The operator: "they can still be useful
          for making decisions."
        source: docs/evidence/hb214/benchmark_table.md
      - quote: >-
          BENCH-0's minimum, doing as well as each tool: not statistically significant at 95 percent against HPAC or
          ALOHA (one trial, five arcs).
        source: docs/evidence/hb214/benchmark_table.md
      - quote: no hazbrief run is held on Jack Rabbit II trials 1 or 6
        source: docs/evidence/hb192/benchmark_rows.md

