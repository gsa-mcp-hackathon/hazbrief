# The public mode's citation rules, as this tree needs them (HB-213). Each citation of the working record
# (task files, handoffs, design notes, the decision register, lab notes, the corpus graph) was replaced when
# this tree was built, by a shipped file that holds the fact or by the record's name; the working record is
# held privately. What remains: the paths a command makes when it runs (`runtime`) and the strings that read
# like paths but are no path of the repository (`not_paths`), which the check of the built tree leaves alone.
