    named_as: ["TIGERweb 2020 tabulation", "TIGERweb"]
    tag_as: ["TIGERweb Census 2020"]
    provenance_class: live_call
    horizon_s: 315576000
    service_stated:  # HB-94 (review L5-3, ArcGIS half deferred): a date the service stated, read once
      read_on: "2026-10-21"
