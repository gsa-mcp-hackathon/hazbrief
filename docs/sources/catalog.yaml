  - id: tigerweb:census2020
    name: "TIGERweb Census 2020 tabulation geography"
    api_catalog: tigerweb
    kind: api
    exchanges_api: tigerweb
    endpoints: ["https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Census2020/"]
