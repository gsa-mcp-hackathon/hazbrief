# docs/sources/catalog.yaml: the source catalog (DN-010 section 3.2, HB-39). THE ONE PLACE A HORIZON LIVES.
#
# One row per source the seven tools read. Seeded from HB-06's API access catalog (corpus/api_catalog.yaml,
# HB-06); `api_catalog` names the row each one comes from, and
# terms and rate limits are condensed from it (the full quotes stay there). A pack, a cached file and a computation
# are rows too, because a value read from them carries a label like any other (DN-010 D4).
#
# horizon_s: how long a value from this source holds before its label reads stale (DN-010 D4: stale when
#   now - as_of > horizon_s). null only for `computed`, a value derived from the request alone, which has no
#   source to age.
# horizon_reason:
#   stated   - the source's own statement of its cadence or freshness, named in `horizon_basis`. A source that
#              answers with Cache-Control max-age states its freshness lifetime (RFC 9111 section 4.2.1).
#   assumed  - no held document states one; `horizon_basis` says what the number was chosen from.
#   computed - no source; the value is a calculation (horizon_s null).
# provenance_class (DN-010 D3): recorded_pack (a shipped pack or a cached file read in every mode), live_call
#   (an upstream API call per request), derived_by_code (computed from the request).
# name: the source as it names itself (SB-SEN-06), for the label and the evidence appendix.
# endpoints: url prefixes; an upstream exchange (fixtures/exchanges) belongs to the one row whose prefix it
#   starts with (test_source_catalog.py (a test held privately) checks every exchange maps to exactly one row).
# tag_as: the phrases the tools' `basis` source tags use for it, when they differ from named_as (the label matches a tag
#   to the row whose phrase is most specific: a row whose matching phrase another row's contains is not matched).
# tools: the tools that read it. named_as: the phrases a tool's MCP description uses for it; the catalog test
#   checks each listed tool's "Data source" paragraph names the row, and that every source the paragraph names has
#   a row.
# edition_as_of (every `kind: pack` row; HB-94, review L5-4): the date the held edition prints, "YYYY" when it
#   prints only the year, else "YYYY-MM-DD". A pack value whose tag prints no date is labelled as of it, and its
#   horizon counts from it. It is the edition's date of issue (DCAT `dcterms:issued`), not the instant the pack was
#   built: a pack's `built_at` is build provenance and is printed nowhere as an as-of.
# file_as_of (every `kind: file` row; HB-94, review L5-2): {path, field}, the dotted field of a committed file that
#   holds the file's own as-of. A file value whose tag prints no date is labelled as of it. A file row never takes
#   the as-of of the tool call that read it (`hazbrief.evidence.labels.label_for` refuses).
# service_stated (optional; HB-94, review L5-3 ArcGIS half): {read_on, basis, values}. `values` are the fields that
#   hold a date the service stated in its own description, read once on `read_on` and typed into config. A label
#   whose as-of is one of those dates says so, with the read date, rather than a bare "as of"; the per-call read of
#   the service description that would make it live is deferred (L5-3, post-submission).
# verified_current (optional, `kind: pack` rows; HB-108): {record, checked_on, against, as_of}. The pack's edition was
#   checked against a later held text of the same source (`against`, at point in time `as_of`) on `checked_on`, by a
#   script whose record (`record`, a committed file) names every file it read with its sha256. A pack value whose tag
#   prints no date is then labelled "current, checked against <against> as of <as_of>", with the record cited, and its
#   horizon counts from `as_of`, the date the check shows the edition still the source's. The loader refuses a check
#   whose text is not newer than the edition, whose record names another build of the pack (`pack_sha256`), a text
#   other than `as_of`, or any row a fixture reads that differs between the edition and the text.

schema_version: 1
cited_in: hazbrief-mcp DN-010 s3.2
seeded_from: corpus/api_catalog.yaml (HB-06)

# Acronyms a "Data source" paragraph prints that are not sources (the catalog test's reverse check reads these).
docstring_not_sources:
  CENSUS_API_KEY: an environment variable the paragraph names as a requirement
  URL: the signup URL the no-key error carries
  CCN: the CMS Certification Number, the join key between two CMS files
  FRA: the agency NTAD credits with its updates; the source read is BTS NTAD
  USGS: the agency; each USGS source read has its own row (Structures, 3DHP)
  CMS: the agency; each CMS file read has its own row
  EMS: a facility type the Structures layers are listed by ("fire and EMS stations"), not a source
  ID: the ERG ID number (UN or NA number) a material is resolved by, not a source

# A tool whose paragraph inherits its components' sources ("Data sources: those tools' (...)"). A row it shares with a
# component is named in that component's paragraph; a row it alone reads must be named in its own.
composite_tools:
  build_ics_201: [assess_incident, protective_action_footprint, population_at_risk, facilities_in_footprint,
                  receiving_hospitals, material_response_guidance]

# Packs under packs/ that no tool reads, so no record names them (the catalog test checks every pack is a row or here).
packs_not_read:
  vocabulary: "packs/vocabulary.json, the pack-side term list (HB-03), is loaded and verified at startup with every pack
    (packs.default_packs), but no module reads its data (no `.vocabulary` access under src/hazbrief, HB-39). The
    vocabulary the prompt and resources serve is docs/stylebook/VOCABULARY.yaml, not a pack."
  # HB-207 (DN-029 ADDENDUM-00): read by a prompt, not by a tool, so it is no tool's source and moves no brief's view.
  suggested_actions: "packs/suggested_actions.json, the suggested actions to consider (HB-207), is loaded and verified
    at startup with every pack (packs.default_packs) and read only by the decision_support prompt, not by any tool;
    each entry's quotation names its own held source."
  # HB-66: the workbench puff's application packs (hazbrief.models.APP_PACK_MODELS). No tool reads them and the server
  # never loads them (DN-009 section 2); the brief's first-order puff (derive.puff, HB-67) reads them through
  # hazbrief.packs.load_app_pack, and its run record names each with its sha256 (the appendix's "Derived" table).
  materials_properties: "packs/materials_properties.json, the puff's material classes, thresholds and molecular weights
    (HB-66), and the source term's thermodynamics and each class's level of concern (HB-109), read by the brief's
    derive.puff, not by any tool."
  sigma_curves: "packs/sigma_curves.json, the Pasquill-Gifford curves from ISC3 Volume II (HB-66), read by the brief's
    first-order puff, not by any tool."
  release_scenarios: "packs/release_scenarios.json, EPA RMP's two release envelopes per container (HB-66), read by the
    brief's derive.puff, not by any tool."
  # HB-120: the fourth application pack. The brief's modelled channels name it with its sha256 in their run records.
  release_routing: "packs/release_routing.json, every ERG guide routed to a release model or to no dispersion model
    (HB-120), read by the brief's derive.puff and derive.dense_gas through hazbrief.brief.routing, not by any tool."
  # HB-155: the fifth application pack. The brief's siting layer names its rules on each suggested point.
  siting_rules: "packs/siting_rules.json, the rules that suggest the command post, triage and staging, each with its
    held quote or operator record (HB-155, DN-023), read by the brief's hazbrief.brief.siting, not by any tool."

sources:

  # ── live APIs ─────────────────────────────────────────────────────────────────────────────────────────────
  - id: nws:points
    name: "National Weather Service, api.weather.gov points"
    api_catalog: nws
    kind: api
    exchanges_api: nws
    endpoints: ["https://api.weather.gov/points/"]
    tools: [protective_action_footprint, build_ics_201]
    readers: [hazbrief.brief]
    named_as: ["National Weather Service", "NWS"]
    tag_as: ["NWS api.weather.gov points"]
    provenance_class: live_call
    horizon_s: 86400
    horizon_reason: stated
    horizon_basis: "Cache-Control: public, max-age=86400 on every recorded /points response (fixtures/exchanges/nws)"
    terms: "Public domain unless noted; no implied endorsement; logos not used (nws-disclaimer)."
    rate_limit: "Not public; a limited request may be retried after about 5 s (nws-api-faq). User-Agent with a contact required."

  - id: nws:stations
    name: "National Weather Service observation stations near a gridpoint"
    api_catalog: nws
    kind: api
    exchanges_api: nws
    endpoints: ["https://api.weather.gov/gridpoints/"]
    # The station list is `gridpoints/{cell}/stations`, under the forecast's prefix: this row is the more specific
    # match (evidence/catalog.py `_specificity`).
    path_suffix: /stations
    tools: []
    readers: [hazbrief.brief]
    named_as: []
    provenance_class: live_call
    horizon_s: 86400
    horizon_reason: stated
    horizon_basis: "Cache-Control s-maxage=86400 on every recorded gridpoints/{cell}/stations response (HB-60; RFC 9111 s5.2.2.10: the shared-cache lifetime the origin states)"
    terms: "Public domain unless noted; no implied endorsement (nws-disclaimer)."
    rate_limit: "Not public; a limited request may be retried after about 5 s (nws-api-faq)."

  - id: nws:observations
    name: "National Weather Service station observations"
    api_catalog: nws
    kind: api
    exchanges_api: nws
    endpoints: ["https://api.weather.gov/stations/"]
    tools: []
    readers: [hazbrief.brief]
    named_as: []
    provenance_class: live_call
    horizon_s: 3600
    horizon_reason: assumed
    horizon_basis: "A METAR 'shall be transmitted at fixed intervals' (fmh1-2019 section 2.6.4, page 2-4), each station's schedule; the recorded observations/latest answers carry max-age 106 and s-maxage 300, which are cache times, not the observation's cadence. Taken as an hour, the routine report interval (HB-60)."
    terms: "Public domain unless noted; no implied endorsement (nws-disclaimer)."
    rate_limit: "Not public; a limited request may be retried after about 5 s (nws-api-faq)."
    # HB-143: this row is the dataset `weather.source: observed` reads (orchestrator.yaml weather.observed.dataset), the
    # manifest row the observed source needs before it stops refusing (HB-139). Its corpus/sources.yaml twin
    # (nws-api-observations) is drafted in docs/evidence/hb143/deferred_corpus_rows.yaml until a corpus ingest lands it.
    observed_dataset:
      url: "https://api.weather.gov/stations/{stationId}/observations/latest"
      station_list: "the observationStations url of https://api.weather.gov/points/{lat},{lon} (/gridpoints/{wfo}/{x},{y}/stations, 'a list of observation stations usable for a given 2.5km grid area', nws-api-openapi)"
      licence: "A US Government work (17 U.S.C. 105): public domain unless noted; no implied endorsement (nws-disclaimer)"
      update_cadence: "each station's own schedule: a METAR at fixed intervals (fmh1-2019 section 2.6.4), routinely hourly, with specials between"
      held: "live: read per brief at its hour and recorded with the brief's exchanges (DN-011 D7), never a held document; a replayed brief reads its own records"

  - id: nws:gridpoints
    name: "National Weather Service gridpoint forecast"
    api_catalog: nws
    kind: api
    exchanges_api: nws
    endpoints: ["https://api.weather.gov/gridpoints/"]
    tools: [protective_action_footprint, build_ics_201]
    readers: [hazbrief.brief]
    named_as: ["National Weather Service", "NWS"]
    tag_as: ["NWS api.weather.gov gridpoint forecast"]
    provenance_class: live_call
    horizon_s: 3600
    horizon_reason: stated
    horizon_basis: "Cache-Control s-maxage=3600 on every recorded /gridpoints forecast response (max-age is 3600 too, except where the CDN in front of NWS answers with what remains: 3564 on BGM/79,27, HB-60; RFC 9111 s5.2.2.10); NWS documents no cadence (HB-06 premise 5)"
    terms: "Public domain unless noted; no implied endorsement (nws-disclaimer)."
    rate_limit: "Not public; a limited request may be retried after about 5 s (nws-api-faq)."

  - id: census:dhc2020
    name: "2020 Census DHC"
