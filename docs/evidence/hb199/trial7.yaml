  local_utc_offset_h: -6                   # MDT = UTC - 6 (m17 Table 2 p. 6)
  quantity_kg: 9100.0                      # tank inventory, fox Table 2 p. 23
  storage_temperature_c: 15.9              # liquid temperature, fox Table 2 p. 23 (saturated, note 1)
  hole_diameter_m: 0.152                   # fox Table 2 p. 23 ("6.0 in = 0.152 m")
  mass_released_kg: 8625.0                 # m17 Table 4 p. 14 (printed beside the route's release, not an input)
