# "fox" = fox-2021-jack-rabbit-ii-overview-accepted-manuscript (PDF pages); "m17" =
# mazzola-2020-jack-rabbit-ii-17-dense-gas-models-manuscript (PDF page = printed page); "simpson" =
# simpson-2020-hpac-jack-rabbit-ii-accepted-manuscript (PDF pages).

trial: JR2-7
material_un: "1017"            # chlorine; m17 p. 3 line 84
