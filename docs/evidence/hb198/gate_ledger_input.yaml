# HB-197 and HB-201, one entry per run, in the order each task ran them. tools/gate_ledger.py reads this file and the
# files it names and writes gate_ledger.tsv; counts and seconds come from the tail files, never typed here.
#
# Per run:
#   tail:      a committed file holding the run's own tail (its pytest summary lines); the tool reads every count and
#              "in N s" from it. `step` narrows a file holding several runs' steps (HB-194's three_gates.tsv rows).
#   result:    the RESULT line that states the run, when no tail of the run is held; its numbers are quoted as
#              the RESULT prints them and the tool parses them from this quotation.
#   failures:  each failing test (or lint stage) with its class. A class is HB-194's table's word for that kind
#              (docs/evidence/hb194/failures.tsv: "bound missed under load", or a real failure: "a defect"), or one of
#              the classes ADDENDUM-04 3j and ADDENDUM-05 name. `class_source` cites where the class was read.
#   commit:    as the RESULT or the tail names it; "not stated" when neither does.
#
# The tool decides "after HB-194 landed" from the event log: a run is after when its task's dispatch was launched
# after HB-194's dispatch_finished (ccf4a4c1, outcome merged, 2026-11-17T16:01:58Z). HB-191 ran no full gate (its
# RESULT, "Gate"); it has no row. HB-189's first session's gates are not stated in its RESULT; only the second
# session's four are rows.

