    url: https://raw.githubusercontent.com/data-liberation-project/epa-rmp-spreadsheets/91f274d189d4e601e2f03653f293c289f2a470cd/data/output/facilities.csv
    format: csv
    structured_alternative: this is the structured form
    plan: deferred_bulk_data
