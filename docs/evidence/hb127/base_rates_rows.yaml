  doc_id: epa-rmp-sccap-final-rule-2024-prepub
  page: '21'
  quote: Offsite Total $211.66 $42.33 $0.43
  calc:
    expr: 100 * off / tot
    inputs:
      'off': 42.33
      tot: 540.23
    decimals: 1
  note: 'Derived: offsite $42.33 million / total $540.23 million per year x 100 (Table 3). A share of damages, not of
    accidents.'
