- measure: RMP facility accident damages, monetized, EPA's figure
  value: '540.23'
  unit: million dollars per year (2022 dollars)
  period: 2016-2020 (annual average)
  scope: RMP-covered facilities (40 CFR part 68), as reported to EPA's RMP database
  doc_id: epa-rmp-sccap-final-rule-2024-prepub
  page: '21'
  quote: In total, EPA estimated monetized damages from RMP facility accidents of $540.23 million per year
  note: 'The final rule''s Table 3, Summary of Quantified Damages [Millions, 2022 dollars]: five-year total $2,701.14
    million. The rule says these omit responder costs, property-value losses, unmonetized evacuation and sheltering costs
    and health risks (PDF p.35). The RIA itself (epa-rmp-sccap-ria-2024, Exhibit ES-3) is refused by regulations.gov:
    rung 2.'
- measure: RMP facility accident damages, offsite part
  value: '42.33'
  unit: million dollars per year (2022 dollars)
  period: 2016-2020 (annual average)
  scope: RMP-covered facilities (40 CFR part 68), as reported to EPA's RMP database
  doc_id: epa-rmp-sccap-final-rule-2024-prepub
  page: '22'
  quote: EPA estimated total, average annual offsite damages of $42.33 million
  note: 'Onsite: $497.90 million per year (PDF p.21-22). Offsite property damage $35.71 million, evacuations $3.80 million,
    sheltering in place $2.52 million.'
