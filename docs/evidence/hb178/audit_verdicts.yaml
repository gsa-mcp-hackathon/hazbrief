  # HB-184 (DN-028 ADDENDUM-10 decision 5): each engine's conditions of use name the field trials each engine was
  # compared with; the table is per engine, so every dense brief's TEVV page prints the same rows
  - id: A23
    file: src/hazbrief/brief/conditions.yaml
    # HB-196 (HB-185's wording for T58's daytime rows): the rows name the same daytime trials by name
    match: ["Desert Tortoise 4, Thorney Island 45 and 47", "Desert Tortoise 1 to 3 and Goldfish 1 to 3", "Burro 8 added", "at Desert Tortoise 4, 800 m", "Jack Rabbit II (three light-wind", "find: [\"Jack Rabbit\"]", "Desert Tortoise 4.24 to 1.78, Goldfish 2.24 to 2.12", "On Desert Tortoise the computed layer was convective", "find: [\"Desert Tortoise (ammonia)"]
    says: "the conditions of use name the held field trials each dense engine was compared with (Volume II; Jack Rabbit II)"
    kind: applied
    applied_to: "every dense brief's TEVV sections T58 and T59 (13 dense briefs)"
    keyed: "no, by design: a condition of use is the engine's, not the release's, so the trials are named whatever the brief's material"
    held_for_others: "the trials are the held stable and daytime dense trials hazbrief's two-phase and gas paths take; no held trial is of the other materials' releases"
    now: "named as the engine's comparisons, each with its evidence file and line; no row names the brief's own material"
  # HB-192 (Part C item 8): the Benchmarks and requirement section names the field trials the accepted tools' published
  # scores are on; every dense brief's TEVV page prints the same section
  # HB-202 (item 6): HB-199 reworded the line to state hazbrief's status on Trial 7 (below, its route names no engine)
  # and left this verdict's match on the words it replaced; the match and the status follow HB-199's wording
  - id: A24
    file: src/hazbrief/brief/orchestrator.yaml
    match: ["No hazbrief run on Jack Rabbit II trials 1 or 6 is held"]
    says: "the benchmark section's statement of hazbrief's status on the Jack Rabbit II trials the accepted tools' published scores are on: below on Trial 7, where its route's SCICHEM run is below the tools and its SLAB run above them (HB-206); no run held on trials 1 or 6"
    kind: applied
    applied_to: "every dense brief's TEVV section T60 (13 dense briefs)"
    keyed: "no, by design: the benchmark is the published trials' (chlorine), named whatever the brief's material"
    held_for_others: "no held benchmark publishes a score for the other materials' releases"
    now: "named as the benchmark's trials, beside the published values, with hazbrief's status: below on Trial 7, the worse of its SCICHEM and SLAB runs by the one-minute rule (HB-206; before it no engine, HB-199), not yet evaluated on the others; the BENCH-8 and BENCH-9 lines say on the same line why, from the row's note (HB-205)"
  # HB-207 (Part B items 3 to 7): the index candidates and the server's lookup name materials only as examples of a
  # typed name the yellow index does not print; nothing is selected by them
  - id: A25
    file: src/hazbrief/index_candidates.py
    match: ["A typed name the index does not print (\"ammonia\", \"liquid nitrogen\", \"clorine\") is", "so \"clorine\" reaches \"chlorine\"", "shortlist the form's model chooses from must hold every ammonia solution", "\"clorine\" to \"chlorine\" is 0.93, \"ammonia\" to \"ammonium\" 0.80"]
    says: "the index candidates' docstring and constants: examples of typed names (ammonia, liquid nitrogen, a misspelt chlorine) and the measured spelling ratios behind the cutoff"
    kind: example
    applied_to: "no brief: commentary on a lookup over every row of the ERG yellow index"
    keyed: "no: the candidates are computed from the typed words over the whole index; no material is named in the code's logic"
    held_for_others: "not applicable: the yellow index is held for every ID number"
    now: "examples only (HB-207); the entry form's test lines and the server's lookup test exercise them"
  - id: A26
    file: src/hazbrief/tools/assess_incident.py
    match: ["A material name the yellow index does not print (\"ammonia\", \"liquid nitrogen\") is not"]
    says: "the assess_incident module's docstring: examples of a name the index does not print, for which the error now carries index_candidates"
    kind: example
    applied_to: "no brief: a module docstring (the tool description is unchanged while the surface is frozen)"
    keyed: "no"
    held_for_others: "not applicable"
    now: "an example only (HB-207 item 7)"
  # HB-207 (Part C item 8): the entry form's shipment-profile cells name the example material each held table prints
  - id: A27
    file: src/hazbrief/brief/orchestrator.yaml
    match: ["example: \"chlorine trifluoride (UN 1749)\""]
    says: "the ERG 2024 methodology Table 2.3's footnote: its shipment profile's data are for chlorine trifluoride (UN 1749); the form's proposed quantity says the profile is an example"
    kind: applied
    applied_to: "every form-built brief whose material is a gas and whose container is a rail tank car or a highway tank truck (the proposed quantity's source line)"
    keyed: "no: the profile cells are by container and storage state, never by material; the footnote is quoted so the reader sees the example the methodology prints"
    held_for_others: "the methodology names chemical-specific profiles for chlorine, ammonia and others (PDF p. 20) but does not print them; only the two example tables are held"
    now: "stated with every proposed quantity, beside 'proposed by the entry form, not this load's papers'"
