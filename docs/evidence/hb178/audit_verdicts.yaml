    keyed: "n/a"
    held_for_others: "n/a"
    now: "unchanged"
  - id: A18
    file: src/hazbrief/brief/dense_gas.py
    match: ["PR4's chlorine jet", "no reference table for chlorine's liquid properties is held"]
    says: "code comments and a docstring example"
    kind: comment
    applied_to: "none (the sentence is built from the material's own name and tiers)"
    keyed: "n/a"
    held_for_others: "n/a"
    now: "unchanged"
  - id: A19
