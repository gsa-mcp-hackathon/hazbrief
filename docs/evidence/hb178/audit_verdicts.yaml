    match: ["the SLAB guide's chlorine test input"]
    says: "a comment on HB-124's liquid properties"
    kind: comment
    applied_to: "none"
    keyed: "n/a"
    held_for_others: "n/a"
    now: "unchanged"
  - id: A15
    file: src/hazbrief/brief/orchestrator.yaml
    match: ["HB-131R measured the chlorine", "the pack's chlorine TBP", "PR4, the guide's chlorine case", "test cases of methane and ammonia", "Its chlorine case (INPR4)", "Burro behind the cryogenic pool", "Goldfish behind the pressurised jets", "for chlorine the held", "the night chlorine extent is a lower bound"]
    says: "configuration comments on why a value is what it is"
    kind: comment
    applied_to: "none"
    keyed: "n/a"
    held_for_others: "n/a"
    now: "unchanged"
  - id: A16
    file: src/hazbrief/brief/scichem.yaml
    match: ["chlorine run took", "Desert Tortoise 4 it moved", "(Desert Tortoise, Goldfish) the same way"]
