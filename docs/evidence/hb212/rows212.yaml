# HB-212 Part B items 5 to 9: BENCH-0's, BENCH-5's, BENCH-8's and BENCH-9's notes, generated by
# the HB-212 evidence (held privately) from scripts/benchmark_state.py's states of
# docs/evidence/hb209/trial7_intervals.tsv; do not edit. Applied by `notes212.py --apply`.
rows:
  BENCH-0:
    note: 'Minimum: equivalence. Objective: better. Status: not statistically significant at 95 percent against HPAC or
      ALOHA (one trial, five arcs). Against BENCH-8 and BENCH-9, the like-for-like rows on Jack Rabbit II Trial 7, where
      the one-minute rule gives hazbrief''s route a prediction (Issue 1e15434e), on the five arcs at 0.2 to 5 km. Against
      the measurements first: hazbrief''s SCICHEM run is below the measurements, a difference that is statistically significant
      at the 95 percent confidence level (MG 2.88, 95 percent limits 1.58 to 5.27, which exclude 1, on 5 arcs), 1 of 5
      arcs within a factor of two of the measured maximum; the difference between hazbrief''s SLAB run and the measurements
      is not statistically significant at the 95 percent confidence level (MG 1.43, 95 percent limits 0.83 to 2.47, which
      include 1, on 5 arcs), 4 of 5 arcs within a factor of two of the measured maximum; and for the tools'' published
      runs, the difference between HPAC''s complex-source run and the measurements is not statistically significant at
      the 95 percent confidence level (MG 1.73, 95 percent limits 0.92 to 3.26, which include 1, on 5 arcs), 3 of 5 arcs
      within a factor of two of the measured maximum; the difference between HPAC''s simple-source run and the measurements
      is not statistically significant at the 95 percent confidence level (MG 1.63, 95 percent limits 0.92 to 2.86, which
      include 1, on 5 arcs), 4 of 5 arcs within a factor of two of the measured maximum; the difference between ALOHA''s
      run and the measurements is not statistically significant at the 95 percent confidence level (MG 2.13, 95 percent
      limits 0.65 to 6.98, which include 1, on 5 arcs), 3 of 5 arcs within a factor of two of the measured maximum. Against
      the tools second: no hazbrief run''s difference from any tool''s is statistically significant at the 95 percent
      confidence level (the limits of all nine ratios include 1); the layer a stable brief draws first is SCICHEM''s:
      the difference between hazbrief''s SCICHEM run and HPAC''s complex-source run is not statistically significant at
      the 95 percent confidence level (MG ratio 1.66, 95 percent limits 0.87 to 3.16, which include 1, on 5 arcs); the
      difference between hazbrief''s SCICHEM run and HPAC''s simple-source run is not statistically significant at the
      95 percent confidence level (MG ratio 1.77, 95 percent limits 0.91 to 3.47, which include 1, on 5 arcs); the difference
      between hazbrief''s SCICHEM run and ALOHA''s run is not statistically significant at the 95 percent confidence level
      (MG ratio 1.35, 95 percent limits 0.62 to 2.94, which include 1, on 5 arcs). One trial, five arcs, and the five
      arcs are of one release, not five independent releases. Why these tools, in the operator''s words of 2026-11-20:
      HPAC and ALOHA are not just the standards but the community tools that responders have relied on, the gold standard
      for the community; hazbrief is held to them as baselines in its test and evaluation, and landing within their range
      is the check that the system built here is not producing confabulations or other wrong output. Two models can agree
      with one another and both be wrong about the release: "it is quite possible that two models agree perfectly with
      one another, yet ... disagree with real-world observations" (Warner et al., the held HPAC and NARAC comparison,
      hb188-osti-15013318-hpac-narac p. 40). The operator (2026-11-20), his statement and not a held source''s: models
      chasing the wind can both be wrong about reality and still be useful for the timely decisions of complex, fast-moving
      and often ambiguous situations. The state is the held difference test''s (Hanna, Strimaitis and Chang 1993, equation
      34, report p. 118; docs/evidence/hb209/trial7_intervals.tsv; scripts/benchmark_state.py, HB-212), in the Census
      Bureau''s words (ACS General Handbook 2020, block b952): statistically significant at the 95 percent confidence
      level, with its direction, only where the 95 percent limits exclude 1, and not statistically significant where they
      include it; MG is observed over predicted, so above 1 is under-prediction. Until HB-212 the word here was "below",
      taken by HB-199 section 5 from a count of the acceptance criteria each run passes, a method that set aside the field''s
      difference test. Against BENCH-1 to BENCH-7: not yet evaluated. Two HPAC score sets are published on Jack Rabbit
      II and they disagree: the 17-model comparison gives MG 1.04 (complex source, arc maxima at 0.2 to 5 km, BENCH-1),
      Simpson et al. 2020 give MG 1.45 to 4.26 on measured weather with a stated stability (simple source, sensors paired
      in space at 0.5 to 11 km, BENCH-2); both define MG as observed over predicted, so above 1 is under-prediction. Neither
      is averaged with the other.'
  BENCH-5:
    note: 'Status: not yet evaluated. A brief is used for when the cloud arrives, so the arrival is a statistic of the
      requirement. On Jack Rabbit II Trial 7 (HB-206), each arc maximum''s time of arrival relative to the observed at
      0.5, 1, 2, 5 and 11 km is 1.73, 1.02, 1.12, 1.01 and 1.05 for hazbrief''s SCICHEM run and 1.91, 1.16, 1.15, 1.01
      and 0.99 for its SLAB run, where HPAC on measured weather with a stated stability gives 1.74, 1.06, 1.07, 1.00 and
      0.99 (simpson-2020-hpac-jack-rabbit-ii-accepted-manuscript Table 7 p. 16): SCICHEM''s ratio is within 0.07 of HPAC''s
      at every arc, and SLAB''s within 0.18. The row stays not yet evaluated: its published range is over trials 1, 6
      and 7 together, no hazbrief run is held on trials 1 or 6, and no held source states an acceptance criterion for
      the arrival. Shown by: docs/evidence/hb206/trial7_scores.tsv (the arrival rows); and docs/evidence/hb176/summary.tsv
      and docs/evidence/hb177/hb176_restated.tsv, which compare hazbrief''s runs with other trials (Thorney Island, Desert
      Tortoise and others at 212 to 800 m) by its own pairing. The arrival ratios are descriptive: no held interval is
      on the arrival, so no state, statistically significant or not, is drawn from them; one trial, five arcs, and the
      five arcs are of one release, not five independent releases. Two models can agree with one another and both be wrong
      about the release: "it is quite possible that two models agree perfectly with one another, yet ... disagree with
      real-world observations" (Warner et al., the held HPAC and NARAC comparison, hb188-osti-15013318-hpac-narac p. 40).
      The operator (2026-11-20), his statement and not a held source''s: models chasing the wind can both be wrong about
      reality and still be useful for the timely decisions of complex, fast-moving and often ambiguous situations.'
  BENCH-8:
    note: 'Status: not statistically significant at 95 percent. on Jack Rabbit II Trial 7''s five arcs at 0.2 to 5 km,
      where the one-minute rule gives the route a prediction (Issue 1e15434e), against the measurements first, hazbrief''s
      SCICHEM run is below the measurements, a difference that is statistically significant at the 95 percent confidence
      level (MG 2.88, 95 percent limits 1.58 to 5.27, which exclude 1, on 5 arcs), 1 of 5 arcs within a factor of two
      of the measured maximum, and the difference between HPAC''s complex-source run and the measurements is not statistically
      significant at the 95 percent confidence level (MG 1.73, 95 percent limits 0.92 to 3.26, which include 1, on 5 arcs),
      3 of 5 arcs within a factor of two of the measured maximum; against this row''s tool second, the difference between
      hazbrief''s SCICHEM run and HPAC''s complex-source run is not statistically significant at the 95 percent confidence
      level (MG ratio 1.66, 95 percent limits 0.87 to 3.16, which include 1, on 5 arcs); the row takes SCICHEM''s run,
      the layer a stable brief draws first; one trial, five arcs, and the five arcs are of one release, not five independent
      releases; two models can agree and both be wrong about the release (the held HPAC and NARAC comparison, hb188-osti-15013318-hpac-narac,
      page 40), and a model wrong in detail can still support a timely decision (the operator, 2026-11-20). By the same
      test, against the measurements, the difference between hazbrief''s SLAB run and the measurements is not statistically
      significant at the 95 percent confidence level (MG 1.43, 95 percent limits 0.83 to 2.47, which include 1, on 5 arcs),
      4 of 5 arcs within a factor of two of the measured maximum; against HPAC, the difference between hazbrief''s SLAB
      run and HPAC''s complex-source run is not statistically significant at the 95 percent confidence level (MG ratio
      0.83, 95 percent limits 0.44 to 1.56, which include 1, on 5 arcs). SLAB at 80 percent relative humidity gives the
      same states (the difference between hazbrief''s SLAB run at 80 percent relative humidity and HPAC''s complex-source
      run is not statistically significant at the 95 percent confidence level (MG ratio 0.82, 95 percent limits 0.42 to
      1.57, which include 1, on 5 arcs)). HPAC''s other published run of the trial, its simple source (Simpson Table 3,
      PDF p. 8): against the measurements, the difference between HPAC''s simple-source run and the measurements is not
      statistically significant at the 95 percent confidence level (MG 1.63, 95 percent limits 0.92 to 2.86, which include
      1, on 5 arcs), 4 of 5 arcs within a factor of two of the measured maximum; against it, the difference between hazbrief''s
      SCICHEM run and HPAC''s simple-source run is not statistically significant at the 95 percent confidence level (MG
      ratio 1.77, 95 percent limits 0.91 to 3.47, which include 1, on 5 arcs). Two models can agree with one another and
      both be wrong about the release: "it is quite possible that two models agree perfectly with one another, yet ...
      disagree with real-world observations" (Warner et al., the held HPAC and NARAC comparison, hb188-osti-15013318-hpac-narac
      p. 40). The operator (2026-11-20), his statement and not a held source''s: models chasing the wind can both be wrong
      about reality and still be useful for the timely decisions of complex, fast-moving and often ambiguous situations.
      The state is the held difference test''s (Hanna, Strimaitis and Chang 1993, equation 34, report p. 118; docs/evidence/hb209/trial7_intervals.tsv;
      scripts/benchmark_state.py, HB-212), in the Census Bureau''s words (ACS General Handbook 2020, block b952): statistically
      significant at the 95 percent confidence level, with its direction, only where the 95 percent limits exclude 1,
      and not statistically significant where they include it; MG is observed over predicted, so above 1 is under-prediction.
      Until HB-212 the row''s word was "below", taken by HB-199 section 5 from a count of the acceptance criteria each
      run passes, a method that set aside the field''s difference test. Before the one-minute rule the route named no
      engine on Trial 7 (HB-199, 2026-11-17). The rule (decision HBD-464, HB-206, 2026-11-18): a release the source term
      floors to one minute is classed by the continuous form of the critical Richardson number at its one-minute rate,
      its mass unchanged; both forms class Trial 7 dense (docs/evidence/hb206/protocol.md section 2). Shown by: docs/evidence/hb206/trial7_scores.tsv,
      the HB-206 evidence (held privately), docs/evidence/hb209/trial7_intervals.tsv, docs/evidence/hb212/states.tsv.'
