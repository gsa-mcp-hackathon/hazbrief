# HB-01 source list: every document DN-001 section 5 depends on, as located. HAND-AUTHORED.
#
# This file holds what a person decided about each source (what it is, where it lives, what
# structured form exists, why it is in the knowledge base). Everything a machine observed (the
# acquisition outcome, sha256, bytes, the license marking actually seen, page and character
# counts) lives in corpus/fetch_log.jsonl and is joined in by build_corpus_manifest.py (a build tool held privately),
# which writes corpus/manifest.yaml. Edit this file; regenerate the manifest; never edit the
# manifest by hand.
#
# plan:      fetch               scripts/fetch_allowlisted.py attempts it (the outcome is logged)
#            api_endpoint        a live API the server calls at run time; its documentation is
#                                a separate `fetch` entry; nothing to download
#            deferred_bulk_data  a dataset (tract CSVs, shapefiles, zips) the pack build pulls
#                                (HB-03/HB-04); a dataset is not a document and is not fetched
#            not_public          no public source exists; the entry records the finding
#            operator_download   the operator saves it from a browser (DN-002 section 3);
#                                scripts/register_inbox.py records it
#            script_rendered     the URL is a JavaScript application: the server's response
#                                is not the document (HB-06, data.cms.gov/api-docs)
#            authored            written in this repository (`path:`), admitted like any
#                                held document (HB-06's API catalog and probe log)
#            bot_challenge       the host answers this client with a CAPTCHA or bot-challenge
#                                page instead of the document; not requested by the fetcher
#                                (HB-06, pubchem.ncbi.nlm.nih.gov/docs/programmatic-access)
#            third_party_host    a copy on a third-party upload host (no provenance, terms
#                                forbid scraping); never fetched, its host never allowlisted,
#                                so it joins as blocked_host, metadata only (HB-82, Scribd)
# route:     extract             prose for the Squiddy knowledge-base burn
#            deterministic       tables and structured data; parsed by code into packs (HB-03),
#                                never by a model (DN-001 invariant 2)
#            reference           evidence for a finding or an index page; neither extracted nor
#                                parsed
# priority:  HB-01's queue order: 1 ERG tables and guide pages; 2 CAMEO records; 3 49 CFR rows;
#            4 ICS form instructions; 5 API documentation; 6 SVI, CRE, LODES and other reference
#            documentation; 7 stylebook prose (AR 25-50, CDC Clear Communication, NIMS, NWS/WEA)
# status:    HB-147, the operator's acquisition queue (docs/evidence/acquisition/queue.html, rendered
#            by scripts/acquisition_queue.py on every gate). Absent on a row the logs alone account for.
#            awaiting_operator  a hand fetch into corpus/inbox/ is wanted (DN-002 ADDENDUM-00 rung 2;
#                               rung 3 where refused_by names a library, a purchase or a request)
#            held               scripts/register_inbox.py registered it; the one value a script
#                               writes in this file
#            closed             HB-150: the operator will not fetch it; closed by hand under one of the
#                               decisions of 2026-11-09 (Issue 7a4dd74a; scripts/acquisition_queue.yaml
#                               closed_under) with `closed_under` and `closed_note` (what replaces it)
# refused_by:  with status: why rung 1 did not take it (the fetcher's outcome and reason, as logged)
# requested_by: with status: the task (HB-NNN) that asked for it; the page sorts by its date
# save_format: with status, where the held file's format is not `format`: a web page (html) is
#            saved as a Markdown clipping (md), a book (n/a) as a PDF. register_inbox.py identifies
#            and stores the file by it. None of status, refused_by, requested_by or save_format
#            reaches the corpus graph (squiddy_intake.py (a build tool held privately) SOURCE_FIELDS).
# Discovery for every URL below: HB-01 s2.

sources:

# ── 1. Hazard reference: ERG ────────────────────────────────────────────────────────────────
- doc_id: erg2024-en-pdf
  priority: 1
  title: Emergency Response Guidebook 2024 (English, web PDF)
  publisher: US DOT PHMSA
  edition: "2024"
  url: https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf
  format: pdf
  # identify: the title-page text that identifies an operator download of this document
  # (scripts/register_inbox.py; DN-002 section 3). A regex, case-insensitive, over the
  # whitespace-normalized first pages; a filename is never the identification.
  identify:
    text: 'EMERGENCY RESPONSE GUIDEBOOK 2024 A guidebook intended for use by first responders'
  structured_alternative: >-
    No public structured download. PHMSA offers the production files (.docx, .xlsx, .indd) to
    commercial suppliers by email request to ERGComments@dot.gov. Per-UN structured renderings
    of ERG 2024 exist on NOAA CAMEO Chemicals (Table 1 and Table 3 rows, guide number, names:
    the cameo-unna-* entries) and PubChem (erg2024-pubchem-index).
  plan: fetch
  route: extract
  locators: >-
    Recorded by HB-01b from the operator-downloaded PDF (sha256 180eb92e...6e30, 392 pages). "p."
    is the PDF page (1-based); the printed page number is p. minus 2. Yellow index: UN1005 and
    UN1017 rows on p. 31. Orange guides (two pages each): 115 pp. 162-163, 120 pp. 172-173,
    124 pp. 180-181, 125 pp. 182-183, 128 pp. 188-189. Table 1 (green, initial isolation and
    protective action distances): introduction p. 282, background p. 288, how to use pp. 290-291,
    the table pp. 292-335 (printed 290-333), UN1005 and UN1017 rows on p. 292. Table 2
    (water-reactive): pp. 336-341. Table 3 (large spills, six TIH gases by container and wind):
    how to use p. 342, the table pp. 343-345 (printed 341-343), anhydrous ammonia and chlorine
    on p. 343. Reuse: back matter p. 382 "REPRODUCTION AND RESALE": reproducible without further
    permission; the participating governments' names and seals only on an unmodified whole copy.
  # HB-01b: the ERG's own back matter (p. 382, "REPRODUCTION AND RESALE") permits reproduction
  # without further permission, under conditions; it is a joint US/Canada/Mexico publication, not
  # a 17 U.S.C. 105 work.
  reuse: reproduction-permitted
  kb_reason: The governing source for every distance the server reports (DN-001 invariant 1).

