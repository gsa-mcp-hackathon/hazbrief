  route: reference
  kb_reason: Edition currency and the data-file request route.

- doc_id: erg2024-pubchem-index
  priority: 1
  title: Emergency Response Guidebook 2024 (PubChem HTML rendering, UN index and guides)
  publisher: NIH NLM PubChem
  edition: "2024"
  url: https://pubchem.ncbi.nlm.nih.gov/erg/
  format: html
  structured_alternative: HTML table of the UN index with guide anchors (guide_2024.html#NNN)
  plan: fetch
  route: deterministic
  locators: >-
    The page is the whole ERG 2024 yellow index as one HTML table (HB-01b discovery read,
    2026-10-20: about 2,770 rows). One row per UN number and material name; the cells carry a
    `dl` attribute naming the column: `td[dl="UN/DOT Number"]` (the first row of a UN number
    carries `id="<UN>"`), `td[dl="Guide Number"]` (a link to guide_2024.html#<guide>),
    `td[dl="Material Name"]`, `td[dl="Structure"]` (PubChem CID) and `td[dl="Note"]`. Rows with
    `class="erggreen"` are the materials highlighted for Table 1; their Note reads "Toxic/poison
    by inhalation (TIH/PIH)" or the water-reactive equivalent.
  notes: >-
    Allowlisted by DN-002 section 2 (HB-01 addendum A). robots.txt `User-agent: *` allows /erg/
    with Crawl-delay 5, which the fetcher honors.
  kb_reason: A second machine-readable rendering of the ERG index to cross-check CAMEO.

