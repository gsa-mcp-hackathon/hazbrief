  # B.4) and from ERG2020. Table 1: of 556 UN-numbered rows, 540 equal ERG 2024 (161 of them
  # also ERG2020) and 16 equal ERG2020 and not 2024 (chlorine's small-spill night distance
  # 1,400 m among them; ERG 2024 p. 292 prints 1.5 km); none equals neither. The update is
  # row by row: "Oxygen difluoride" carries 2020's 7,100 m small-spill night distance and
  # "Oxygen difluoride, compressed" (same UN2190) 2024's 7,200 m. 38 weaponized-agent rows
  # have no UN number to key on.
  edition: "ERG 2024 values with 16 Table 1 rows at ERG2020 values (measured HB-01e); not ERG2016"
