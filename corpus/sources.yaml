- doc_id: erg2024-landing
  priority: 1
  title: Emergency Response Guidebook (ERG) program page
  publisher: US DOT PHMSA
  edition: "accessed 2026-10-19"
  url: https://www.phmsa.dot.gov/training/hazmat/erg/emergency-response-guidebook-erg
