# ── 3. 49 CFR 172.101 Hazardous Materials Table ─────────────────────────────────────────────
- doc_id: cfr49-172-101-ecfr-html
  priority: 3
  title: 49 CFR 172.101 Purpose and use of hazardous materials table (eCFR, current)
  publisher: Office of the Federal Register / GPO (eCFR)
  edition: current (eCFR point-in-time)
  url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-C/part-172/subpart-B/section-172.101
  # HB-98: was `html`; the held copy is the rung-2 session's clipping in the operator's Chrome (the HB-01e form).
  format: md
  identify:
    text: 'source: https://www\.ecfr\.gov/current/title-49/subtitle-B/chapter-I/subchapter-C/part-172/subpart-B/section-172\.101 .*# eCFR :: 49 CFR 172\.101 -- Purpose and use of the hazardous materials table'
  structured_alternative: >-
    XML via the eCFR versioner API (/api/versioner/v1/full/{date}/title-49.xml?section=172.101),
    which eCFR's robots.txt disallows for crawlers; annual CFR XML in GovInfo bulk data
    (cfr49-govinfo-bulk). Per-UN rows for the eight seed materials are on the cameo-unna-* pages.
  plan: fetch
  route: deterministic
  notes: >-
    eCFR answers this client with a redirect to unblock.federalregister.gov (its bot wall),
    which the fetcher refuses as an off-list host; the outcome is a host refusal in substance.
    HB-98: held as a rung-2 clipping (2026-11-03) of the section's prose, paragraphs (a) to
    (l)(3), with the short tables inside it; the Hazardous Materials Table itself and the
    appendices after it (about 430,000 characters of the page) are not in the clipping. The
    table's rows are held structured from GovInfo (cfr49-govinfo-bulk) and the eCFR XML
