  - id: cms_data
    name: CMS data API (Provider of Services, QIES hospital and non-hospital)
    runtime: true
    status: active
    base_url: https://data.cms.gov/data-api/v1/dataset
    docs: [cms-api-faq, cms-api-docs, cms-pos-layout]
    documentation_url: https://data.cms.gov/api-docs
    auth:
      type: none
      key: none
      env_var: null
      signup_url: null
      signup_procedure: null
      notes: >-
        "No, you do not need to register for an API key. Providing a custom user-agent with
        organization name, application name, and contact email is optional" (cms-api-faq).
    rate_limits:
      documented: >-
        1,000 rows per request by default, `size` up to 5,000, with `offset`; on 429 "limit the
        volume of your requests"; on 5xx "use an incremental and randomized back-off"
        (cms-api-faq). robots.txt Crawl-delay 10 (crawlers only).
      observed: none (one probe request)
    terms:
      url: https://data.cms.gov/api-docs
      doc: cms-api-faq
      clauses:
        - Works of the U.S. Government are in the public domain; attribution to the agency is appreciated.
        - Do not give the impression of government endorsement (42 U.S.C. 1320b-10).
    identification: optional User-Agent with contact; the server sends its own.
    cadence: Quarterly; the dataset-type id 8ba0f9b4-... always points at the latest release.
    as_of: >-
      Not in the data response; the release quarter is read from data.cms.gov/data.json (HB-01:
      latest snapshot 2026-07-01, modified 2026-10-16) and reported with every answer. The
      probed data response carried "Last-Modified: Fri, 16 Oct 2026 20:42:15 GMT", the same
      date (api_probe_log, 2026-10-20).
    formats: [JSON, JSON:API, CSV]
    errors: HTTP status.
    probe:
      url: https://data.cms.gov/data-api/v1/dataset/8ba0f9b4-9493-4aa0-9f82-44ea9468d1b5/data?size=1
      as_of: {header: Last-Modified}
    last_verified: "2026-10-20"

  - id: healthdata_socrata
    name: healthdata.gov (Socrata SODA) NHSN datasets
    runtime: false
    status: reference
    base_url: https://healthdata.gov
    docs: [nhsn-facility-capacity-archived, nhsn-jurisdiction-archived, nhsn-hrd-reporting, socrata-app-tokens]
    documentation_url: https://dev.socrata.com/docs/app-tokens.html
    auth:
      type: app_token
      key: optional
      env_var: HEALTHDATA_APP_TOKEN
      signup_url: https://support.socrata.com/hc/en-us/articles/210138558
      signup_procedure: >-
        Sign in to healthdata.gov, open the profile's Developer Settings, and create an app token
        (the Socrata support article above, read as a search snippet: it answers 403 to this
        client). The direct healthdata.gov settings URL was not verified and is not given.
      notes: >-
        Not called at run time: no current facility-level public capacity source exists
        (DN-002 s4; anag-cw7u frozen 2024-05-03). Without a token, SODA 2.1 requests share a
        per-IP throttle pool; SODA 3.0 query requests require a token or a user (snippet).
    rate_limits:
      documented: Without a token, a "much lower throttling limit" per IP; with one, not throttled unless abusive; 429 when throttled (socrata-app-tokens, not held).
      observed: none (one probe request)
    terms:
      url: https://dev.socrata.com/docs/app-tokens.html
      doc: socrata-app-tokens
      clauses:
        - Send the token in the X-App-Token header (preferred) or $$app_token.
    identification: app token when used.
    cadence: anag-cw7u last updated 2024-05-03 and no longer updated (HB-01 s4).
    as_of: rowsUpdatedAt in the dataset metadata.
    formats: [JSON, CSV]
    errors: HTTP status with a JSON body.
    probe:
      url: https://healthdata.gov/api/views/anag-cw7u.json
      as_of: {json: [rowsUpdatedAt]}
    last_verified: "2026-10-20"

