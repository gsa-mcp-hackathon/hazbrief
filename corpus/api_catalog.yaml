# HB-06 API access catalog (HB-06; DN-002 s3b).
# HAND-AUTHORED from the held documentation (each `docs:` entry is a corpus/sources.yaml doc_id,
# admitted to the corpus graph (held privately)) and from discovery of 2026-10-20. What a probe observed lives
# in corpus/api_probe_log.jsonl (scripts/probe_apis.py); `last_verified` here is the date of the
# latest probe row for the API and is checked against it by tests/test_api_catalog.py.
#
# Every API the server calls is catalogued before any tool calls it. `runtime: true` is a call the
# server makes per incident; `false` is build-time reference or a candidate. The server identifies
# itself on every call with settings.user_agent (DN-002 s1: `hazbrief-mcp/<version> (+repo url)`),
# honors the documented limits below, and never enumerates.
#
# A quote is verbatim from the cited document; "(snippet)" marks a search-result snippet where the
# page itself could not be read by this client.

apis:
  - id: nws
    name: National Weather Service API
    runtime: true
    status: active
    base_url: https://api.weather.gov
    docs: [nws-api-docs, nws-alerts-docs, nws-api-faq, nws-api-openapi, nws-disclaimer]
    documentation_url: https://www.weather.gov/documentation/services-web-api
    auth:
      type: none
      key: none
      env_var: null
      signup_url: null
      signup_procedure: null
      notes: >-
        "A User Agent is required to identify your application ... This will be replaced with an
        API key in the future" (nws-api-docs). The OpenAPI spec (3.12.2) defines an `API-Key`
        header "testing ... on certain endpoints"; no key is issued to the public as of 2026-10-20.
    rate_limits:
      documented: >-
        "The rate limit is not public information, but allows a generous amount for typical use"
        and a limited request "may be retried after the limit clears (typically within 5
        seconds)" (nws-api-faq). Alerts: "no more than every 30 seconds" (nws-alerts-docs).
      observed: none (one probe request)
    terms:
      url: https://www.weather.gov/disclaimer
      doc: nws-disclaimer
      clauses:
        - NWS web content is "in the public domain, unless specifically noted otherwise".
        - Logos may not be used without permission; do not imply endorsement or affiliation with NOAA/NWS.
        - Information is provided "as is".
    identification: >-
      User-Agent required; a request without one can be refused 403 (nws-api-faq). The NWS asks for
      an application identifier and a contact; DN-002 s1 fixes the server's as
      `hazbrief-mcp/<version> (+https://github.com/brockwebb/hazbrief-mcp)`.
    cadence: >-
      Not documented. Gridpoint data carry `updateTime` (when the forecast office's grid was
      received) and responses carry Last-Modified and Cache-Control; the server reports those, never
      an assumed cadence. /points mappings "don't change very often" and may be cached.
    as_of: >-
      Gridpoint `updateTime`; alert `sent`/`effective`. The probed /points response carried no
      Last-Modified, and "Cache-Control: public, max-age=86400" (api_probe_log, 2026-10-20): a
      point mapping may be cached for a day.
    formats: [application/geo+json (default), application/ld+json, CAP (alerts), application/problem+json (errors)]
    errors: application/problem+json with type, title, status, detail, instance, correlationId.
    probe:
      url: https://api.weather.gov/points/38.8894,-77.0352
      as_of: {header: Expires}
    last_verified: "2026-10-20"

  - id: census_data
    name: Census Data API (ACS 5-year detailed tables; 2020 DHC; Community Resilience Estimates)
    runtime: true
    status: active
    base_url: https://api.census.gov/data
    docs: [census-api-user-guide, census-api-query-limits, census-api-terms, census-api-key-signup, census-acs5-2024-dataset, census-dhc-2020-p18]
    documentation_url: https://www.census.gov/data/developers/guidance/api-user-guide.html
    auth:
      type: key
      key: required
      env_var: CENSUS_API_KEY
      signup_url: https://api.census.gov/data/key_signup.html
      signup_procedure: >-
        Submit organization and an email address (ending .com, .net, .org, .gov or .edu) on the
        signup page; the key arrives by email with a link that activates it. Append `&key=<key>`
        to each query.
      notes: >-
        "An API key must be used with all data queries made to the Census Data API"
        (census-api-query-limits, revised 2026-05). The keyless probe below shows what the
        server sees without one.
    rate_limits:
      documented: '"You can include up to 50 variables in a single API query" (census-api-query-limits). No per-key rate is published.'
      observed: none (one probe request)
    terms:
      url: https://www.census.gov/data/developers/about/terms-of-service.html
      doc: census-api-terms
      clauses:
        - 'Required notice: "This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau."'
        - The Census Bureau name may not be used to imply endorsement.
        - Use of the API may be temporarily or permanently blocked for violations.
    identification: none required beyond the key; the server sends its User-Agent.
    cadence: >-
      ACS 5-year annual (2020-2024 released 2026-01-29); 2020 DHC static; CRE annual (the 2024
      dataset, /data/2024/cre, "modified" 2025-11-26 in api.census.gov/data.json). HB-09: the CRE
      dataset publishes estimates and rates, no margin of error variable (variables.json,
      2026-10-21).
    as_of: the dataset vintage in the request path (/data/2024/acs/acs5).
    formats: [application/json (array of rows, first row the header)]
    errors: HTTP status with an HTML or text body.
    probe:
      url: https://api.census.gov/data/2024/acs/acs5?get=NAME,B01003_001E&for=county:001&in=state:11
      as_of: {path_vintage: "/data/2024/"}
    last_verified: "2026-10-20"

