# HB-22 step 4: the extraction run over the units HB-22 admits (HB-22).
# HB-14b's bulk script and its approval procedure, reused as they are; this file differs from corpus/extract_bulk.yaml
# only in what is HB-22's own: its evidence version, job and release prefixes, progress log, the evidence versions
# whose units are already extracted, and the tier order. The instrument (prompts, segment rule, roles, transport) is
# the graph's; the page exclusion, spend node and token cap are the pilot plan's.

plan: corpus/extract_pilot.yaml
evidence_version: hb22_bulk
job_prefix: hb22
release_prefix: hb22_bulk
release_every: 10

#: Units extracted under the current CLI in HB-14's pilot (units.jsonl) and HB-14b's bulk run (bulk_state.jsonl
#: `committed` rows; `prior_keys` reads both shapes). A unit whose key is in either is skipped.
already_extracted: [hb14_pilot_cli309, hb14b_bulk]

control: hb14_pilot_cli309/extract_control.json
#: The lock's CLI at start is recorded; a move no longer stops the run (HB-31).
lock_file: ../seldon/models/models.lock.yaml

passes: 3
systemic_wait_seconds: 600
progress_seconds: 60
progress_log: logs/2026-10-23_HB-22_bulk_progress.log
state_file: bulk_state.jsonl

#: HB-22 **Spend:** "open for extraction (HB-14 ADDENDUM-01 stands; HB-14b's bulk script and its approval procedure
#: reused as they are)".
#: HB-22 ADDENDUM-00: every job's approval is written before its first call from this block. `date` is the
#: ruling's (ADDENDUM-00, 2026-10-23; was 2026-10-22, HB-14b's). Run 2 (started 15:24 UTC) loaded the earlier
#: block, so its approvals quote the earlier words; their file header cites ADDENDUM-00.
approval:
  operator: Brock Webb
  date: "2026-10-23"
  words: >-
    HB-22 ADDENDUM-00 (operator, 2026-10-23 10:08): "Those should never have been fails. Those should have been a
    hold for authorization and start another document." Under an open budget the authorization is given in
    advance.
    HB-14b ADDENDUM-00 (operator, 2026-10-22 22:12): "if it has a problem, just kick it out to the try again and
    save whatever's saved on the checkpoint, and then just pick up the next one and keep on going." HB-14
    ADDENDUM-01 (operator, 2026-10-22 18:05): budget open, no limits. HB-22 Spend line (2026-10-23): open for
    extraction, HB-14 ADDENDUM-01 stands.

