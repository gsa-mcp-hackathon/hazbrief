# Workbench API access catalog (HB-49; DN-002 s3b's pattern, HB-06).
# HAND-AUTHORED, in corpus/api_catalog.yaml's schema, for the APIs the workbench (src/hazbrief/brief) calls and no
# tool does: the state linear-referencing services its milepost derivation reads (DN-013 section 5.3).
#
# Why a file of its own: corpus/api_catalog.yaml is "every live API the server calls" (DN-002 s3b), and it is an
# admitted corpus document with claims cut from its text, so a change to it is a change to the text those claims are
# anchored to (HB-49 RESULT: hb01b_17's release stopped on claims-reachable, 12 of its 17 claims unreachable, when
# these entries were first written there). The workbench's APIs are not the server's, and this file carries none.
#
# Probed with `uv run python scripts/probe_apis.py --catalog corpus/workbench_api_catalog.yaml`; the rows go to the
# same corpus/api_probe_log.jsonl, and `last_verified` is checked against them by tests/test_api_catalog.py.

apis:
  - id: pasda_penndot
    name: PennDOT RMS layers on PASDA (ArcGIS MapServer)
    runtime: false
    status: active
    base_url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/PennDOT/MapServer
    docs: [pasda-penndot-interstate-mile-markers-layer, pasda-penndot-interstate-mile-markers-metadata, pasda-penndot-state-roads-metadata, penndot-location-referencing-system]
    documentation_url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/PennDOT/MapServer/0?f=json
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: '"maxRecordCount": 1000 per query (layer description).'
      observed: none (HB-49 step 2, 6 requests)
    terms:
      url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/PennDOT/MapServer/0?f=json
      doc: pasda-penndot-interstate-mile-markers-layer
      clauses:
        - 'copyrightText "Pennsylvania Department of Transportation"; the PASDA metadata records state no use constraint (pasda-penndot-state-roads-metadata).'
    identification: none required.
    cadence: Not stated; each layer is named by its extract month ("Pa Interstate Mile Markers 2026_07").
    as_of: The layer name's extract month and each feature's GIS_UPDATE.
    formats: [JSON, GeoJSON]
    errors: ArcGIS JSON error object (HTTP 200).
    layers:
      interstate_mile_markers: pasda/PennDOT/MapServer/0
      state_roads: pasda/PennDOT/MapServer/4
    probe:
      url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/PennDOT/MapServer/0?f=json
      as_of: {json: [name]}
    last_verified: "2026-10-27"

