  # HB-50: the Census Geocoder's one-line address endpoint, which the workbench's address derivation reads per
  # incident (DN-013 section 5.4). corpus/api_catalog.yaml `census_geocoder` is the server's own batch use (the
  # hospital file, geocoded once); this is a separate entry for a separate caller of the same host.
  - id: census_geocoder_locations
    name: Census Geocoder one-line address endpoint (locations/onelineaddress)
    runtime: false
    status: active
    base_url: https://geocoding.geo.census.gov/geocoder
    docs: [census-geocoder-api-docs, census-geocoder-api-pdf, census-geocoder-user-guide, census-geocoder-faq, census-api-terms]
    documentation_url: https://geocoding.geo.census.gov/geocoder/Geocoding_Services_API.html
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: a single address per call; batch files up to 10,000 addresses (the service's documentation).
      observed: none (HB-50; once a 302 to outage.census.gov and once a read timeout, 2026-10-27 04:56, then 200s)
    terms:
      url: https://www.census.gov/data/developers/about/terms-of-service.html
      doc: census-api-terms
      clauses:
        - A public federal service; no key (DN-003 section 1).
    identification: none required.
    cadence: 'The benchmark named in the request: "Generally, the Public_AR_Current benchmark refers to the most current or last released benchmark" (census-geocoder-user-guide).'
    as_of: The benchmark and the request date; responses carry "Cache-Control private, no-store" and no release date.
    formats: [JSON]
    errors: 'An outage is a 302 to https://outage.census.gov/unavailable.html (HB-48 fetch log); an unmatched address is "addressMatches": [].'
    probe:
      url: https://geocoding.geo.census.gov/geocoder/benchmarks
      as_of: {json: [benchmarks]}
    last_verified: "2026-10-27"

  # The USGS Hydro Network-Linked Data Index, which the workbench's downstream path navigates (HB-54; DN-015 section
  # 3). No tool calls it. It navigates NHDPlus V2 comids; it lists no 3DHP feature source (HB-54 probe of
  # linked-data?f=json: 21 sources, none 3DHP).
  - id: nldi
    name: USGS Hydro Network-Linked Data Index (NLDI)
    runtime: false
    status: active
    base_url: https://api.water.usgs.gov/nldi
    docs: [usgs-nldi-navigation-docs]
    documentation_url: https://api.water.usgs.gov/docs/nldi/navigation
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated (usgs-nldi-navigation-docs).
      observed: 'slow and intermittent (HB-54): comid/position answered in 54 s and 116 s, past the client''s 30 s, and
        once a read timeout; navigation in 43 s; 502 on four calls during one recording run, 200 on the re-run.'
    terms:
      url: https://api.water.usgs.gov/docs/nldi/navigation
      doc: usgs-nldi-navigation-docs
      clauses:
        - A US Government work and a public federal service; no key.
    identification: none required.
    cadence: Not stated; the index is NHDPlus V2 (a fixed release) with its linked feature sources.
    as_of: 'None served: the responses carry no Date or Last-Modified, only "Cache-Control: public, max-age=3600" (HB-54 probe). NHDPlus V2 is a fixed release; the retrieval time is the as-of.'
    formats: [JSON, GeoJSON]
    errors: HTTP status (502 observed); an unknown comid answers 404.
    probe:
      url: https://api.water.usgs.gov/nldi/linked-data?f=json
      as_of: {header: Date}
    last_verified: "2026-10-27"

  # County Business Patterns, which the workbench's establishments table reads (HB-55; DN-015 section 4). The server's
