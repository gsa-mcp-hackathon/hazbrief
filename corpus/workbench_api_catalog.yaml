  # The USGS Elevation Point Query Service, which the workbench's terrain panel reads (HB-55; DN-015 section 5).
  - id: epqs
    name: USGS Elevation Point Query Service (EPQS) v1
    runtime: false
    status: active
    base_url: https://epqs.nationalmap.gov/v1
    docs: [usgs-epqs-api-docs, usgs-3dep-13-arcsec-dem-metadata]
    documentation_url: https://epqs.nationalmap.gov/v1/docs
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated.
      observed: 'about 3 s per point on the HB-55 recording (the probe answered at once); robots.txt answers 403 "Missing
        Authentication Token" (an API gateway), which RFC 9309 reads as unavailable, so access is allowed.'
    terms:
      url: https://epqs.nationalmap.gov/v1/docs
      doc: usgs-3dep-13-arcsec-dem-metadata
      clauses:
        - A US Government work and a public federal service; no key.
    identification: none required.
    cadence: 'The best available 3DEP DEM at the point; the answer names its resolution (1 m at the water fixture) and,
      with includeDate, its acquisition date.'
    as_of: The DEM's acquisition date when asked (includeDate); the recorder asks without it.
    formats: [JSON]
    errors: 'A point with no data answers -1000000 (elevatr documentation; derive.terrain counts it as not answered).'
    probe:
      url: https://epqs.nationalmap.gov/v1/json?x=-77.724&y=39.722&wkid=4326&units=Meters&includeDate=true
      as_of: {json: [attributes]}
    last_verified: "2026-10-27"

  # The USGS 3DEP elevation ImageServer, whose getSamples reads a sample set in one GET (HB-59; DN-015 section 5). EPQS
  # (above) stays its fallback.
  - id: usgs_3dep
    name: USGS 3DEPElevation ImageServer (getSamples)
    runtime: false
    status: active
    base_url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
    docs: [usgs-3dep-elevation-imageserver, esri-imageserver-get-samples, usgs-3dep-13-arcsec-dem-metadata]
    documentation_url: https://developers.arcgis.com/rest/services-reference/enterprise/get-samples/
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated.
      observed: 'a URL past about 8,200 characters answers 414 URI Too Long (HB-59 probe: 8,201 answered 200, 8,531 did
        not), so a 260-point multipoint is about the most one GET carries; 150 points answered in 2.6 s. robots.txt
        answers 403, which RFC 9309 reads as unavailable, so access is allowed.'
    terms:
      url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer?f=json
      doc: usgs-3dep-elevation-imageserver
      clauses:
        - A US Government work and a public federal service; no key ("USGS National Map 3D Elevation Program (3DEP)").
    identification: none required.
    cadence: 'The best available 3DEP DEM at each point (the answer names its resolution: 1 m at the water fixture), the
      same DEMs EPQS reads; the service''s copyrightText names its refresh ("October 01, 2026" on the HB-59 probe).'
    as_of: The service's copyrightText date; a sample answer carries none.
    formats: [JSON]
    errors: 'An ArcGIS error object with HTTP 200; a sample with no data answers "NoData" (derive.terrain counts it as
      not answered).'
    probe:
      url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer?f=json
      as_of: {json: [copyrightText]}
    last_verified: "2026-10-28"

  # MRLC's NLCD WMS, which the terrain panel's land-cover class read (HB-55; DN-015 section 5) until HB-59 ADDENDUM-02
  # found CONUS gone from it. Superseded for CONUS by usgs_annual_nlcd; probe_apis.py never probes a superseded row.
  - id: mrlc_nlcd
    name: MRLC GeoServer WMS (NLCD land cover)
    runtime: false
    status: superseded
    superseded:
      scope: CONUS (the conterminous US). The Alaska, Hawaii and Puerto Rico coverages are still listed here.
      by: usgs_annual_nlcd
      date: "2026-10-28"
      basis: 'mrlc-data-services-page, re-fetched 2026-10-28, lists www.mrlc.gov/geoserver/ only for the legacy Alaska,
        Hawaii and Puerto Rico coverages and links CONUS Annual NLCD to dmsdata.cr.usgs.gov. NLCD_2021_Land_Cover_L48 is
        gone, and requests for it hung rather than answering 404: no GeoServer request from 22:49 EDT 2026-10-27
        returned data; of 90 overnight polls, 88 timed out, one answered 502 and one 500; a 04:03 EDT GetCapabilities
        timed out (HB-59 RESULT section 2 and RESULT ADDENDUM-01). Do not probe this row for CONUS.'
      docs: [mrlc-data-services-page, usgs-annual-nlcd-access]
    base_url: https://www.mrlc.gov/geoserver/mrlc_display/wms
    docs: [mrlc-data-services-page, mrlc-nlcd-class-legend]
    documentation_url: https://www.mrlc.gov/data-services-page
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated.
      observed: none (HB-55)
    terms:
      url: https://www.mrlc.gov/data-services-page
      doc: mrlc-data-services-page
      clauses:
        - None stated on the page; MRLC is a consortium of federal agencies led by USGS.
    identification: none required.
    cadence: 'One layer per NLCD release; the newest queryable single-year land cover is NLCD_2021_Land_Cover_L48 (HB-55
      GetCapabilities; Annual NLCD appears only as 1985-2023 change summaries).'
    as_of: The layer's year.
    formats: [JSON (GetFeatureInfo application/json), XML (GetCapabilities)]
    errors: OGC service exception.
    probe:
      url: https://www.mrlc.gov/geoserver/mrlc_display/wms?service=WMS&version=1.1.1&request=GetFeatureInfo&layers=NLCD_2021_Land_Cover_L48&query_layers=NLCD_2021_Land_Cover_L48&styles=&srs=EPSG:4326&bbox=-77.7241,39.7219,-77.7239,39.7221&width=3&height=3&x=1&y=1&info_format=application/json&feature_count=1
      as_of: {json: [timeStamp]}
    # The date the supersession was verified (superseded.basis); the probe above is HB-55's, kept as history.
    last_verified: "2026-10-28"

  # USGS's Annual NLCD land-cover WMS on dmsdata, which replaces mrlc_nlcd for CONUS (HB-59 ADDENDUM-02). No OGC
  # request to it answered on 2026-10-28 from 13:03 to 14:35 UTC (HB-59 RESULT ADDENDUM-02), so it has no probe. It is
  # not read: the terrain panel's land cover reads nlcd_cog_mirror (HB-59 ADDENDUM-03), and no task waits on this row.
  - id: usgs_annual_nlcd
    name: USGS dmsdata GeoServer WMS (Annual NLCD land cover, CONUS)
    runtime: false
    status: active
    base_url: https://dmsdata.cr.usgs.gov/geoserver/mrlc_Land-Cover-Native_conus_year_data/wms
    docs: [usgs-annual-nlcd-access, mrlc-data-services-page, mrlc-nlcd-class-legend]
    documentation_url: https://www.usgs.gov/centers/eros/how-can-i-access-and-download-annual-nlcd-data
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated.
      observed: 'none answered: 4 GetCapabilities, 22 GetFeatureInfo and 1 GetMap from 13:03 to 14:35 UTC 2026-10-28;
        one GetCapabilities answered 200 in 14.2 s, cut off at 199,702 bytes (HB-59 RESULT ADDENDUM-02).'
    terms:
      url: https://www.usgs.gov/centers/eros/how-can-i-access-and-download-annual-nlcd-data
      doc: usgs-annual-nlcd-access
      clauses:
        - 'None stated on the page; a USGS EROS service. mrlc-data-services-page: "No user name or password is needed."'
    identification: none required.
    cadence: One image per product year on the layer's time dimension (Annual NLCD Collection 1.2 spans 1985 to 2025,
      HB-59 ADDENDUM-02); not yet read from the capabilities.
    as_of: The product year (the time dimension's value the request names).
    formats: [XML (GetCapabilities), 'GetFeatureInfo: text/plain, text/html, application/json, GML, text/xml (the
        capabilities, HB-59 RESULT ADDENDUM-02)']
    errors: OGC service exception; on 2026-10-28, hangs and empty replies.
    layers:
      land_cover: Land-Cover-Native_conus_year_data
    probe: null
    probe_reason: 'No request answered on 2026-10-28 (HB-59 RESULT ADDENDUM-02). The next execution of HB-59 probes a
      GetFeatureInfo at the water fixture''s spill and records it here.'
    last_verified: null

  # The public-domain Annual NLCD COG mirror the terrain panel's land cover reads by HTTP range: the class at the spill,
  # the class mix over the footprint and the classes along the downstream path, from one windowed read (HB-59
  # ADDENDUM-03; hazbrief.brief.cog).
  - id: nlcd_cog_mirror
    name: Annual NLCD Collection 1.2 Cloud Optimized GeoTIFFs (NRP Nautilus S3 mirror, published on Source Cooperative)
    runtime: false
    status: active
    base_url: https://s3-west.nrp-nautilus.io/public-land-cover/nlcd/
    docs: [nlcd-cog-mirror-stac, source-coop-cboettig-land-cover, mrlc-nlcd-class-legend]
    documentation_url: https://s3-west.nrp-nautilus.io/public-land-cover/nlcd/stac-collection.json
    auth: {type: none, key: none, env_var: null, signup_url: null, signup_procedure: null, notes: null}
    rate_limits:
      documented: none stated.
      observed: none (HB-59 ADDENDUM-03; a 64 KiB range answered 206 in 0.31 s, a 64 KB tile in under 1 s)
    terms:
      url: https://s3-west.nrp-nautilus.io/public-land-cover/nlcd/stac-collection.json
      doc: nlcd-cog-mirror-stac
      clauses:
        - '"license": "public-domain"; the collection''s license link is USGS''s copyrights-and-credits policy; MRLC
          Consortium / USGS EROS is named "producer" and "licensor" (nlcd-cog-mirror-stac).'
    identification: none required.
    cadence: 'One file per map year, nlcd-<year>-cog.tif, 1985 to 2025 (20 years; the STAC temporal extent ends
      2025-12-31). The 2025 file''s Last-Modified is Fri, 31 Jul 2026 02:51:33 GMT.'
    as_of: The map year in the file name, and the file's Last-Modified.
    formats: ['GeoTIFF, cloud-optimized: classic TIFF, uint8, 512 x 512 tiles, Deflate with Predictor 2, EPSG:4326,
        nodata 250, nine overviews (HB-59 RESULT ADDENDUM-03 section 2)', JSON (STAC collection)]
    errors: S3 XML error document (404 NoSuchKey or NoSuchBucket).
    reprojection: 'From Albers (EPSG:5070) to WGS84 with nearest-neighbor (class codes preserved) (nlcd-cog-mirror-stac).
      No checksum is published against USGS; the object store''s x-amz-meta-md5chksum for the 2025 file is
      puqsSg3T4UFoxPuJ6uFYZw== (base64 MD5, set by the uploader), 1,594,625,912 bytes.'
    probe:
      url: https://s3-west.nrp-nautilus.io/public-land-cover/nlcd/stac-collection.json
      as_of: {header: Last-Modified}
    last_verified: "2026-10-28"

