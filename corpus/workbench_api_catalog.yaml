    name: Census Data API, County Business Patterns (data/2023/cbp)
    runtime: false
    status: active
    base_url: https://api.census.gov/data/2023/cbp
    docs: [census-cbp-api-docs, census-api-terms, census-api-query-limits]
    documentation_url: https://www.census.gov/data/developers/data-sets/cbp-zbp/cbp-api.html
    auth: {type: key, key: required, env_var: CENSUS_API_KEY, signup_url: https://api.census.gov/data/key_signup.html, signup_procedure: null, notes: 'DN-003 section 1: the one key; never written to a recorded exchange.'}
    rate_limits:
      documented: up to 50 variables per query; no per-key rate published (census-api-query-limits).
      observed: none (HB-55)
