# The release routing table (HB-120; DN-020 ADDENDUM-02 section 2 item 3). AUTHORED.
#
# One block per ERG 2024 orange guide; one row per storage state the guide serves, or one `any` row for a guide
# whose route does not depend on the state. `route`: two_phase_jet | evaporating_pool | instantaneous |
# not_applicable. `loc_class` (a routed row): toxic (AEGL-2, else the NIOSH IDLH: HB-119 ADDENDUM-00) |
# flammable_lfl | oxygen_deficiency. `reason` (a not_applicable row): the responder's sentence, quoting the ERG.
# `basis`: the guide's own POTENTIAL HAZARDS words and the PDF page they are printed on, verified on the held
# page by `scripts/build_packs.py release_routing` (a row with no basis, or a basis not on its page, fails the
# build). The rules and their receipts are in `rules` below; packs/SCHEMA.md documents the pack.
#
# First written by the HB-120 evidence (held privately) from the ERG pack's text; edit this file now.

doc: erg2024-en-pdf
rules:
  primary_hazard_first: {page: 348, quote: "Primary potential hazard is listed first."}
  polymerization_letter: {page: 347, quote: "The letter (P) following the guide number in the yellow and blue sections identifies materials that present a polymerization hazard under certain conditions."}
guides:
  "111":
    title: "Mixed Load/Unidentified Cargo"
    rows:
    - state: any
      route: not_applicable
      reason: "No dispersion model applies: Guide 111 is the guide for a mixed load or an unidentified cargo, and no release can be modelled for a material nobody has identified. The ERG warns \"May explode from heat, shock, friction or contamination\"; identify the material, then the brief can route it."
      basis: {page: 154, quote: "May explode from heat, shock, friction or contamination."}
  "112":
    title: "Explosives* - Division 1.1, 1.2, 1.3 or 1.5"
    rows:
    - state: any
      route: not_applicable
      reason: "No dispersion model applies: the ERG states this guide's hazard as blast and fragments, \"MAY EXPLODE AND THROW FRAGMENTS 1600 METERS (1 MILE) OR MORE IF FIRE REACHES CARGO\", not a drifting vapour cloud. The guide's isolation and evacuation distances are the response."
      basis: {page: 156, quote: "MAY EXPLODE AND THROW FRAGMENTS 1600 METERS (1 MILE) OR MORE IF FIRE REACHES CARGO."}
  "113":
    title: "Flammable Materials (Wet/Desensitized Explosive)"
    rows:
    - state: any
      route: not_applicable
      reason: "No dispersion model applies: the ERG states this guide's hazard as fire and, once dried out, explosion, \"DRIED OUT material may explode if exposed to heat, flame, friction or shock; treat as an explosive (GUIDE 112)\", not a drifting vapour cloud. The guide's distances are the response."
      basis: {page: 158, quote: "DRIED OUT material may explode if exposed to heat, flame, friction or shock; treat as an explosive (GUIDE 112)."}
  "114":
