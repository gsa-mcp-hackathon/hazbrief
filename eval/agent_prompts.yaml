  - id: x-time-no-zone
    family: adversarial
    text: >-
      Tank truck, placard 1017, large leak on I-81 at the state line, 39.722 -77.724. No fire. Wind
      west 13 km/h. It happened at 1400 on 21 October 2026. Distances?
