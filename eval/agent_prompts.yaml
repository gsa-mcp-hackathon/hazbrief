# HB-16: the agent-level evaluation's prompt set (DN-001 section 6 item 5, the fourth family:
# tool-selection tests; HB-05 P-12). Written before the harness and never tuned to the models
# (HB-16 step 6). An agent gets only the MCP server's tools, their schemas and the server's
# instructions, and one of these messages.
#
# Families (HB-16 "The prompt set"):
#   scenario     one per fixtures/scenarios.yaml scenario, phrased as a first-arriving unit's radio
#                or CAD message. The GPS fix is given because a CAD or AVL message carries one and
#                no tool geocodes a road name. `expected_args` must equal the scenario's inputs
#                (tests/test_agent_eval.py checks every one against fixtures/scenarios.yaml).
#   ambiguity    an input the ERG answers with several candidates. Version 1 (HB-16): the agent
#                asks back with the candidates and draws no footprint; 1 of 36 episodes passed,
#                and 31 drew every candidate and briefed the largest (LN-07 F6). Version 2
#                (HB-18, A-3): the server draws every candidate and marks the largest
#                governing (the ERG's most-conservative-guide rule, PDF p. 9), so the reply
#                names every candidate and the governing one with its distance, carries the
#                ambiguous_material flag's wording (`ambiguity_flag_wording`), and invents no
#                other candidate (no ID or guide number outside `known_ids`). Drawing is
#                expected; `expected_args` is the load as reported, in one call.
#   out_of_scope a request the server does not serve (DN-001 section 4); the agent says so, citing
#                the tool's own limit, and produces no number for it.
#   adversarial  an input that tempts a silent resolution; the agent uses the tool's refusal or asks.
#
# Scoring (scripts/agent_eval.py score), per episode:
#   tools        precision and recall of the set of tool names called against `expected_tools`;
#                a call to a tool in `allowed_tools` is neither required nor penalized; a call to a
#                tool in `forbidden_tools` is reported. `order` names pairs that must be in order.
#   args         `expected_args` against the arguments of the first call of each tool that takes an
#                incident: material, placard and guide_number by the ERG resolver (UN1017, 1017 and
#                Chlorine are one material); latitude and longitude within `args_tolerance.m`; wind
#                direction and speed within their tolerances; fire_involved, where_spilled (absent is
#                land, the schema's default), spill_size, and incident_time as one instant.
#   grounding    (HB-13's grounding, applied to a reply) every number in the final reply must be a
#                value a tool output of the episode or the prompt holds: equal, or rounded to the
#                precision the reply wrote; a source's number may be glued to a letter ("#p343",
#                "T07:23"); a clock time HH:MM also counts as HHMM. Every run of capitalized words
#                (a name) must have its words in the outputs, the prompt, or the server's own tool
#                descriptions and instructions. (Calibrated on the pilot, before the matrix:
#                HB-16 RESULT section 2.)
#   facts        `must_contain`: each entry is a list of alternatives, one of which must occur in the
#                reply; `must_not_contain`: regular expressions that must not match the reply.
#   refusal      out_of_scope and adversarial: no ungrounded number, and `key_terms` (any one of each
#                inner list) present in the reply.
#   ambiguity    (version 2) `candidates_any`, `governing_any` and `governing_distance_any` each
#                present, every `ambiguity_flag_wording` group present, no invented ID or guide.
#   stylebook    hazbrief.stylecheck over the reply; reported, not gated (the agent is not the server).

# Version 3 (HB-16b): the two scenario prompts for HB-18's unresolved-load scenarios added; no
# other prompt, rule or check changed.
version: 3
# HB-18: FR-AMB-01's wording, one alternative of each group: its sentence ("The distances shown
# are the largest among them") and its ERG response ("When specific information, such as ID
# number or proper shipping name, becomes available ...", ERG 2024 PDF p. 9).
ambiguity_flag_wording:
  - ["largest", "most conservative"]
  - ["ID number", "shipping name", "shipping paper", "UN number"]
# A successful call of a tool that the server says runs others counts as calling them (its own
# description: "The server runs assess_incident, protective_action_footprint, population_at_risk,
# facilities_in_footprint, receiving_hospitals and material_response_guidance on it"). Declared on
# the pilot, before the matrix (HB-16 RESULT section 2); `recall_strict` is reported beside it.
covers:
  build_ics_201: [assess_incident, protective_action_footprint, population_at_risk, facilities_in_footprint, receiving_hospitals, material_response_guidance]
args_tolerance:
  m: 10
  wind_direction_deg: 10
  wind_speed_kmh: 1.0

scenario_tools: &scenario_tools
  expected_tools: [assess_incident, protective_action_footprint, population_at_risk, facilities_in_footprint, build_ics_201]
  allowed_tools: [material_response_guidance, receiving_hospitals]
  order:
    - [assess_incident, protective_action_footprint]
    - [protective_action_footprint, population_at_risk]
    - [protective_action_footprint, facilities_in_footprint]

refusal_tools: &refusal_tools
  expected_tools: []
  allowed_tools: [assess_incident, protective_action_footprint, material_response_guidance, receiving_hospitals, population_at_risk, facilities_in_footprint, build_ics_201]

