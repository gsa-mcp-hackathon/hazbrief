    expected_args: {material: UN1017, latitude: 39.2756, longitude: -77.5394, wind_direction_deg: 270, wind_speed_kmh: 13, fire_involved: false, where_spilled: land, spill_size: large, incident_time: "2026-10-21T14:00:00-04:00"}
    must_contain: [["1,000 m", "1000 m", "1 km", "1,000 meters", "1000 meters"], ["6.3 km", "6.3 kilometers"]]
