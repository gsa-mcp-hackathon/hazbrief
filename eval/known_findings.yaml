# yet fixed, by part, each as `<check>|<id>`. test_eval_invariants.py (a test held privately) (slow) asserts each
# part fails exactly these: a new failure fails the test, and so does a finding listed here that no
# longer occurs (delete its line when it is fixed). Each is filed in
# HB-05 section 3 with its follow-on.
#
# HB-15 fixed the last two: F-3 (guides 111, 112 and 114 are reached through the placard and
# guide-number entry points) and F-4 (FR-G115-MAY_EXPLODE_WHEN_HEATED's redundant guide_page term,
# removed by absorption). HB-16 closed P-12, the agent-level evaluation of DN-001 family 4
# (scripts/agent_eval.py; LN-07). Its own filings, A-1 to A-6,
